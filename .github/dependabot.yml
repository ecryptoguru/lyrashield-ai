version: 2
updates:
  # JS/TS dependencies (pnpm monorepo — Dependabot reads pnpm-lock.yaml).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk updates into single PRs to reduce review noise.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
        exclude-patterns: ["better-auth", "@better-auth/*", "prisma", "@prisma/*", "pg", "bullmq"]
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
        exclude-patterns: ["better-auth", "@better-auth/*", "prisma", "@prisma/*", "pg", "bullmq"]
      # Better Auth packages must update together to retain compatible exports.
      better-auth:
        patterns: ["better-auth", "@better-auth/*"]
      # Keep the Prisma client, CLI, engines and runtime helpers version-aligned.
      prisma:
        patterns: ["prisma", "@prisma/*"]
    # Sensitive updates stay separate and use the same required compatibility checks.

  # GitHub Actions used in workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Tauri Rust dependencies and pinned container base images.
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
