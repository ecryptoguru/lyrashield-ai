name: Release production

on:
  push:
    branches: [main]

permissions:
  contents: read

# Protected main already requires the three PR checks with an up-to-date base.
# Deploy the exact merge once; do not repeat the PR test/build pipeline.
concurrency:
  group: release-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  routing:
    name: Route the current merged source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      azure-deploy: ${{ steps.classify.outputs.azure-deploy }}
      marketing-deploy: ${{ steps.classify.outputs.marketing-deploy }}
      current-main: ${{ steps.classify.outputs.current-main }}
    steps:
      - name: Checkout merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes since successful production releases
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/classify-main-change-gap.sh

  deploy-azure:
    needs: routing
    if: needs.routing.outputs.current-main == 'true' && needs.routing.outputs.azure-deploy == 'true'
    uses: ./.github/workflows/deploy-azure.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write

  deploy-marketing:
    needs: routing
    if: needs.routing.outputs.current-main == 'true' && needs.routing.outputs.marketing-deploy == 'true'
    uses: ./.github/workflows/deploy-marketing.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
