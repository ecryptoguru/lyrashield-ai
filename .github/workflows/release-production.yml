name: Release production

on:
  push:
    branches: [main]

permissions:
  contents: read

# Verify the exact merged source against genuine PR CI receipts before routing.
# Build once and qualify the exact images before the automated cold fleet rollout.
concurrency:
  group: release-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  routing:
    name: Route the current merged source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      deployments: read
      checks: read
      pull-requests: read
    outputs:
      azure-deploy: ${{ steps.classify.outputs.azure-deploy }}
      marketing-deploy: ${{ steps.classify.outputs.marketing-deploy }}
      current-main: ${{ steps.classify.outputs.current-main }}
    steps:
      - name: Checkout merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Qualify merged source against required PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/qualify-release-source.mjs

      - name: Classify changes since successful production releases
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/classify-main-change-gap.sh

  # Preparation is opt-in through the existing evidence selector and publishes
  # candidate tags only. It grants no qualification or production authority.
  prepare-runtime-images:
    needs: routing
    if: >-
      needs.routing.outputs.current-main == 'true' &&
      needs.routing.outputs.azure-deploy == 'true' &&
      vars.LYRASHIELD_RUNTIME_FLEET_EVIDENCE != ''
    uses: ./.github/workflows/prepare-worker-recovery-candidate.yml
    with:
      source_sha: ${{ github.sha }}
      runtime_qualification: true
    permissions:
      actions: read
      checks: read
      contents: read
      packages: write
      pull-requests: read

  # A normal main push reaches the protected issuer, which managed-signs one
  # exact-artifact record from authenticated evidence. Deployment consumes only
  # that record. LYRASHIELD_RUNTIME_FLEET_EVIDENCE carries independent rollback
  # and inventory selectors; current-run evidence hashes come from immutable
  # native observations. Missing observations produce no release digest.
  qualify-runtime:
    name: Issue the exact-artifact release qualification
    needs: [routing, prepare-runtime-images]
    if: >-
      !cancelled() && needs.routing.result == 'success' &&
      needs.routing.outputs.current-main == 'true' &&
      (vars.LYRASHIELD_RUNTIME_FLEET_EVIDENCE == '' || needs.prepare-runtime-images.result == 'success')
    uses: ./.github/workflows/issue-runtime-qualification.yml
    with:
      runtime_fleet_configuration: ${{ vars.LYRASHIELD_RUNTIME_FLEET_EVIDENCE }}
      prepared_fleet: ${{ needs.prepare-runtime-images.outputs.prepared_fleet }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read

  deploy-azure:
    needs: [routing, qualify-runtime]
    if: >-
      needs.routing.outputs.current-main == 'true' &&
      needs.routing.outputs.azure-deploy == 'true' &&
      needs.qualify-runtime.result == 'success' &&
      needs.qualify-runtime.outputs.runtime_fleet_record_sha256 != ''
    uses: ./.github/workflows/deploy-azure.yml
    with:
      source_sha: ${{ github.sha }}
      cold_release: true
      runtime_fleet_qualification: ${{ needs.qualify-runtime.outputs.runtime_fleet_qualification }}
      runtime_fleet_record_sha256: ${{ needs.qualify-runtime.outputs.runtime_fleet_record_sha256 }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write

  deploy-marketing:
    needs: routing
    if: needs.routing.outputs.current-main == 'true' && needs.routing.outputs.marketing-deploy == 'true'
    uses: ./.github/workflows/deploy-marketing.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
