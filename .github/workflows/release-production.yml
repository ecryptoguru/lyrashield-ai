name: Release production

on:
  push:
    branches: [main]

permissions:
  contents: read

# Verify the exact merged source against genuine PR CI receipts before routing.
# Deploy once without repeating the PR test/build pipeline on main.
concurrency:
  group: release-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  routing:
    name: Route the current merged source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      deployments: read
      checks: read
      pull-requests: read
    outputs:
      azure-deploy: ${{ steps.classify.outputs.azure-deploy }}
      marketing-deploy: ${{ steps.classify.outputs.marketing-deploy }}
      current-main: ${{ steps.classify.outputs.current-main }}
    steps:
      - name: Checkout merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Qualify merged source against required PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/qualify-release-source.mjs

      - name: Classify changes since successful production releases
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/classify-main-change-gap.sh

  qualify-azure-release:
    name: Require a protected qualified release record
    needs: routing
    if: needs.routing.outputs.current-main == 'true' && needs.routing.outputs.azure-deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: azure-production
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.require.outputs.digest }}
    steps:
      - name: Require the protected qualified release digest
        id: require
        env:
          QUALIFIED_RELEASE_DIGEST: ${{ vars.LYRASHIELD_QUALIFIED_RELEASE_DIGEST }}
        run: |
          if [[ ! "$QUALIFIED_RELEASE_DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
            {
              echo "## Azure release held before deployment"
              echo
              echo "No 64-character qualified release digest is configured in the protected \`azure-production\` environment."
              echo "Production will not deploy without a signed qualified release record and rollback tuple."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Set LYRASHIELD_QUALIFIED_RELEASE_DIGEST in the azure-production environment to a qualified release record digest before deploying."
            exit 1
          fi
          echo "digest=$QUALIFIED_RELEASE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy-azure:
    needs: [routing, qualify-azure-release]
    if: needs.routing.outputs.current-main == 'true' && needs.routing.outputs.azure-deploy == 'true'
    uses: ./.github/workflows/deploy-azure.yml
    with:
      source_sha: ${{ github.sha }}
      qualified_release_digest: ${{ needs.qualify-azure-release.outputs.digest }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write

  deploy-marketing:
    needs: routing
    if: needs.routing.outputs.current-main == 'true' && needs.routing.outputs.marketing-deploy == 'true'
    uses: ./.github/workflows/deploy-marketing.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
