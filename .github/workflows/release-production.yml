name: Release production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: release-production-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  routing:
    name: Read CI release routing decision
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      azure-deploy: ${{ steps.routing.outputs.azure-deploy }}
    steps:
      - name: Download CI routing decision
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-routing
          path: ci-routing
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate CI routing decision
        id: routing
        shell: bash
        run: |
          set -euo pipefail
          decision="$(tr -d '[:space:]' < ci-routing/azure-deploy)"
          case "$decision" in
            true|false) ;;
            *) echo "::error::Invalid CI Azure release routing decision."; exit 1 ;;
          esac
          echo "azure-deploy=$decision" >> "$GITHUB_OUTPUT"
          if [ "$decision" = false ]; then
            echo "No Azure runtime changes detected; skipping production release." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-azure:
    needs: routing
    if: needs.routing.outputs.azure-deploy == 'true'
    uses: ./.github/workflows/deploy-azure.yml
    with:
      source_sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
