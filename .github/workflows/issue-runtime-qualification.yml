name: Protected runtime qualification issuer

on:
  workflow_call:
    inputs:
      fresh_sandbox_publication:
        description: "Optional exact fresh sandbox publication selector; never a qualification record"
        type: string
        required: false
        default: ""
      fresh_sandbox_inventory:
        description: "Optional exact independently verified inventory selector; never runtime authority"
        type: string
        required: false
        default: ""
      runtime_fleet_evidence:
        description: "Optional exact authenticated fleet-evidence selectors; the only production release record input"
        type: string
        required: false
        default: ""
      prepared_fleet:
        description: "Exact same-run image tuple, required for automated release issuance"
        type: string
        required: false
        default: ""
      runtime_fleet_configuration:
        description: "Independent rollback and inventory selectors; current-run evidence comes only from immutable native observations"
        type: string
        required: false
        default: ""
    outputs:
      runtime_fleet_qualification:
        description: "Signed exact-artifact release qualification envelope"
        value: ${{ jobs.verify-signing-boundary.outputs.runtime_fleet_qualification }}
      runtime_fleet_record_sha256:
        description: "SHA-256 of the exact signed qualification bytes"
        value: ${{ jobs.verify-signing-boundary.outputs.runtime_fleet_record_sha256 }}

permissions:
  contents: read

jobs:
  verify-signing-boundary:
    # Optional publication verification precedes the fixed health signature.
    # Only an internally constructed held record may be signed. Runtime
    # admission still requires independent inventory and runtime authority.
    # A normal main push reaches this protected issuer through release-production.
    if: >-
      github.repository_id == '1286618458' &&
      github.repository_owner_id == '116722580' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-qualification
    outputs:
      runtime_fleet_qualification: ${{ steps.fleet.outputs.runtime_fleet_qualification }}
      runtime_fleet_record_sha256: ${{ steps.fleet.outputs.runtime_fleet_record_sha256 }}
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Prepare checksum-pinned protected Linux verifier
        if: inputs.fresh_sandbox_publication != '' || inputs.fresh_sandbox_inventory != '' || inputs.runtime_fleet_evidence != '' || inputs.runtime_fleet_configuration != ''
        run: bash .github/scripts/prepare-qualification-verifier.sh
      - name: Authenticate and managed-sign held sandbox publication
        if: inputs.fresh_sandbox_publication != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FRESH_SANDBOX_PUBLICATION: ${{ inputs.fresh_sandbox_publication }}
        run: node .github/scripts/issue-sandbox-publication.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.fresh_sandbox_publication != ''
        with:
          name: held-sandbox-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: sandbox-publication-record.json
          if-no-files-found: error
          retention-days: 7
      - name: Authenticate and managed-sign held independent inventory
        if: inputs.fresh_sandbox_inventory != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FRESH_SANDBOX_INVENTORY: ${{ inputs.fresh_sandbox_inventory }}
        run: node .github/scripts/issue-sandbox-inventory.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.fresh_sandbox_inventory != ''
        with:
          name: held-sandbox-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: sandbox-inventory-record.json
          if-no-files-found: error
          retention-days: 7
      - name: Witness immutable native runtime observations
        if: inputs.runtime_fleet_configuration != ''
        id: evidence-witnesses
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_FLEET_CONFIGURATION: ${{ inputs.runtime_fleet_configuration }}
          PREPARED_RUNTIME_FLEET: ${{ inputs.prepared_fleet }}
        run: node .github/scripts/runtime-fleet-evidence-transport.mjs witness
      - name: Upload native evidence witness
        if: inputs.runtime_fleet_configuration != ''
        id: native-witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence-witnesses.outputs.native_artifact_name }}
          path: ${{ runner.temp }}/lyrashield-runtime-evidence-witnesses/native/paired-witness.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload migration evidence witness
        if: inputs.runtime_fleet_configuration != ''
        id: migration-witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence-witnesses.outputs.migration_artifact_name }}
          path: ${{ runner.temp }}/lyrashield-runtime-evidence-witnesses/migration/paired-witness.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload policy evidence witness
        if: inputs.runtime_fleet_configuration != ''
        id: policy-witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence-witnesses.outputs.policy_artifact_name }}
          path: ${{ runner.temp }}/lyrashield-runtime-evidence-witnesses/policy/paired-witness.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload journal evidence witness
        if: inputs.runtime_fleet_configuration != ''
        id: journal-witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence-witnesses.outputs.journal_artifact_name }}
          path: ${{ runner.temp }}/lyrashield-runtime-evidence-witnesses/journal/paired-witness.json
          if-no-files-found: error
          retention-days: 7
      - name: Authenticate the uploaded current-run evidence selectors
        if: inputs.runtime_fleet_configuration != ''
        id: evidence-selectors
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_FLEET_CONFIGURATION: ${{ inputs.runtime_fleet_configuration }}
          PREPARED_RUNTIME_FLEET: ${{ inputs.prepared_fleet }}
          NATIVE_DIGEST: ${{ steps.evidence-witnesses.outputs.native_digest }}
          MIGRATION_DIGEST: ${{ steps.evidence-witnesses.outputs.migration_digest }}
          POLICY_DIGEST: ${{ steps.evidence-witnesses.outputs.policy_digest }}
          JOURNAL_DIGEST: ${{ steps.evidence-witnesses.outputs.journal_digest }}
          NATIVE_ARTIFACT_ID: ${{ steps.native-witness.outputs.artifact-id }}
          MIGRATION_ARTIFACT_ID: ${{ steps.migration-witness.outputs.artifact-id }}
          POLICY_ARTIFACT_ID: ${{ steps.policy-witness.outputs.artifact-id }}
          JOURNAL_ARTIFACT_ID: ${{ steps.journal-witness.outputs.artifact-id }}
        run: node .github/scripts/runtime-fleet-evidence-transport.mjs locate
      - name: Authenticate and managed-sign the exact-artifact release record
        id: fleet
        if: inputs.runtime_fleet_evidence != '' || inputs.runtime_fleet_configuration != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_FLEET_EVIDENCE: ${{ steps.evidence-selectors.outputs.runtime_fleet_evidence || inputs.runtime_fleet_evidence }}
          PREPARED_RUNTIME_FLEET: ${{ inputs.prepared_fleet }}
        run: node .github/scripts/issue-runtime-fleet-qualification.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.runtime_fleet_evidence != '' || inputs.runtime_fleet_configuration != ''
        with:
          name: runtime-fleet-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-fleet-qualification.json
            runtime-fleet-qualification-receipt.json
            paired-witness.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify issuer identity and exact managed signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/qualification-issuer-health.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-issuer-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-issuer-health.json
          if-no-files-found: error
          retention-days: 7
