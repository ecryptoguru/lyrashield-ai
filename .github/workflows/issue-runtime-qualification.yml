name: Protected runtime qualification issuer

on:
  workflow_call:
    inputs:
      fresh_sandbox_publication:
        description: "Optional exact fresh sandbox publication selector; never a qualification record"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify-signing-boundary:
    # Optional publication verification precedes the fixed health signature.
    # Runtime issuance stays held; candidate bytes are never signed here.
    if: >-
      github.repository_id == '1286618458' &&
      github.repository_owner_id == '116722580' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-qualification
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Authenticate fresh sandbox publication and bounded coverage
        if: inputs.fresh_sandbox_publication != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FRESH_SANDBOX_PUBLICATION: ${{ inputs.fresh_sandbox_publication }}
        run: node .github/scripts/verify-sandbox-publication.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.fresh_sandbox_publication != ''
        with:
          name: sandbox-publication-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: sandbox-publication-verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify issuer identity and exact managed signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/qualification-issuer-health.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-issuer-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-issuer-health.json
          if-no-files-found: error
          retention-days: 7
