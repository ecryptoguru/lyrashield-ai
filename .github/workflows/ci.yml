name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: SCA & Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high --prod

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      marketing: ${{ steps.classify.outputs.marketing }}
      app: ${{ steps.classify.outputs.app }}
      desktop: ${{ steps.classify.outputs.desktop }}
      shared: ${{ steps.classify.outputs.shared }}
      azure-deploy: ${{ steps.classify.outputs.azure-deploy }}
    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test path classifier
        shell: bash
        run: bash .github/scripts/tests/test-classify-paths.sh

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          # Determine the diff range.
          # - pull_request: base..head SHA from the event payload.
          # - push to main: before..after, falling back to HEAD~1 for the
          #   first push (before = 0000000).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            else
              BASE="$BEFORE"
            fi
            HEAD="${{ github.event.after }}"
          fi
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="HEAD~1"
          fi
          if ! git rev-parse --verify "$HEAD" >/dev/null 2>&1; then
            HEAD="HEAD"
          fi

          files=$(git diff --name-only "$BASE" "$HEAD" || true)
          echo "Changed files:"
          echo "$files"

          # Classification logic lives in .github/scripts/classify-paths.sh
          # so it is testable independently of the workflow runtime.
          # See .github/scripts/tests/test-classify-paths.sh.
          printf '%s\n' "$files" | bash .github/scripts/classify-paths.sh

      - name: Save production release routing decision
        shell: bash
        run: |
          mkdir -p ci-routing
          printf '%s\n' '${{ steps.classify.outputs.azure-deploy }}' > ci-routing/azure-deploy

      # workflow_run events cannot read job outputs. This artifact preserves the
      # exact push/PR diff decision for the production-release workflow.
      - name: Upload production release routing decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-routing
          path: ci-routing/azure-deploy
          if-no-files-found: error
          retention-days: 1

  lint-and-typecheck:
    name: Lint, Typecheck, Test & Build
    needs: changes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lyrashield
          POSTGRES_PASSWORD: lyrashield
          POSTGRES_DB: lyrashield
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://lyrashield:lyrashield@localhost:5432/lyrashield?schema=public"
      SHADOW_DATABASE_URL: "postgresql://lyrashield:lyrashield@localhost:5432/lyrashield_shadow?schema=public"
      REDIS_URL: "redis://localhost:6379"
      # The test step imports packages that load the full env config. These are the
      # minimum required vars to pass env validation. The secret is a dummy value that
      # only exists in CI — it is not a real credential and must be static so forks and
      # Dependabot PRs (which do not receive repository secrets) can run tests.
      BETTER_AUTH_SECRET: dummy-ci-only-secret-not-a-real-credential-32chars
      BETTER_AUTH_URL: "http://127.0.0.1:3100"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3100"
      TRUSTED_PROXY_IP_HEADER: "x-forwarded-for"
      PLATFORM_ADMIN_EMAILS: "ecryptoguru@gmail.com,ankit@lyrashieldai.com"
      # CI has no mail provider, and the E2E web server runs in production mode where
      # the schema default of "1" would refuse to boot. Matches the production value.
      LYRASHIELD_REQUIRE_EMAIL_VERIFICATION: "0"

    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        if: needs.changes.outputs.docs-only != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Turbo
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-
            turbo-${{ runner.os }}-main-

      - name: Install dependencies
        if: needs.changes.outputs.docs-only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm db:generate

      - name: Validate billing staging workflow contract
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        shell: bash
        run: bash .github/scripts/tests/test-deploy-billing-staging.sh

      - name: Create shadow database
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: docker exec "${{ job.services.postgres.id }}" psql -U lyrashield -d postgres -c 'CREATE DATABASE lyrashield_shadow;'

      - name: Migration drift check
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          pnpm --filter @lyrashield/db exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code

      - name: Run database migrations
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm --filter @lyrashield/db migrate:deploy

      # Real-Postgres invariant proof, not an application-level mock: a
      # negative Policy.maxBudgetUsd must be rejected by SQLSTATE 23514 on the
      # named constraint, while NULL, zero, and a positive decimal remain valid.
      # All rows are created inside one transaction and rolled back.
      - name: Assert policy budgets are nonnegative
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U lyrashield -d lyrashield -v ON_ERROR_STOP=1 \
            -c "BEGIN" \
            -c "INSERT INTO \"Workspace\" (id, name, slug, \"updatedAt\") VALUES ('ws-budget-assert-ci', 'Budget Assert CI', 'budget-assert-ci', NOW())" \
            -c "INSERT INTO \"Policy\" (id, \"workspaceId\", name, \"maxBudgetUsd\", \"updatedAt\") VALUES ('policy-null-ci', 'ws-budget-assert-ci', 'null budget', NULL, NOW())" \
            -c "INSERT INTO \"Policy\" (id, \"workspaceId\", name, \"maxBudgetUsd\", \"updatedAt\") VALUES ('policy-zero-ci', 'ws-budget-assert-ci', 'zero budget', 0.00, NOW())" \
            -c "INSERT INTO \"Policy\" (id, \"workspaceId\", name, \"maxBudgetUsd\", \"updatedAt\") VALUES ('policy-positive-ci', 'ws-budget-assert-ci', 'positive budget', 3.20, NOW())" \
            -c "DO \$\$ BEGIN BEGIN INSERT INTO \"Policy\" (id, \"workspaceId\", name, \"maxBudgetUsd\", \"updatedAt\") VALUES ('policy-negative-ci', 'ws-budget-assert-ci', 'negative budget', -1.00, NOW()); RAISE EXCEPTION 'negative budget was accepted by the database'; EXCEPTION WHEN check_violation THEN IF SQLERRM NOT LIKE '%Policy_maxBudgetUsd_nonnegative%' THEN RAISE EXCEPTION 'unexpected check violation: %', SQLERRM; END IF; END; END \$\$;" \
            -c "ROLLBACK"

      - name: Use a restricted RLS runtime role
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U lyrashield -d lyrashield -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE app_runtime_ci LOGIN PASSWORD 'runtime-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS" \
            -c "GRANT CONNECT ON DATABASE lyrashield TO app_runtime_ci" \
            -c "GRANT USAGE ON SCHEMA public, app TO app_runtime_ci" \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_runtime_ci" \
            -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_runtime_ci" \
            -c "GRANT EXECUTE ON FUNCTION app.enqueue_artifact_deletion_task(text, text, text) TO app_runtime_ci"
          echo 'RLS_RUNTIME_DATABASE_URL=postgresql://app_runtime_ci:runtime-ci-only@localhost:5432/lyrashield?schema=public' >> "$GITHUB_ENV"

      - name: Lint
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm lint

      - name: Lint marketing
        if: needs.changes.outputs.marketing == 'true' && needs.changes.outputs.app != 'true' && needs.changes.outputs.shared != 'true'
        run: pnpm --filter @lyrashield/marketing lint

      - name: Format check
        if: needs.changes.outputs.docs-only != 'true'
        run: pnpm format:check

      - name: Typecheck
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm typecheck

      - name: Typecheck marketing
        if: needs.changes.outputs.marketing == 'true' && needs.changes.outputs.app != 'true' && needs.changes.outputs.shared != 'true'
        run: pnpm --filter @lyrashield/marketing typecheck

      # Deterministic, offline blog gates. These ran only by hand before, which is
      # how an unterminated code span reached the build stage: MDX compiled the
      # leaked expression fine and only failed while prerendering, with no file
      # name in the error. blog:check-links is deliberately NOT gated here — it
      # calls ~50 third-party URLs and would make merges depend on their uptime.
      - name: Validate blog content
        if: needs.changes.outputs.marketing == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm --filter @lyrashield/marketing blog:validate

      - name: Validate blog images
        if: needs.changes.outputs.marketing == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm --filter @lyrashield/marketing blog:validate:images

      - name: Validate blog MDX
        if: needs.changes.outputs.marketing == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm --filter @lyrashield/marketing blog:validate:mdx

      - name: Validate blog offline gates
        if: needs.changes.outputs.marketing == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm --filter @lyrashield/marketing blog:validate:offline

      - name: Validate compare content
        if: needs.changes.outputs.marketing == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm --filter @lyrashield/marketing compare:validate

      - name: Test affected suites
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.marketing == 'true' || needs.changes.outputs.shared == 'true'
        env:
          APP_CHANGED: ${{ needs.changes.outputs.app }}
          MARKETING_CHANGED: ${{ needs.changes.outputs.marketing }}
          SHARED_CHANGED: ${{ needs.changes.outputs.shared }}
        shell: bash
        run: |
          set -euo pipefail
          suites=()
          if [ "$APP_CHANGED" = true ] || [ "$SHARED_CHANGED" = true ]; then
            suites+=(core)
          fi
          if [ "$MARKETING_CHANGED" = true ] || [ "$SHARED_CHANGED" = true ]; then
            suites+=(marketing motion)
          fi
          LYRASHIELD_TEST_SUITES="$(IFS=,; echo "${suites[*]}")" pnpm test

      - name: Test worker egress pin rotation
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: sh ops/worker/refresh-egress.test.sh

      - name: Test Azure deployment and alert operations
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          bash .github/scripts/tests/test-promote-worker-vm.sh
          sh ops/deployment/azure-vm-run-command.test.sh
          sh ops/monitoring/provision-alerts.test.sh
          sh ops/worker/refresh-secrets.test.sh

      - name: Test worker stop provenance
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: sh ops/worker/capture-stop-provenance.test.sh

      - name: Build app and shared packages
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: pnpm build

      - name: Build marketing
        if: needs.changes.outputs.marketing == 'true' && needs.changes.outputs.app != 'true' && needs.changes.outputs.shared != 'true'
        run: pnpm --filter @lyrashield/marketing build

      # Cache the Playwright browser binary so the install step does not
      # re-download chromium on every run. Keyed on the @playwright/test
      # version so a version bump busts the cache. On a hit the browser
      # download is skipped (only --with-deps system packages run), which is
      # what makes the install step reliably fit its timeout. Added after the
      # step timed out at 8 minutes three runs in a row (2026-08-19/20).
      - name: Cache Playwright browser
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.marketing == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Hash the installed @playwright/test version out of the lockfile so
          # a Playwright upgrade invalidates the cache automatically.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.marketing == 'true' || needs.changes.outputs.shared == 'true'
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium

      - name: Marketing browser E2E
        if: needs.changes.outputs.marketing == 'true' || needs.changes.outputs.shared == 'true'
        timeout-minutes: 10
        run: pnpm --filter @lyrashield/marketing test:browser

      - name: Browser E2E
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        timeout-minutes: 15
        # DATABASE_URL: the NOBYPASSRLS runtime role — the app under test runs
        # with RLS enforced, so e2e exercises the real RLS posture.
        # DATABASE_SYSTEM_URL: the privileged (owner) role for cross-workspace
        # system operations (e.g. license activation's workspace-less global
        # key-hash lookup). getSystemPrisma() uses this; without it the license
        # activation/connect/renew/verify flows can't read NULL-workspaceId or
        # cross-workspace License rows under FORCE RLS.
        run: DATABASE_URL="$RLS_RUNTIME_DATABASE_URL" DATABASE_SYSTEM_URL="postgresql://lyrashield:lyrashield@localhost:5432/lyrashield?schema=public" pnpm exec playwright test --grep-invert '@visual'

      - name: No code changes
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "No code changes detected — skipping lint, typecheck, test, and build."

  engine-worker-contract:
    name: Pinned Engine / Worker Contract
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read pinned engine revision
        id: engine
        shell: bash
        run: |
          revision="$(sed -nE 's/^  ENGINE_REVISION: ([0-9a-f]{40})$/\1/p' .github/workflows/deploy-azure.yml)"
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy-azure.yml must contain one immutable ENGINE_REVISION"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/lyrashield-engine
          ref: ${{ steps.engine.outputs.revision }}
          fetch-depth: 0
          path: lyrashield-engine
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Verify engine revision provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/verify-engine-revision.sh \
            lyrashield-engine "${{ steps.engine.outputs.revision }}" \
            "${{ github.repository_owner }}/lyrashield-engine"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify pinned engine-worker contract
        run: bash .github/scripts/verify-engine-worker-contract.sh lyrashield-engine "$GITHUB_WORKSPACE"

  rls-child-write-repro:
    # Deep Review v12 P0-1: reproduce the production 42501 that took down the
    # scan pipeline when child-table RLS was enabled (20260803000002).
    #
    # This job runs the full migration chain (which now re-enables child-table
    # RLS via 20260807000003), then runs the write-path test in
    # rls-fail-closed.test.ts to confirm all write paths respect RLS.
    #
    # If the write-path test PASSES: the root cause has been fixed and RLS is
    # safely enforced. If it FAILS with 42501: a write path is bypassing RLS.
    #
    # This job is now GATED (continue-on-error removed) — a failure blocks merge.
    name: RLS Child-Table Write Reproduction
    needs: changes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lyrashield
          POSTGRES_PASSWORD: lyrashield
          POSTGRES_DB: lyrashield
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://lyrashield:lyrashield@localhost:5432/lyrashield?schema=public"
      SHADOW_DATABASE_URL: "postgresql://lyrashield:lyrashield@localhost:5432/lyrashield_shadow?schema=public"
      # The RLS test imports from ./client which loads the full env config.
      # These are the minimum required vars to pass env validation. The secret
      # is a dummy value that only exists in CI — it is not a real credential.
      BETTER_AUTH_SECRET: dummy-ci-only-secret-not-a-real-credential-32chars
      BETTER_AUTH_URL: "http://127.0.0.1:3100"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3100"
      TRUSTED_PROXY_IP_HEADER: "x-forwarded-for"
      LYRASHIELD_REQUIRE_EMAIL_VERIFICATION: "0"

    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        if: needs.changes.outputs.docs-only != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.docs-only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        if: needs.changes.outputs.docs-only != 'true'
        run: pnpm db:generate

      - name: Create shadow database
        if: needs.changes.outputs.docs-only != 'true'
        run: docker exec "${{ job.services.postgres.id }}" psql -U lyrashield -d postgres -c 'CREATE DATABASE lyrashield_shadow;'

      - name: Run database migrations
        if: needs.changes.outputs.docs-only != 'true'
        run: pnpm --filter @lyrashield/db migrate:deploy

      - name: Create restricted RLS runtime role
        if: needs.changes.outputs.docs-only != 'true'
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U lyrashield -d lyrashield -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE app_runtime_ci LOGIN PASSWORD 'runtime-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS" \
            -c "GRANT CONNECT ON DATABASE lyrashield TO app_runtime_ci" \
            -c "GRANT USAGE ON SCHEMA public, app TO app_runtime_ci" \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_runtime_ci" \
            -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_runtime_ci" \
            -c "GRANT EXECUTE ON FUNCTION app.enqueue_artifact_deletion_task(text, text, text) TO app_runtime_ci"
          echo 'RLS_RUNTIME_DATABASE_URL=postgresql://app_runtime_ci:runtime-ci-only@localhost:5432/lyrashield?schema=public' >> "$GITHUB_ENV"

      - name: Run child-table RLS tests
        if: needs.changes.outputs.docs-only != 'true'
        shell: bash
        run: |
          # Migration 20260807000003 re-enables RLS on all 9 child tables.
          # The test suite in rls-fail-closed.test.ts is now un-skipped and
          # validates catalog flags, read-path isolation, and write-path safety.
          cd packages/db
          npx vitest run src/rls-fail-closed.test.ts 2>&1
          EXIT_CODE=$?
          echo "RLS test exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Child-table RLS tests FAILED — a write path may be bypassing RLS."
            exit 1
          fi
          echo "::notice::Child-table RLS tests PASSED — RLS is enforced on all child tables."

  deploy-marketing:
    name: Deploy Marketing to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.marketing == 'true' || needs.changes.outputs.shared == 'true')
    needs: [security, lint-and-typecheck, changes, rls-child-write-repro]
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://lyrashieldai.com
    steps:
      # This job deploys when marketing or shared dependencies change.
      #
      # It previously skipped unless the single push diff (github.event.before..github.sha)
      # touched apps/marketing. That stranded builds: when a push containing marketing
      # changes failed CI, `needs` skipped the deploy, and every later push that fixed CI
      # without touching apps/marketing then evaluated changed=false and skipped it again.
      # The marketing fix from 2026-07-29 sat merged-but-undeployed for exactly this reason.
      #
      # Shared changes (packages/, root config) can affect the marketing build, so they
      # also trigger a deploy. App-only changes (apps/web, apps/worker) do not
      # affect the Cloudflare marketing Worker and skip this deploy. If a direct push to
      # main includes marketing changes that fail CI, fix them in a push that touches
      # marketing or shared files — or run this workflow manually from the Actions tab.
      # The smoke step below is what actually proves the deploy landed.
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production marketing Worker
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          LYRASHIELD_MARKETING_REVISION: ${{ github.sha }}
        run: pnpm --filter @lyrashield/marketing build

      - name: Verify generated marketing revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs"

          const expected = process.env.EXPECTED_REVISION
          if (!/^[0-9a-f]{40}$/.test(expected ?? "")) {
            throw new Error("EXPECTED_REVISION must be a full Git SHA")
          }

          const html = readFileSync("apps/marketing/dist/client/index.html", "utf8")
          const marker = `<meta name="lyrashield-build-revision" content="${expected}">`
          if (!html.includes(marker)) {
            throw new Error("Generated marketing homepage is missing the exact build revision")
          }

          const worker = JSON.parse(
            readFileSync("apps/marketing/dist/server/wrangler.json", "utf8")
          )
          if (worker.assets?.directory !== "../client") {
            throw new Error("Generated Cloudflare Worker does not serve the verified client artifact")
          }
          console.log(`Generated marketing artifact serves revision ${expected}`)
          NODE

      - name: Apply D1 migrations and deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/marketing
          wranglerVersion: "4"
          command: |
            d1 migrations apply lyrashield-marketing-waitlist --remote --config dist/server/wrangler.json
            deploy --config dist/server/wrangler.json

      - name: Smoke production routes
        shell: bash
        run: |
          for path in / /methodology /tools /robots.txt /sitemap-index.xml /llms.txt; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              "https://lyrashieldai.com${path}" > /dev/null
          done
          curl --silent --show-error --retry 5 --retry-all-errors \
            "https://lyrashieldai.com/api/waitlist/position?code=INVALID" \
            --output /dev/null --write-out '%{http_code}' | grep --quiet '^404$'
          curl --silent --show-error --head "https://www.lyrashieldai.com/tools?source=ci" \
            | grep --ignore-case --quiet '^location: https://lyrashieldai.com/tools?source=ci'

      - name: Assert the live homepage is the build we just shipped
        shell: bash
        run: |
          # A 200 cannot detect a stale deploy — the previous smoke step passed happily for
          # hours against an old build. These assert markers that only exist in the current
          # homepage, so a skipped, failed, or cache-pinned deploy fails the run instead.
          #
          # If you intentionally change or remove either element, update the marker here in
          # the same commit. A failure means the live site is not serving this commit.
          #
          # Retried with backoff: a wrangler deploy that itself succeeds can take a short
          # window to propagate across Cloudflare's edge, and the very first check here once
          # failed one second after a deploy that had already reported success. A
          # cache-busting query param avoids being served a stale edge-cached response during
          # that window.
          markers=(
            'data-cta-id="premium-hero-lite-check"'
            'data-cta-id="story-report-create-account"'
          )

          for attempt in $(seq 1 8); do
            homepage="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "https://lyrashieldai.com/?cachebust=${GITHUB_SHA}-${attempt}")"
            live_revision="$(printf '%s' "$homepage" | sed -n 's/.*<meta name="lyrashield-build-revision" content="\([0-9a-f]\{40\}\)".*/\1/p' | head -n 1)"

            if [ "$live_revision" = "$GITHUB_SHA" ]; then
              missing=""
              for marker in "${markers[@]}"; do
                if ! printf '%s' "$homepage" | grep --quiet --fixed-strings "$marker"; then
                  missing="$marker"
                  break
                fi
              done

              if [ -z "$missing" ]; then
                echo "Live homepage serves revision ${GITHUB_SHA} with expected feature markers (attempt ${attempt})."
                exit 0
              fi
            fi

            echo "Attempt ${attempt}: live revision '${live_revision:-missing}', expected '${GITHUB_SHA}', missing marker '${missing:-none}'; retrying in 15s..."
            sleep 15
          done

          echo "::error::Live homepage did not serve revision '${GITHUB_SHA}' with all expected markers after 8 attempts."
          exit 1

      - name: Lighthouse production measurement
        continue-on-error: true
        shell: bash
        run: |
          # Exact CLI version keeps the live gate reproducible without adding a
          # runtime dependency to the product workspace.
          npx --yes lighthouse@13.0.1 https://lyrashieldai.com \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,seo \
            --output=json \
            --output-path=/tmp/lyrashield-lighthouse.json \
            --quiet
          # shellcheck disable=SC2016
          node -e '
            const report = require("/tmp/lyrashield-lighthouse.json");
            const minimum = { performance: 0.8, accessibility: 0.95, seo: 0.95 };
            for (const [category, threshold] of Object.entries(minimum)) {
              const score = report.categories?.[category]?.score;
              if (typeof score !== "number" || score < threshold) {
                throw new Error(`${category} score ${score ?? "missing"} is below ${threshold}`);
              }
              console.log(`${category}: ${score}`);
            }
          '

  desktop-rust:
    name: Desktop Rust (cargo)
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, audited 2026-08-24
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Format check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Test (includes golden-vector parity)
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Build (arm64)
        working-directory: apps/desktop/src-tauri
        run: cargo build --target aarch64-apple-darwin

      - name: Build (x86_64 cross-compile)
        working-directory: apps/desktop/src-tauri
        run: cargo build --target x86_64-apple-darwin

  desktop-frontend:
    name: Desktop Frontend (Vite/React)
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @lyrashield/desktop-frontend typecheck

      - name: Lint
        run: pnpm --filter @lyrashield/desktop-frontend lint

      - name: Build
        run: pnpm --filter @lyrashield/desktop-frontend build
