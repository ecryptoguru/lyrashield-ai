name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: SCA & Secret Scan
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: needs.changes.outputs.docs-only != 'true'
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          # Every workflow runs pnpm install as an explicit step; the
          # successor action's install default is true, so opt out.
          install: false

      - name: Setup Node.js
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Dependency vulnerability scan
        if: needs.changes.outputs.docs-only != 'true'
        # pnpm audit reads the locked graph directly; installing/linking the
        # workspace first adds no coverage and wastes runner time.
        # Fail immediately for findings or registry errors; retrying pnpm's
        # shared nonzero exit code can delay a vulnerability result without
        # distinguishing it from a transport failure.
        # This repo has narrowly documented GHSA exceptions in
        # pnpm-workspace.yaml. Remove it when Astro/http-cache-semantics ships
        # and root braces ship patched releases; tests and `pnpm why --prod`
        # pin the reviewed usage.
        run: pnpm audit --audit-level=high --prod

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      tooling-only: ${{ steps.classify.outputs.tooling-only }}
      marketing: ${{ steps.classify.outputs.marketing }}
      app: ${{ steps.classify.outputs.app }}
      desktop: ${{ steps.classify.outputs.desktop }}
      shared: ${{ steps.classify.outputs.shared }}
      marketing-deploy: ${{ steps.classify.outputs.marketing-deploy }}
      azure-deploy: ${{ steps.classify.outputs.azure-deploy }}
    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck='' .github/workflows/*.yml

      - name: Test path classifier
        shell: bash
        run: bash .github/scripts/tests/test-classify-paths.sh

      - name: Test Action WebMCP coverage fixture
        shell: bash
        run: bash .github/scripts/tests/test-action-webmcp-guard.sh

      - name: Test Desktop release manifest
        run: python3 .github/scripts/test_desktop_release.py

      - name: Test webhook cutover verification workflow invariants
        run: |
          node .github/scripts/tests/webhook-cutover-verification.workflow.test.mjs
          node --test .github/scripts/tests/webhook-deploy-dispatch.test.mjs

      - name: Test Lighthouse NO_NAVSTART retry policy
        run: node --test .github/scripts/tests/lighthouse-production.test.mjs

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.after || github.sha }}
        run: |
          set -euo pipefail
          # Pull requests retain their event base..head diff.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="HEAD~1"
            HEAD="HEAD"
          fi
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="HEAD~1"
          fi
          if ! git rev-parse --verify "$HEAD" >/dev/null 2>&1; then
            HEAD="HEAD"
          fi

          files=$(git diff --no-renames --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$files"

          # Classification logic lives in .github/scripts/classify-paths.sh
          # so it is testable independently of the workflow runtime.
          # See .github/scripts/tests/test-classify-paths.sh.
          printf '%s\n' "$files" | bash .github/scripts/classify-paths.sh

  lint-and-typecheck:
    name: Lint, Typecheck, Test & Build
    needs: changes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lyrashield
          POSTGRES_PASSWORD: lyrashield
          POSTGRES_DB: lyrashield
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Vitest validates every database/Redis URL against the local disposable
      # service before loading integration suites. Developer unit runs omit this.
      LYRASHIELD_TEST_DB_DISPOSABLE: "1"
      DATABASE_URL: "postgresql://lyrashield:lyrashield@localhost:5432/lyrashield?schema=public"
      SHADOW_DATABASE_URL: "postgresql://lyrashield:lyrashield@localhost:5432/lyrashield_shadow?schema=public"
      # v16 2.2: getSystemPrisma() no longer silently falls back to the RLS
      # client in test environments, so tests exercising system paths (e.g.
      # account deletion's License scrub) need the privileged URL — the same
      # value the Playwright job already provides.
      DATABASE_SYSTEM_URL: "postgresql://lyrashield:lyrashield@localhost:5432/lyrashield?schema=public"
      REDIS_URL: "redis://localhost:6379"
      # The test step imports packages that load the full env config. These are the
      # minimum required vars to pass env validation. The secret is a dummy value that
      # only exists in CI — it is not a real credential and must be static so forks and
      # Dependabot PRs (which do not receive repository secrets) can run tests.
      BETTER_AUTH_SECRET: dummy-ci-only-secret-not-a-real-credential-32chars
      BETTER_AUTH_URL: "http://127.0.0.1:3100"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3100"
      TRUSTED_PROXY_IP_HEADER: "x-forwarded-for"
      PLATFORM_ADMIN_EMAILS: "ecryptoguru@gmail.com,ankit@lyrashieldai.com"
      # CI has no mail provider, and the E2E web server runs in production mode where
      # the schema default of "1" would refuse to boot. Matches the production value.
      LYRASHIELD_REQUIRE_EMAIL_VERIFICATION: "0"

    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          # Every workflow runs pnpm install as an explicit step; the
          # successor action's install default is true, so opt out.
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-
            turbo-${{ runner.os }}-main-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # Advisory only — reports markdown hygiene without blocking the merge.
      - name: Markdown lint (non-blocking)
        continue-on-error: true
        run: pnpm lint:md

      - name: Serial-comma copy ratchet
        run: pnpm lint:copy-comma

      - name: Generate Prisma Client
        if: needs.changes.outputs.docs-only != 'true'
        run: pnpm db:generate

      - name: Test webhook catalog Prisma compatibility
        if: needs.changes.outputs.docs-only != 'true'
        run: node --test .github/scripts/tests/webhook-catalog.runtime.test.mjs

      - name: Informational dead-code inventory
        if: needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.tooling-only != 'true'
        # Findings are candidate evidence until the 4a baseline is cleared.
        # Knip still exits nonzero for invalid configuration or execution errors.
        run: pnpm exec knip --no-exit-code

      - name: Create shadow database
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: docker exec "${{ job.services.postgres.id }}" psql -U lyrashield -d postgres -c 'CREATE DATABASE lyrashield_shadow;'

      - name: Migration drift check
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: |
          pnpm --filter @lyrashield/db exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code

      - name: Run database migrations
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm --filter @lyrashield/db migrate:deploy

      # These tests intentionally reject arbitrary DBs and use fixed local
      # database names as a destructive-action guard. Keep each fixture DB
      # disposable and migrate it from the checked-out schema.
      - name: Create isolated product regression databases
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.postgres.id }}" psql -U lyrashield -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE v15_product' \
            -c 'CREATE DATABASE lyra_v18_ci' \
            -c 'CREATE DATABASE v22_agent_fk_ci'
          DATABASE_URL="postgresql://lyrashield:lyrashield@localhost:5432/v15_product?schema=public" \
            pnpm --filter @lyrashield/db migrate:deploy
          DATABASE_URL="postgresql://lyrashield:lyrashield@localhost:5432/lyra_v18_ci?schema=public" \
            pnpm --filter @lyrashield/db migrate:deploy
          DATABASE_URL="postgresql://lyrashield:lyrashield@localhost:5432/v22_agent_fk_ci?schema=public" \
            pnpm --filter @lyrashield/db migrate:deploy

      # Real-Postgres invariant proof, not an application-level mock: a
      # negative Policy.maxBudgetUsd must be rejected by SQLSTATE 23514 on the
      # named constraint, while NULL, zero, and a positive decimal remain valid.
      # All rows are created inside one transaction and rolled back.
      - name: Assert policy budgets are nonnegative
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U lyrashield -d lyrashield -v ON_ERROR_STOP=1 \
            -c "BEGIN" \
            -c "INSERT INTO \"Workspace\" (id, name, slug, \"updatedAt\") VALUES ('ws-budget-assert-ci', 'Budget Assert CI', 'budget-assert-ci', NOW())" \
            -c "INSERT INTO \"Policy\" (id, \"workspaceId\", name, \"maxBudgetUsd\", \"updatedAt\") VALUES ('policy-null-ci', 'ws-budget-assert-ci', 'null budget', NULL, NOW())" \
            -c "INSERT INTO \"Policy\" (id, \"workspaceId\", name, \"maxBudgetUsd\", \"updatedAt\") VALUES ('policy-zero-ci', 'ws-budget-assert-ci', 'zero budget', 0.00, NOW())" \
            -c "INSERT INTO \"Policy\" (id, \"workspaceId\", name, \"maxBudgetUsd\", \"updatedAt\") VALUES ('policy-positive-ci', 'ws-budget-assert-ci', 'positive budget', 3.20, NOW())" \
            -c "DO \$\$ BEGIN BEGIN INSERT INTO \"Policy\" (id, \"workspaceId\", name, \"maxBudgetUsd\", \"updatedAt\") VALUES ('policy-negative-ci', 'ws-budget-assert-ci', 'negative budget', -1.00, NOW()); RAISE EXCEPTION 'negative budget was accepted by the database'; EXCEPTION WHEN check_violation THEN IF SQLERRM NOT LIKE '%Policy_maxBudgetUsd_nonnegative%' THEN RAISE EXCEPTION 'unexpected check violation: %', SQLERRM; END IF; END; END \$\$;" \
            -c "ROLLBACK"

      - name: Use a restricted RLS runtime role
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U lyrashield -d lyrashield -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE app_runtime_ci LOGIN PASSWORD 'runtime-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS" \
            -c "GRANT CONNECT ON DATABASE lyrashield TO app_runtime_ci" \
            -c "GRANT USAGE ON SCHEMA public, app TO app_runtime_ci" \
            -c "DO \$\$ DECLARE item record; BEGIN FOR item IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename NOT IN ('PlatformAdminElevation', 'PlatformAdminChallengeLimit', 'PlatformAdminAudit', 'billing_reconciliation_state') LOOP EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.%I TO app_runtime_ci', item.tablename); END LOOP; FOR item IN SELECT sequencename FROM pg_sequences WHERE schemaname = 'public' LOOP EXECUTE format('GRANT USAGE, SELECT ON SEQUENCE public.%I TO app_runtime_ci', item.sequencename); END LOOP; END \$\$;" \
            -c "GRANT EXECUTE ON FUNCTION app.enqueue_artifact_deletion_task(text, text, text) TO app_runtime_ci" \
            -c "GRANT EXECUTE ON FUNCTION app.enqueue_scan_attachment_deletion_task(text, text, text) TO app_runtime_ci"
          echo 'RLS_RUNTIME_DATABASE_URL=postgresql://app_runtime_ci:runtime-ci-only@localhost:5432/lyrashield?schema=public' >> "$GITHUB_ENV"

      - name: Grant restricted runtime access to regression databases
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        shell: bash
        run: |
          set -euo pipefail
          for database in v15_product lyra_v18_ci v22_agent_fk_ci; do
            docker exec "${{ job.services.postgres.id }}" psql -U lyrashield -d postgres -v ON_ERROR_STOP=1 \
              -c "GRANT CONNECT ON DATABASE ${database} TO app_runtime_ci"
            docker exec "${{ job.services.postgres.id }}" psql -U lyrashield -d "$database" -v ON_ERROR_STOP=1 \
              -c "GRANT USAGE ON SCHEMA public, app TO app_runtime_ci" \
              -c "DO \$\$ DECLARE item record; BEGIN FOR item IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename NOT IN ('PlatformAdminElevation', 'PlatformAdminChallengeLimit', 'PlatformAdminAudit', 'billing_reconciliation_state') LOOP EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.%I TO app_runtime_ci', item.tablename); END LOOP; FOR item IN SELECT sequencename FROM pg_sequences WHERE schemaname = 'public' LOOP EXECUTE format('GRANT USAGE, SELECT ON SEQUENCE public.%I TO app_runtime_ci', item.sequencename); END LOOP; END \$\$;" \
              -c "GRANT EXECUTE ON FUNCTION app.enqueue_artifact_deletion_task(text, text, text) TO app_runtime_ci" \
              -c "GRANT EXECUTE ON FUNCTION app.enqueue_scan_attachment_deletion_task(text, text, text) TO app_runtime_ci"
          done

      - name: Size lint ratchet
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true') || needs.changes.outputs.marketing == 'true'
        run: pnpm lint:size

      - name: Smoke-test production-equivalent account and workspace grants
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        shell: bash
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=runtime-ci-only "${{ job.services.postgres.id }}" \
            psql -h 127.0.0.1 -U app_runtime_ci -d lyrashield -v ON_ERROR_STOP=1 \
            -c "DO \$\$ DECLARE item record; BEGIN FOR item IN SELECT DISTINCT c.table_name FROM information_schema.columns c JOIN information_schema.tables t ON t.table_schema = c.table_schema AND t.table_name = c.table_name WHERE c.table_schema = 'public' AND t.table_type = 'BASE TABLE' AND c.column_name IN ('workspaceId', 'accountId') LOOP EXECUTE format('SELECT 1 FROM public.%I LIMIT 0', item.table_name); RAISE NOTICE 'runtime SELECT smoke passed for %', item.table_name; END LOOP; END \$\$;"
          docker exec -e PGPASSWORD=runtime-ci-only "${{ job.services.postgres.id }}" \
            psql -h 127.0.0.1 -U app_runtime_ci -d lyrashield -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF has_table_privilege(current_user, 'public.billing_reconciliation_state', 'SELECT') OR has_table_privilege(current_user, 'public.billing_reconciliation_state', 'INSERT') OR has_table_privilege(current_user, 'public.billing_reconciliation_state', 'UPDATE') OR has_table_privilege(current_user, 'public.billing_reconciliation_state', 'DELETE') THEN RAISE EXCEPTION 'app_runtime_ci must not access billing_reconciliation_state'; END IF; END \$\$;"

      - name: Lint CI tooling
        if: needs.changes.outputs.tooling-only == 'true' || needs.changes.outputs.shared == 'true'
        env:
          LYRASHIELD_RATCHET_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TOOLING_ONLY: ${{ needs.changes.outputs.tooling-only }}
        run: |
          pnpm exec eslint run-all-tests.mjs .github/scripts/*.mjs .github/scripts/tests/*.mjs
          if [ "$TOOLING_ONLY" = 'true' ]; then
            pnpm exec vitest run lint/size-ratchet.test.mjs lint/serial-comma-ratchet.test.mjs lint/ratchet-baseline-shrink.test.mjs
          fi
          bash .github/scripts/tests/test-verify-engine-revision-pagination.sh
          find .github/scripts ops -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning
          node .github/scripts/verify-pnpm-pin.mjs
          pnpm lint:ratchet-baselines

      - name: Lint
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm lint

      - name: Lint marketing
        if: needs.changes.outputs.marketing == 'true' && needs.changes.outputs.app != 'true' && needs.changes.outputs.shared != 'true'
        run: pnpm --filter @lyrashield/marketing lint

      - name: Typecheck
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm typecheck

      - name: Typecheck web tests
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm typecheck:web-tests

      - name: Typecheck browser fixtures
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm typecheck:e2e

      - name: Typecheck portable browser harness
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm typecheck:browser-harness

      - name: Lint portable browser harness
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm lint:browser-harness

      - name: Typecheck marketing
        if: needs.changes.outputs.marketing == 'true' && needs.changes.outputs.app != 'true' && needs.changes.outputs.shared != 'true'
        run: pnpm --filter @lyrashield/marketing typecheck

      # Deterministic, offline blog gates. These ran only by hand before, which is
      # how an unterminated code span reached the build stage: MDX compiled the
      # leaked expression fine and only failed while prerendering, with no file
      # name in the error. blog:check-links is deliberately NOT gated here — it
      # calls ~50 third-party URLs and would make merges depend on their uptime.
      - name: Validate blog content
        if: needs.changes.outputs.marketing == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm --filter @lyrashield/marketing blog:validate

      - name: Validate blog images
        if: needs.changes.outputs.marketing == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm --filter @lyrashield/marketing blog:validate:images

      - name: Validate blog MDX
        if: needs.changes.outputs.marketing == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm --filter @lyrashield/marketing blog:validate:mdx

      - name: Validate blog offline gates
        if: needs.changes.outputs.marketing == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm --filter @lyrashield/marketing blog:validate:offline

      - name: Validate compare content
        if: needs.changes.outputs.marketing == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm --filter @lyrashield/marketing compare:validate

      - name: Validate redirects coverage
        # Drift guard for the asset-layer trailing-slash 301s (PR #592
        # architecture): every prerendered route must carry an explicit
        # _redirects rule or its slash variant silently falls back to the
        # platform 307. Runs the same enumeration the e2e suite asserts.
        if: needs.changes.outputs.marketing == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm --filter @lyrashield/marketing validate-redirects

      - name: Test affected suites
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.marketing == 'true' || needs.changes.outputs.shared == 'true'
        # The core suite includes the general restricted-role RLS tests against
        # the disposable main database. Fixed-name regressions below use their
        # own migrated databases because their guards require those names.
        env:
          APP_CHANGED: ${{ needs.changes.outputs.app }}
          MARKETING_CHANGED: ${{ needs.changes.outputs.marketing }}
          SHARED_CHANGED: ${{ needs.changes.outputs.shared }}
          TOOLING_ONLY: ${{ needs.changes.outputs.tooling-only }}
          LYRASHIELD_TEST_COVERAGE: ${{ github.event_name == 'push' && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          suites=()
          if [ "$TOOLING_ONLY" = true ]; then
            suites+=(ops)
          else
            if [ "$APP_CHANGED" = true ] || [ "$SHARED_CHANGED" = true ]; then
              suites+=(core ops)
            fi
            if [ "$MARKETING_CHANGED" = true ] || [ "$SHARED_CHANGED" = true ]; then
              suites+=(marketing motion)
            fi
          fi
          LYRASHIELD_TEST_SUITES="$(IFS=,; echo "${suites[*]}")" pnpm test

      - name: Prove metering and queue invariants with disposable services
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        shell: bash
        run: |
          set -euo pipefail
          BILLING_METER_POSTGRES_TEST=1 pnpm exec vitest run packages/billing/src/usage/meter.postgres.test.ts
          WEBHOOK_TRACK_POSTGRES_REDIS_TEST=1 pnpm exec vitest run apps/worker/src/jobs/webhook-track-retry.postgres-redis.test.ts
          BULLMQ_PRODUCER_REDIS_TEST=1 BULLMQ_TEST_REDIS_URL="$REDIS_URL" pnpm exec vitest run packages/integrations/src/queue.producer.redis.test.ts

      - name: Upload informational web coverage summary
        if: always() && github.event_name == 'push' && (needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true'))
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-vitest-coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

      # The TRIAL_INTEGRATION_TEST suites assert their DATABASE_URL is a
      # localhost, non-superuser, NOBYPASSRLS role — the app_runtime_ci role
      # provisioned above is exactly that. They run in a dedicated invocation
      # because the suite-wide DATABASE_URL is the owner role.
      - name: Trial integration tests (restricted runtime role)
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$RLS_RUNTIME_DATABASE_URL" TRIAL_INTEGRATION_TEST=1 \
            pnpm exec vitest run \
              packages/billing/src/trial-integration.test.ts \
              apps/web/src/app/api/workspaces/route-integration.test.ts \
              packages/myra/src/server/operations.runtime.test.ts \
              --reporter=json --outputFile="$RUNNER_TEMP/trial-integration.json"
          node .github/scripts/assert-named-vitest-tests.mjs \
            "$RUNNER_TEMP/trial-integration.json" \
            'serializes simultaneous claims for two workspaces and survives membership removal' \
            'keeps trial writes inside the creator transaction after a module reload' \
            'rejects a foreign owner before execution'

      - name: Agent operation workspace foreign key test
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        shell: bash
        run: |
          set -euo pipefail
          agent_fk_owner_database_url='postgresql://lyrashield:lyrashield@127.0.0.1:5432/v22_agent_fk_ci?schema=public'
          agent_fk_runtime_database_url='postgresql://app_runtime_ci:runtime-ci-only@127.0.0.1:5432/v22_agent_fk_ci?schema=public'
          AGENT_OPERATION_WORKSPACE_DB_TEST=1 \
            DATABASE_URL="$agent_fk_owner_database_url" \
            RLS_RUNTIME_DATABASE_URL="$agent_fk_runtime_database_url" \
            pnpm exec vitest run packages/db/src/agent-operation-workspace.runtime.test.ts \
              --reporter=json --outputFile="$RUNNER_TEMP/agent-operation-workspace.json"
          node .github/scripts/assert-named-vitest-tests.mjs \
            "$RUNNER_TEMP/agent-operation-workspace.json" \
            'rejects cross-workspace connections under runtime RLS and preserves valid cascade behavior'

      # Keep the opt-in database suites live in required CI. Their own guards
      # still reject non-local databases; report checks make an accidental
      # Vitest skip fail the job instead of looking green.
      - name: Run required PostgreSQL regression tests
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        shell: bash
        run: |
          set -euo pipefail
          team_owner_database_url='postgresql://lyrashield:lyrashield@localhost:5432/v15_product?schema=public'
          team_runtime_database_url='postgresql://app_runtime_ci:runtime-ci-only@localhost:5432/v15_product?schema=public'
          growth_database_url='postgresql://lyrashield:lyrashield@localhost:5432/lyra_v18_ci?schema=public'

          assert_named_tests_passed() {
            local report_path="$1"
            shift
            node .github/scripts/assert-named-vitest-tests.mjs "$report_path" "$@"
          }

          TEAM_MUTATION_DB_TEST=1 DATABASE_URL="$team_owner_database_url" DATABASE_SYSTEM_URL="$team_owner_database_url" \
            pnpm exec vitest run apps/web/src/app/api/team/mutations-db.test.ts \
            --testNamePattern='anonymizes attribution|removes, reinvites|revalidates account-deletion ownership' \
            --reporter=json --outputFile="$RUNNER_TEMP/team-mutation-owner.json"
          assert_named_tests_passed "$RUNNER_TEMP/team-mutation-owner.json" \
            'anonymizes attribution and rebuilds the audit chain in a soft-deleted retained workspace' \
            'removes, reinvites and reactivates the same membership with the new role' \
            'revalidates account-deletion ownership after a concurrent team self-demotion'

          TEAM_MUTATION_DB_TEST=1 DATABASE_URL="$team_runtime_database_url" DATABASE_SYSTEM_URL="$team_owner_database_url" \
            pnpm exec vitest run apps/web/src/app/api/team/mutations-db.test.ts \
            --testNamePattern='serializes concurrent owner removals' \
            --reporter=json --outputFile="$RUNNER_TEMP/team-mutation-runtime.json"
          assert_named_tests_passed "$RUNNER_TEMP/team-mutation-runtime.json" \
            'serializes concurrent owner removals under the restricted database role'

          GROWTH_METRICS_DB_TEST=1 DATABASE_URL="$growth_database_url" DATABASE_SYSTEM_URL="$growth_database_url" \
            pnpm exec vitest run apps/web/src/lib/growth-metrics.test.ts \
            --testNamePattern='produces the same numbers as computePaidAccountMetrics from a seeded set' \
            --reporter=json --outputFile="$RUNNER_TEMP/growth-metrics-db.json"
          assert_named_tests_passed "$RUNNER_TEMP/growth-metrics-db.json" \
            'produces the same numbers as computePaidAccountMetrics from a seeded set'

          RLS_RUNTIME_DATABASE_URL="$team_runtime_database_url" DATABASE_URL="$team_runtime_database_url" DATABASE_SYSTEM_URL="$team_owner_database_url" \
            pnpm exec vitest run apps/web/src/lib/dashboard-overview.runtime.test.ts \
            --reporter=json --outputFile="$RUNNER_TEMP/dashboard-overview-runtime.json"
          assert_named_tests_passed "$RUNNER_TEMP/dashboard-overview-runtime.json" \
            'keeps quiet targets and their usable snapshots outside the global top-200/top-20 windows'

          RLS_RUNTIME_DATABASE_URL="$team_runtime_database_url" DATABASE_URL="$team_owner_database_url" DATABASE_SYSTEM_URL="$team_owner_database_url" \
            pnpm exec vitest run packages/db/src/manifest-checksum.runtime.test.ts \
            --reporter=json --outputFile="$RUNNER_TEMP/manifest-checksum-runtime.json"
          assert_named_tests_passed "$RUNNER_TEMP/manifest-checksum-runtime.json" \
            'round-trips reordered JSONB, detects tampering, and leaves legacy hashes unavailable'

          ACCOUNT_PREFERENCE_RLS_RUNTIME_TEST=1 RLS_RUNTIME_DATABASE_URL="$team_runtime_database_url" DATABASE_URL="$team_owner_database_url" \
            pnpm exec vitest run packages/db/src/account-preference.rls.runtime.test.ts \
            --reporter=json --outputFile="$RUNNER_TEMP/account-preference-rls-runtime.json"
          assert_named_tests_passed "$RUNNER_TEMP/account-preference-rls-runtime.json" \
            'denies unbound and other-account reads and writes' \
            'allows the owning account without workspace context'

      - name: Test worker egress pin rotation
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: sh ops/worker/refresh-egress.test.sh

      - name: Test Azure deployment and alert operations
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          bash .github/scripts/tests/test-promote-worker-vm.sh
          bash .github/scripts/tests/test-check-engine-revision-parity.sh
          bash .github/scripts/tests/test-configure-cloud-billing-admission.sh
          bash .github/scripts/tests/test-azure-secret-set.sh
          bash .github/scripts/tests/test-validate-worker-provenance.sh
          sh ops/monitoring/scan-admission.test.sh
          sh ops/deployment/azure-vm-run-command.test.sh
          sh ops/monitoring/provision-alerts.test.sh
          sh ops/worker/refresh-secrets.test.sh

      - name: Test worker stop provenance
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: sh ops/worker/capture-stop-provenance.test.sh

      - name: Build app and shared packages
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        run: pnpm build

      - name: Build marketing
        if: needs.changes.outputs.marketing == 'true' && needs.changes.outputs.app != 'true' && needs.changes.outputs.shared != 'true'
        run: |
          # The browser suite's webServer serves this exact artifact, so this
          # build carries the local-preview flag (measured ~15s of astro work
          # it used to do twice). The marker is what scripts/preview-build.mjs
          # checks before reusing the output. This is still a full astro build
          # of identical source — the flag only flips one middleware branch —
          # and the production deploy job builds its own unflagged artifact,
          # so nothing promotes a preview build.
          LYRASHIELD_LOCAL_PREVIEW=1 pnpm --filter @lyrashield/marketing build
          touch apps/marketing/dist/.local-preview

      # Cache the Playwright browser binary so the install step does not
      # re-download chromium on every run. Keyed on the @playwright/test
      # version so a version bump busts the cache. On a hit the browser
      # download is skipped (only --with-deps system packages run), which is
      # what makes the install step reliably fit its timeout. Added after the
      # step timed out at 8 minutes three runs in a row (2026-08-19/20).
      - name: Cache Playwright browser
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.marketing == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Hash the installed @playwright/test version out of the lockfile so
          # a Playwright upgrade invalidates the cache automatically.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.marketing == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        timeout-minutes: 15
        run: |
          # Playwright needs Ubuntu packages, not GitHub's preconfigured Google
          # Chrome repository. Disable that unrelated repository so an upstream
          # metadata publication race cannot break apt update.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          pnpm exec playwright install --with-deps chromium

      - name: Marketing browser E2E
        id: marketing_browser
        if: needs.changes.outputs.marketing == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        timeout-minutes: 10
        env:
          WRANGLER_LOG_PATH: ${{ github.workspace }}/artifacts/marketing-preview
        run: pnpm --filter @lyrashield/marketing test:browser

      - name: Retain marketing browser failure diagnostics
        if: failure() && steps.marketing_browser.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-browser-failure-${{ github.run_attempt }}
          path: |
            artifacts/marketing-preview/
            apps/marketing/test-results/
          retention-days: 3
          if-no-files-found: warn

      - name: Browser E2E (includes functional mobile shell at 390px)
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        timeout-minutes: 15
        # DATABASE_URL: the NOBYPASSRLS runtime role — the app under test runs
        # with RLS enforced, so e2e exercises the real RLS posture.
        # DATABASE_SYSTEM_URL: the privileged (owner) role for cross-workspace
        # system operations (e.g. license activation's workspace-less global
        # key-hash lookup). getSystemPrisma() uses this; without it the license
        # activation/connect/renew/verify flows can't read NULL-workspaceId or
        # cross-workspace License rows under FORCE RLS.
        # This deterministic value is only for the disposable CI database; it
        # is not a production secret or a deploy configuration source.
        run: |
          IP_HASH_SALT='ci-only-nonproduction-ip-hash-salt-32chars' \
            DATABASE_URL="$RLS_RUNTIME_DATABASE_URL" \
            DATABASE_SYSTEM_URL="postgresql://lyrashield:lyrashield@localhost:5432/lyrashield?schema=public" \
            pnpm exec playwright test

      - name: Portable browser harness
        if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.shared == 'true' && needs.changes.outputs.tooling-only != 'true')
        timeout-minutes: 10
        run: pnpm test:browser-harness

  engine-worker-contract:
    name: Pinned Engine / Worker Contract
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify ENGINE_REVISION parity across release workflows
        shell: bash
        run: bash .github/scripts/check-engine-revision-parity.sh

      - name: Read pinned engine revision
        id: engine
        shell: bash
        run: |
          revision="$(sed -nE 's/^  ENGINE_REVISION: ([0-9a-f]{40})$/\1/p' .github/workflows/deploy-azure.yml)"
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy-azure.yml must contain one immutable ENGINE_REVISION"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/lyrashield-engine
          ref: ${{ steps.engine.outputs.revision }}
          fetch-depth: 0
          path: lyrashield-engine
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Verify engine revision provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/verify-engine-revision.sh \
            lyrashield-engine "${{ steps.engine.outputs.revision }}" \
            "${{ github.repository_owner }}/lyrashield-engine"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify pinned engine-worker contract
        run: bash .github/scripts/verify-engine-worker-contract.sh lyrashield-engine "$GITHUB_WORKSPACE"

  # PR gate: prove the production image targets build from this revision.
  # push=false — nothing leaves the runner — so the job needs no registry
  # credentials, no environment and no OIDC. Plain pull_request (never
  # pull_request_target) keeps fork code out of a privileged context, and the
  # job-level token is contents:read only. Cache scopes are per-target and
  # distinct from the production scopes so PR layers cannot poison release
  # cache entries. Build args are dummy values; production URLs/keys come only
  # from the deploy workflow.
  desktop-rust:
    name: Desktop Rust (cargo)
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, audited 2026-08-24
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Audit Rust dependencies
        working-directory: apps/desktop/src-tauri
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

      - name: Format check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Test (includes golden-vector parity)
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Build (arm64)
        working-directory: apps/desktop/src-tauri
        run: cargo build --target aarch64-apple-darwin

      - name: Build (x86_64 cross-compile)
        working-directory: apps/desktop/src-tauri
        run: cargo build --target x86_64-apple-darwin

  desktop-frontend:
    name: Desktop Frontend (Vite/React)
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          # Every workflow runs pnpm install as an explicit step; the
          # successor action's install default is true, so opt out.
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @lyrashield/desktop-frontend typecheck

      - name: Lint CI tooling
        if: needs.changes.outputs.tooling-only == 'true'
        run: pnpm exec eslint run-all-tests.mjs .github/scripts/*.mjs .github/scripts/tests/*.mjs

      - name: Lint
        run: pnpm --filter @lyrashield/desktop-frontend lint

      - name: Test desktop frontend
        run: pnpm exec vitest run apps/desktop/frontend

      - name: Build
        run: pnpm --filter @lyrashield/desktop-frontend build

      - name: Typecheck portable browser harness
        if: needs.changes.outputs.app != 'true' && needs.changes.outputs.shared != 'true'
        run: pnpm typecheck:browser-harness

      - name: Lint portable browser harness
        if: needs.changes.outputs.app != 'true' && needs.changes.outputs.shared != 'true'
        run: pnpm lint:browser-harness

      - name: Cache Playwright browser for Desktop
        if: needs.changes.outputs.app != 'true' && needs.changes.outputs.shared != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium for desktop browser harness
        if: needs.changes.outputs.app != 'true' && needs.changes.outputs.shared != 'true'
        timeout-minutes: 15
        run: |
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          pnpm exec playwright install --with-deps chromium

      - name: Portable browser harness for Desktop
        if: needs.changes.outputs.app != 'true' && needs.changes.outputs.shared != 'true'
        timeout-minutes: 10
        run: pnpm test:browser-harness
