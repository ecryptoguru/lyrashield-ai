name: Update GitHub Action version

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-action-v2-version
  cancel-in-progress: true

jobs:
  update-action-version:
    name: Update v2 action tag
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update v2 tag to latest green main
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git tag -fa v2 -m "Update v2 tag to ${HEAD_SHA}" "$HEAD_SHA"
          git push origin v2 --force

      - name: Ensure v2 release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v2 >/dev/null 2>&1; then
            gh release create v2 --title "LyraShield Security Scan v2" --generate-notes
          fi
