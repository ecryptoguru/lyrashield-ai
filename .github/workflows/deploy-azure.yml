name: Deploy to Azure

on:
  workflow_call:
    inputs:
      source_sha:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Current main SHA to deploy
        required: true
        type: string
      webhook_claims_cutover:
        description: Only for the founder-approved first app/worker maintenance window; signed historical UTC evidence and all drain, identity, and fallback gates are still required
        required: false
        default: false
        type: boolean
      confirmation:
        description: Type deploy:<source_sha> for a normal manual deploy or webhook-cutover:<source_sha> for the approved first cutover
        required: true
        type: string

concurrency:
  group: deploy-azure-${{ vars.AZURE_RESOURCE_GROUP || 'production' }}-${{ vars.AZURE_WORKER_VM_NAME || 'lyrashield-worker' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DEPLOY_SHA: ${{ inputs.source_sha || github.sha }}
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository }}/lyrashield-web
  WORKER_IMAGE: ghcr.io/${{ github.repository }}/lyrashield-worker
  EGRESS_PROXY_IMAGE: ghcr.io/${{ github.repository }}/lyrashield-egress-proxy
  ENGINE_REVISION: 3001517530300ca5f602536bfadcbd3c95ad3039
  MARKETING_URL: ${{ vars.LYRASHIELD_MARKETING_URL || 'https://lyrashieldai.com' }}
  APP_URL: ${{ vars.LYRASHIELD_APP_URL || 'https://app.lyrashieldai.com' }}
  SCANNER_URL: ${{ vars.LYRASHIELD_SCANNER_URL || 'https://scanner.lyrashieldai.com' }}
  REQUIRE_EMAIL_VERIFICATION: ${{ vars.LYRASHIELD_REQUIRE_EMAIL_VERIFICATION || '1' }}
  PLATFORM_ADMIN_EMAILS: ecryptoguru@gmail.com,ankit@lyrashieldai.com
  CLOUDFLARE_ORIGIN_MTLS: ${{ vars.CLOUDFLARE_ORIGIN_MTLS || 'off' }}
  CLOUDFLARE_AOP_CERT_SHA256: ${{ vars.CLOUDFLARE_AOP_CERT_SHA256 || '' }}

jobs:
  validate-manual-production-dispatch:
    name: Validate emergency production dispatch
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      recovery_requires_receipt: ${{ steps.dispatch.outputs.recovery_requires_receipt }}
    steps:
      - name: Checkout trusted main dispatch validator
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false

      - name: Require the current main SHA and exact confirmation
        if: github.event_name == 'workflow_dispatch'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          WEBHOOK_CLAIMS_CUTOVER: ${{ inputs.webhook_claims_cutover }}
        run: bash .github/scripts/validate-webhook-deploy-dispatch.sh

  preflight-cutover-evidence:
    name: Verify signed cutover evidence before image build
    needs: validate-manual-production-dispatch
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.webhook_claims_cutover == true &&
      vars.AZURE_RESOURCE_GROUP != '' &&
      ((vars.AZURE_APP_CONTAINER_APP_NAME != '') || (vars.AZURE_SCANNER_CONTAINER_APP_NAME != ''))
    runs-on: ubuntu-24.04
    environment:
      name: azure-production
    permissions:
      contents: read
    steps:
      - name: Checkout exact cutover source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Confirm cutover source remains current main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ env.DEPLOY_SHA }}
          RECOVERY_REQUIRES_RECEIPT: ${{ needs.validate-manual-production-dispatch.outputs.recovery_requires_receipt }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$SOURCE_SHA" != "$latest_main" ] && [ "$RECOVERY_REQUIRES_RECEIPT" != true ]; then
            echo "::error::Cutover source is no longer current main; select the current SHA and refresh the signed receipt."
            exit 1
          fi
          if [ "$SOURCE_SHA" != "$latest_main" ]; then
            echo "Revalidating signed evidence for the original immutable source; runtime recovery still requires its owned maintenance receipt."
          fi

      - name: Verify signed historical UTC receipt before image build
        env:
          EXPECTED_SOURCE_SHA: ${{ env.DEPLOY_SHA }}
          MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          WEBHOOK_LEGACY_TIMEZONE_REVIEW_RECEIPT: ${{ secrets.WEBHOOK_LEGACY_TIMEZONE_REVIEW_RECEIPT }}
          WEBHOOK_LEGACY_TIMEZONE_REVIEW_PUBLIC_KEY_PEM: ${{ secrets.WEBHOOK_LEGACY_TIMEZONE_REVIEW_PUBLIC_KEY_PEM }}
        run: node .github/scripts/verify-webhook-timezone-evidence.mjs

      - name: Summarize blocked cutover evidence preflight
        if: failure()
        env:
          SOURCE_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          {
            echo "## Cutover evidence preflight blocked"
            echo
            echo "No container images were built or pushed, and no Azure runtime or database changes were made."
            echo "A designated reviewer must substantiate the historical UTC interpretation; an authorized signer must sign a source- and database-bound receipt."
            echo "After that evidence is approved, place only the Ed25519 public key and signed receipt in the azure-production Environment secrets."
            echo "See [the cutover runbook](https://github.com/ecryptoguru/lyrashield-ai/blob/main/docs/reviews/2026-09-30/webhook-production-cutover.md)."
            echo "Then rerun the no-deployment verifier and use the protected maintenance dispatch only after founder approval."
          } >> "$GITHUB_STEP_SUMMARY"

  preflight-compatible-baseline:
    name: Check existing webhook writers before image build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.webhook_claims_cutover != true) &&
      vars.AZURE_RESOURCE_GROUP != '' &&
      ((vars.AZURE_APP_CONTAINER_APP_NAME != '') || (vars.AZURE_SCANNER_CONTAINER_APP_NAME != ''))
    runs-on: ubuntu-24.04
    environment:
      name: azure-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout exact deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm deployment source remains current main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ env.DEPLOY_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$SOURCE_SHA" != "$latest_main" ]; then
            echo "::error::Release source is no longer current main; the queued current-main release must perform the deployment."
            exit 1
          fi

      - name: Log in to Azure for read-only compatibility preflight
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_DEPLOY_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps extension
        run: az extension add --name containerapp --yes --only-show-errors

      - name: Verify compatible webhook baseline before image build
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          AZURE_SCANNER_CONTAINER_APP_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
          AZURE_WORKER_VM_NAME: ${{ vars.AZURE_WORKER_VM_NAME || 'lyrashield-worker' }}
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME || 'lyrashieldprodsecrets' }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/verify-webhook-cutover.mjs

      - name: Summarize blocked compatibility preflight
        if: failure()
        run: |
          {
            echo "## Azure release stopped before image build"
            echo
            echo "The preflight is read-only. No container images were built or pushed, and no Azure runtime or database changes were made."
            echo "Review the failed read-only step. Incompatible writers require the separately approved first-cutover maintenance window; do not deactivate a revision or retry an ordinary release as a shortcut."
            echo "See [the cutover runbook](https://github.com/ecryptoguru/lyrashield-ai/blob/main/docs/reviews/2026-09-30/webhook-production-cutover.md) and run the protected no-deployment verifier."
            echo "A cutover dispatch requires current main, webhook_claims_cutover=true, and confirmation webhook-cutover:<source_sha> after the founder-approved window."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs:
      - validate-manual-production-dispatch
      - preflight-cutover-evidence
      - preflight-compatible-baseline
    name: Build and push container images
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.validate-manual-production-dispatch.result == 'success' &&
      (needs.preflight-cutover-evidence.result == 'success' || needs.preflight-cutover-evidence.result == 'skipped') &&
      (needs.preflight-compatible-baseline.result == 'success' || needs.preflight-compatible-baseline.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    outputs:
      web_image: ${{ steps.meta.outputs.web_image }}
      worker_image: ${{ steps.meta.outputs.worker_image }}
      egress_proxy_image: ${{ steps.meta.outputs.egress_proxy_image }}
      engine_revision: ${{ steps.meta.outputs.engine_revision }}
      web_digest: ${{ steps.build-web.outputs.digest }}
      worker_digest: ${{ steps.build-worker.outputs.digest }}
      egress_proxy_digest: ${{ steps.build-egress-proxy.outputs.digest }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      # A production worker is reproducible only when its engine input is immutable.
      # Upgrade this pin deliberately after the cross-repository contract gate passes.
      - name: Checkout engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/lyrashield-engine
          ref: ${{ env.ENGINE_REVISION }}
          fetch-depth: 0
          path: lyrashield-engine
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Verify engine revision provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/verify-engine-revision.sh \
            lyrashield-engine "${{ env.ENGINE_REVISION }}" \
            "${{ github.repository_owner }}/lyrashield-engine"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify build environment isolation
        run: |
          if [ -n "${POLAR_ENVIRONMENT:-}" ]; then
            echo "::error::Provider runtime configuration must not leak into build-time contract tests."
            exit 1
          fi

      - name: Verify engine-worker contract
        run: bash .github/scripts/verify-engine-worker-contract.sh lyrashield-engine "$GITHUB_WORKSPACE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          {
            echo "web_image=${{ env.WEB_IMAGE }}:${{ env.DEPLOY_SHA }}"
            echo "worker_image=${{ env.WORKER_IMAGE }}:${{ env.DEPLOY_SHA }}"
            echo "egress_proxy_image=${{ env.EGRESS_PROXY_IMAGE }}:${{ env.DEPLOY_SHA }}"
            echo "engine_revision=${{ env.ENGINE_REVISION }}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify production analytics project key
        env:
          POSTHOG_PUBLIC_PROJECT_KEY: ${{ vars.POSTHOG_PUBLIC_PROJECT_KEY }}
        run: |
          if [[ ! "$POSTHOG_PUBLIC_PROJECT_KEY" =~ ^phc_[A-Za-z0-9]+$ ]]; then
            echo "::error::POSTHOG_PUBLIC_PROJECT_KEY is missing or malformed."
            exit 1
          fi

      - name: Build and push web image
        id: build-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          sbom: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.DEPLOY_SHA }},${{ env.WEB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          build-args: |
            BUILD_APP_URL=${{ env.APP_URL }}
            BUILD_PUBLIC_APP_URL=${{ env.SCANNER_URL }}
            BUILD_PUBLIC_MARKETING_URL=${{ env.MARKETING_URL }}
            BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
            BUILD_LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=${{ env.REQUIRE_EMAIL_VERIFICATION }}
            BUILD_NEXT_PUBLIC_POSTHOG_KEY=${{ vars.POSTHOG_PUBLIC_PROJECT_KEY }}
            BUILD_NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            BUILD_NEXT_PUBLIC_SENTRY_RELEASE=${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        id: build-worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          push: true
          sbom: true
          # Worker candidates stay immutable. Deployment consumes the verified digest;
          # no mutable :latest tag may point at an image before policy verification.
          tags: ${{ env.WORKER_IMAGE }}:${{ env.DEPLOY_SHA }}
          build-contexts: |
            engine=lyrashield-engine
          build-args: |
            BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
            io.lyrashield.engine.revision=${{ env.ENGINE_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push egress-proxy image
        id: build-egress-proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: egress-proxy
          push: true
          sbom: true
          tags: ${{ env.EGRESS_PROXY_IMAGE }}:${{ env.DEPLOY_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed worker image
        run: |
          worker_ref="${{ env.WORKER_IMAGE }}@${{ steps.build-worker.outputs.digest }}"
          docker pull "$worker_ref"
          bash apps/worker/scripts/verify-worker-image.sh \
            "$worker_ref" "${{ env.DEPLOY_SHA }}" "${{ env.ENGINE_REVISION }}"

      - name: Image digests and SBOM attestation references
        if: steps.build-worker.outcome == 'success'
        shell: bash
        env:
          WEB_IMAGE_REF: ${{ env.WEB_IMAGE }}
          WEB_DIGEST: ${{ steps.build-web.outputs.digest }}
          WORKER_IMAGE_REF: ${{ env.WORKER_IMAGE }}
          WORKER_DIGEST: ${{ steps.build-worker.outputs.digest }}
          EGRESS_PROXY_IMAGE_REF: ${{ env.EGRESS_PROXY_IMAGE }}
          EGRESS_PROXY_DIGEST: ${{ steps.build-egress-proxy.outputs.digest }}
        run: |
          {
            echo "### Image digests and SBOM attestation references"
            echo
            echo "| Image | Runtime image reference | SBOM attestation reference |"
            echo "| --- | --- | --- |"
            echo "| Web | ${WEB_IMAGE_REF}@${WEB_DIGEST} | BuildKit SBOM attestation subject: ${WEB_IMAGE_REF}@${WEB_DIGEST} |"
            echo "| Worker | ${WORKER_IMAGE_REF}@${WORKER_DIGEST} | BuildKit SBOM attestation subject: ${WORKER_IMAGE_REF}@${WORKER_DIGEST} |"
            echo "| Egress proxy | ${EGRESS_PROXY_IMAGE_REF}@${EGRESS_PROXY_DIGEST} | BuildKit SBOM attestation subject: ${EGRESS_PROXY_IMAGE_REF}@${EGRESS_PROXY_DIGEST} |"
            echo
            echo "SBOM references identify image subjects. Runtime references above retain the image digests used for deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      # Validates the exact immutable values the worker VM must inject into its
      # runtime environment (LYRASHIELD_PRODUCT_REVISION / _WORKER_IMAGE_DIGEST /
      # _ENGINE_REVISION) and records them for the guarded promotion below.
      - name: Validate worker provenance record
        if: steps.build-worker.outcome == 'success'
        shell: bash
        run: |
          bash .github/scripts/validate-worker-provenance.sh \
            "${{ steps.build-worker.outputs.digest }}" \
            "${{ env.DEPLOY_SHA }}" \
            "${{ env.ENGINE_REVISION }}"

  # Every merge to main pushes new SHA-tagged images; web also re-points :latest, while workers
  # remain immutable and deploy by verified digest. Multi-arch buildx pushes leave untagged manifests
  # per build (per-platform layers under the tagged manifest list), so versions accumulate
  # faster than commits. Cleanup runs only after the deploy job has promoted and verified
  # the worker digest. This avoids registry eventual-consistency races deleting a candidate
  # before the VM has pulled it.
  #
  # Uses dataaxiom/ghcr-cleanup-action rather than a raw "delete this version ID" call: it
  # resolves multi-arch manifest lists first and will not delete an untagged manifest that a
  # kept tagged version still references, which a naive per-ID delete could do and break a
  # pull of an image that still LOOKS tagged and valid.
  cleanup-old-images:
    name: Clean up superseded container images
    needs: [build, deploy]
    if: needs.build.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Delete untagged and superseded web/scanner image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: lyrashield-ai/lyrashield-web
          # Keep the most recent 10 tagged versions (the deployed one plus a safety margin
          # for rollback) and remove every dangling untagged manifest.
          keep-n-tagged: 10
          delete-untagged: true
          # Live as of 2026-07-30. Founder-approved after reviewing a real dry-run pass
          # (run 30496418272): it reported "no tagged images found to delete" and "no
          # untagged images found" for both packages — with only ~10 accumulated versions
          # against keep-n-tagged: 10, nothing had aged out yet, so the first live run is a
          # verified no-op, not a leap of faith. The full sign-off record lives in
          # git history (docs/deployment/PRODUCTION_DEPLOYMENT.md, removed 2026-09-09).

          dry-run: false

      - name: Delete untagged and superseded worker image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: lyrashield-ai/lyrashield-worker
          # Worker images are pinned by digest on the worker VM, and the approved digest may
          # lag behind main deploys. Keep a much longer tail so a pinned digest is not garbage
          # collected while still in use.
          keep-n-tagged: 100
          delete-untagged: true
          dry-run: false

      - name: Delete superseded egress-proxy image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: lyrashield-ai/lyrashield-egress-proxy
          keep-n-tagged: 20
          delete-untagged: true
          dry-run: false

  verify-built-worker-image:
    name: Rehearse exact release worker image on disposable services
    needs: build
    if: needs.build.result == 'success'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/verify-webhook-worker-image.yml
    with:
      product_source_sha: ${{ inputs.source_sha || github.sha }}
      engine_revision: ${{ needs.build.outputs.engine_revision }}
      worker_image: ${{ needs.build.outputs.worker_image }}@${{ needs.build.outputs.worker_digest }}

  deploy:
    name: Deploy Azure Container Apps
    needs: [build, verify-built-worker-image, validate-manual-production-dispatch]
    if: >
      (vars.AZURE_RESOURCE_GROUP != '') &&
      ((vars.AZURE_APP_CONTAINER_APP_NAME != '') || (vars.AZURE_SCANNER_CONTAINER_APP_NAME != ''))
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-azure-runtime.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      webhook_recovery_requires_receipt: ${{ needs.validate-manual-production-dispatch.outputs.recovery_requires_receipt == 'true' }}
      webhook_claims_cutover: ${{ github.event_name == 'workflow_dispatch' && inputs.webhook_claims_cutover == true }}
      engine_revision: ${{ needs.build.outputs.engine_revision }}
      web_image: ${{ needs.build.outputs.web_image }}
      web_digest: ${{ needs.build.outputs.web_digest }}
      worker_image: ${{ needs.build.outputs.worker_image }}
      worker_digest: ${{ needs.build.outputs.worker_digest }}
      egress_proxy_image: ${{ needs.build.outputs.egress_proxy_image }}
      egress_proxy_digest: ${{ needs.build.outputs.egress_proxy_digest }}
    secrets: inherit
