name: Deploy to Azure

on:
  workflow_call:
    inputs:
      source_sha:
        required: false
        type: string
      held_recovery_original_run_id:
        required: false
        default: ""
        type: string
      held_recovery_prepared_run_id:
        required: false
        default: ""
        type: string
      held_recovery_original_owner:
        required: false
        default: ""
        type: string
      held_recovery_original_source_sha:
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Current main SHA to deploy
        required: true
        type: string
concurrency:
  group: deploy-azure-${{ vars.AZURE_RESOURCE_GROUP || 'production' }}-${{ vars.AZURE_WORKER_VM_NAME || 'lyrashield-worker' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DEPLOY_SHA: ${{ inputs.source_sha || github.sha }}
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository }}/lyrashield-web
  WORKER_IMAGE: ghcr.io/${{ github.repository }}/lyrashield-worker
  EGRESS_PROXY_IMAGE: ghcr.io/${{ github.repository }}/lyrashield-egress-proxy
  ENGINE_REVISION: 3001517530300ca5f602536bfadcbd3c95ad3039
  MARKETING_URL: ${{ vars.LYRASHIELD_MARKETING_URL || 'https://lyrashieldai.com' }}
  APP_URL: ${{ vars.LYRASHIELD_APP_URL || 'https://app.lyrashieldai.com' }}
  SCANNER_URL: ${{ vars.LYRASHIELD_SCANNER_URL || 'https://scanner.lyrashieldai.com' }}
  REQUIRE_EMAIL_VERIFICATION: ${{ vars.LYRASHIELD_REQUIRE_EMAIL_VERIFICATION || '1' }}
  PLATFORM_ADMIN_EMAILS: ecryptoguru@gmail.com,ankit@lyrashieldai.com
  CLOUDFLARE_ORIGIN_MTLS: ${{ vars.CLOUDFLARE_ORIGIN_MTLS || 'off' }}
  CLOUDFLARE_AOP_CERT_SHA256: ${{ vars.CLOUDFLARE_AOP_CERT_SHA256 || '' }}

jobs:
  validate-manual-production-dispatch:
    name: Validate emergency production dispatch
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted main dispatch validator
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false

      - name: Require the exact current main SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash .github/scripts/validate-webhook-deploy-dispatch.sh

  preflight-compatible-baseline:
    name: Check existing webhook writers before image build
    if: github.ref == 'refs/heads/main'
    outputs:
      webhook_claims_cutover: ${{ steps.verify-baseline.outputs.webhook_claims_cutover }}
      held_recovery_verified: ${{ steps.verify-held.outputs.held_recovery_verified }}
      held_recovery_original_run_id: ${{ steps.verify-held.outputs.held_recovery_original_run_id }}
      held_recovery_original_owner: ${{ steps.verify-held.outputs.held_recovery_original_owner }}
      held_recovery_original_source_sha: ${{ steps.verify-held.outputs.held_recovery_original_source_sha }}
    runs-on: ubuntu-24.04
    environment:
      name: azure-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout exact deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm deployment source remains current main
        if: github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ env.DEPLOY_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$SOURCE_SHA" != "$latest_main" ]; then
            echo "::error::Release source is no longer current main; the queued current-main release must perform the deployment."
            exit 1
          fi

      - name: Validate required Azure writer configuration
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
        run: |
          test -n "$AZURE_RESOURCE_GROUP" || { echo '::error::Missing Azure resource group'; exit 1; }
          test -n "$AZURE_APP_CONTAINER_APP_NAME" || { echo '::error::Missing Azure app writer baseline'; exit 1; }

      - name: Log in to Azure for read-only compatibility preflight
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_DEPLOY_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps extension
        run: az extension add --name containerapp --yes --only-show-errors

      - name: Classify webhook baseline before image build
        if: inputs.held_recovery_original_run_id == ''
        id: verify-baseline
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          WORKER_VM_NAME: ${{ vars.AZURE_WORKER_VM_NAME || 'lyrashield-worker' }}
          LYRASHIELD_ADMISSION_STOP_OWNER: ${{ github.run_id }}:${{ github.run_attempt }}
          LYRASHIELD_WEBHOOK_CUTOVER_RUN_ID: ${{ github.run_id }}
          LYRASHIELD_WEBHOOK_CUTOVER_ATTEMPT: ${{ github.run_attempt }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          AZURE_SCANNER_CONTAINER_APP_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
          AZURE_WEBHOOK_WRITER_TOPOLOGY: ${{ vars.AZURE_WEBHOOK_WRITER_TOPOLOGY || 'app-and-scanner' }}
          AZURE_WORKER_VM_NAME: ${{ vars.AZURE_WORKER_VM_NAME || 'lyrashield-worker' }}
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME || 'lyrashieldprodsecrets' }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/verify-webhook-cutover-preflight.mjs

      - name: Verify explicitly scoped held cutover before image build
        if: inputs.held_recovery_original_run_id != ''
        id: verify-held
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          LYRASHIELD_WEBHOOK_CUTOVER_ORIGINAL_RUN_ID: ${{ inputs.held_recovery_original_run_id }}
          LYRASHIELD_WEBHOOK_CUTOVER_ORIGINAL_OWNER: ${{ inputs.held_recovery_original_owner }}
          LYRASHIELD_WEBHOOK_CUTOVER_OWNER_SOURCE_SHA: ${{ inputs.held_recovery_original_source_sha }}
          LYRASHIELD_WEBHOOK_CUTOVER_RECOVERY_RUN_ID: ${{ github.run_id }}
          LYRASHIELD_WEBHOOK_CUTOVER_RECOVERY_ATTEMPT: ${{ github.run_attempt }}
          LYRASHIELD_WEBHOOK_CUTOVER_RECOVERY_SOURCE_SHA: ${{ env.DEPLOY_SHA }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          WORKER_VM_NAME: ${{ vars.AZURE_WORKER_VM_NAME || 'lyrashield-worker' }}
          LYRASHIELD_ADMISSION_STOP_OWNER: ${{ github.run_id }}:${{ github.run_attempt }}
          LYRASHIELD_WEBHOOK_CUTOVER_RUN_ID: ${{ github.run_id }}
          LYRASHIELD_WEBHOOK_CUTOVER_ATTEMPT: ${{ github.run_attempt }}
        run: node .github/scripts/verify-webhook-cutover-preflight.mjs --new-run-recovery

      - name: Summarize blocked compatibility preflight
        if: failure()
        env:
          HELD_RECOVERY_REQUESTED: ${{ inputs.held_recovery_original_run_id != '' }}
        run: |
          {
            echo "## Azure release stopped before image build"
            echo
            echo "The preflight is read-only. No container images were built or pushed, and no Azure runtime or database changes were made."
            if [ "$HELD_RECOVERY_REQUESTED" = true ]; then
              echo "Held recovery requires the exact current main candidate, explicit original run/source/owner, matching failed GitHub run, and an unambiguous original VM receipt."
            else
              echo "The read-only verifier selects the ordinary rollout only for a complete durable-claims/2 baseline, or the first maintenance rollout only for the recognized durable-claims/1 source and exact pre-cutover schema. Mixed, partial, unknown, or unreadable states stop before image build."
            fi
            echo "See [the automated cutover runbook](https://github.com/ecryptoguru/lyrashield-ai/blob/main/docs/reviews/2026-09-30/webhook-production-cutover.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs:
      - validate-manual-production-dispatch
      - preflight-compatible-baseline
    name: Build and push container images
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() &&
      inputs.held_recovery_original_run_id == '' &&
      github.ref == 'refs/heads/main' &&
      needs.validate-manual-production-dispatch.result == 'success' &&
      needs.preflight-compatible-baseline.result == 'success' }}
    permissions:
      contents: read
      packages: write
    outputs:
      web_image: ${{ steps.meta.outputs.web_image }}
      worker_image: ${{ steps.meta.outputs.worker_image }}
      egress_proxy_image: ${{ steps.meta.outputs.egress_proxy_image }}
      engine_revision: ${{ steps.meta.outputs.engine_revision }}
      web_digest: ${{ steps.build-web.outputs.digest }}
      worker_digest: ${{ steps.build-worker.outputs.digest }}
      egress_proxy_digest: ${{ steps.build-egress-proxy.outputs.digest }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      # A production worker is reproducible only when its engine input is immutable.
      # Upgrade this pin deliberately after the cross-repository contract gate passes.
      - name: Checkout engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/lyrashield-engine
          ref: ${{ env.ENGINE_REVISION }}
          fetch-depth: 0
          path: lyrashield-engine
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Verify engine revision provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/verify-engine-revision.sh \
            lyrashield-engine "${{ env.ENGINE_REVISION }}" \
            "${{ github.repository_owner }}/lyrashield-engine"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify build environment isolation
        run: |
          if [ -n "${POLAR_ENVIRONMENT:-}" ]; then
            echo "::error::Provider runtime configuration must not leak into build-time contract tests."
            exit 1
          fi

      - name: Verify engine-worker contract
        run: bash .github/scripts/verify-engine-worker-contract.sh lyrashield-engine "$GITHUB_WORKSPACE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          {
            echo "web_image=${{ env.WEB_IMAGE }}:${{ env.DEPLOY_SHA }}"
            echo "worker_image=${{ env.WORKER_IMAGE }}:${{ env.DEPLOY_SHA }}"
            echo "egress_proxy_image=${{ env.EGRESS_PROXY_IMAGE }}:${{ env.DEPLOY_SHA }}"
            echo "engine_revision=${{ env.ENGINE_REVISION }}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify production analytics project key
        env:
          POSTHOG_PUBLIC_PROJECT_KEY: ${{ vars.POSTHOG_PUBLIC_PROJECT_KEY }}
        run: |
          if [[ ! "$POSTHOG_PUBLIC_PROJECT_KEY" =~ ^phc_[A-Za-z0-9]+$ ]]; then
            echo "::error::POSTHOG_PUBLIC_PROJECT_KEY is missing or malformed."
            exit 1
          fi

      - name: Build and push web image
        id: build-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          sbom: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.DEPLOY_SHA }},${{ env.WEB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          build-args: |
            BUILD_APP_URL=${{ env.APP_URL }}
            BUILD_PUBLIC_APP_URL=${{ env.SCANNER_URL }}
            BUILD_PUBLIC_MARKETING_URL=${{ env.MARKETING_URL }}
            BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
            BUILD_LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=${{ env.REQUIRE_EMAIL_VERIFICATION }}
            BUILD_NEXT_PUBLIC_POSTHOG_KEY=${{ vars.POSTHOG_PUBLIC_PROJECT_KEY }}
            BUILD_NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            BUILD_NEXT_PUBLIC_SENTRY_RELEASE=${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,mode=max,scope=release-web

      - name: Build and push worker image
        id: build-worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          push: true
          sbom: true
          # Worker candidates stay immutable. Deployment consumes the verified digest;
          # no mutable :latest tag may point at an image before policy verification.
          tags: ${{ env.WORKER_IMAGE }}:${{ env.DEPLOY_SHA }}
          build-contexts: |
            engine=lyrashield-engine
          build-args: |
            BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
            io.lyrashield.engine.revision=${{ env.ENGINE_REVISION }}
          cache-from: type=gha,scope=release-worker
          cache-to: type=gha,mode=max,scope=release-worker

      - name: Build and push egress-proxy image
        id: build-egress-proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: egress-proxy
          push: true
          sbom: true
          tags: ${{ env.EGRESS_PROXY_IMAGE }}:${{ env.DEPLOY_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=release-egress-proxy
          cache-to: type=gha,mode=max,scope=release-egress-proxy

      - name: Verify pushed worker image
        run: |
          worker_ref="${{ env.WORKER_IMAGE }}@${{ steps.build-worker.outputs.digest }}"
          docker pull "$worker_ref"
          bash apps/worker/scripts/verify-worker-image.sh \
            "$worker_ref" "${{ env.DEPLOY_SHA }}" "${{ env.ENGINE_REVISION }}"

      - name: Image digests and SBOM attestation references
        if: steps.build-worker.outcome == 'success'
        shell: bash
        env:
          WEB_IMAGE_REF: ${{ env.WEB_IMAGE }}
          WEB_DIGEST: ${{ steps.build-web.outputs.digest }}
          WORKER_IMAGE_REF: ${{ env.WORKER_IMAGE }}
          WORKER_DIGEST: ${{ steps.build-worker.outputs.digest }}
          EGRESS_PROXY_IMAGE_REF: ${{ env.EGRESS_PROXY_IMAGE }}
          EGRESS_PROXY_DIGEST: ${{ steps.build-egress-proxy.outputs.digest }}
        run: |
          {
            echo "### Image digests and SBOM attestation references"
            echo
            echo "| Image | Runtime image reference | SBOM attestation reference |"
            echo "| --- | --- | --- |"
            echo "| Web | ${WEB_IMAGE_REF}@${WEB_DIGEST} | BuildKit SBOM attestation subject: ${WEB_IMAGE_REF}@${WEB_DIGEST} |"
            echo "| Worker | ${WORKER_IMAGE_REF}@${WORKER_DIGEST} | BuildKit SBOM attestation subject: ${WORKER_IMAGE_REF}@${WORKER_DIGEST} |"
            echo "| Egress proxy | ${EGRESS_PROXY_IMAGE_REF}@${EGRESS_PROXY_DIGEST} | BuildKit SBOM attestation subject: ${EGRESS_PROXY_IMAGE_REF}@${EGRESS_PROXY_DIGEST} |"
            echo
            echo "SBOM references identify image subjects. Runtime references above retain the image digests used for deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      # Validates the exact immutable values the worker VM must inject into its
      # runtime environment (LYRASHIELD_PRODUCT_REVISION / _WORKER_IMAGE_DIGEST /
      # _ENGINE_REVISION) and records them for the guarded promotion below.
      - name: Validate worker provenance record
        if: steps.build-worker.outcome == 'success'
        shell: bash
        run: |
          bash .github/scripts/validate-worker-provenance.sh \
            "${{ steps.build-worker.outputs.digest }}" \
            "${{ env.DEPLOY_SHA }}" \
            "${{ env.ENGINE_REVISION }}"

  resolve-prepared-images:
    name: Bind held recovery to previously rehearsed image digests
    needs:
      - validate-manual-production-dispatch
      - preflight-compatible-baseline
    if: ${{ !cancelled() &&
      inputs.held_recovery_original_run_id != '' &&
      needs.validate-manual-production-dispatch.result == 'success' &&
      needs.preflight-compatible-baseline.result == 'success' &&
      needs.preflight-compatible-baseline.outputs.held_recovery_verified == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      web_image: ${{ steps.verify.outputs.web_image }}
      web_digest: ${{ steps.verify.outputs.web_digest }}
      worker_image: ${{ steps.verify.outputs.worker_image }}
      worker_digest: ${{ steps.verify.outputs.worker_digest }}
      egress_proxy_image: ${{ steps.verify.outputs.egress_proxy_image }}
      egress_proxy_digest: ${{ steps.verify.outputs.egress_proxy_digest }}
      engine_revision: ${{ steps.verify.outputs.engine_revision }}
      prepared_source_sha: ${{ steps.verify.outputs.prepared_source_sha }}
      prepared_run_id: ${{ steps.verify.outputs.prepared_run_id }}
      prepared_run_attempt: ${{ steps.verify.outputs.prepared_run_attempt }}
      prepared_artifact_digest: ${{ steps.verify.outputs.prepared_artifact_digest }}
      worker_rehearsal_harness_sha: ${{ steps.verify.outputs.worker_rehearsal_harness_sha }}
      worker_rehearsal_harness_revision: ${{ steps.verify.outputs.worker_rehearsal_harness_revision }}
    steps:
      - name: Checkout exact current main candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Confirm prepared image verifier checkout
        run: test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
      - name: Verify prepared run and immutable image artifact
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          LYRASHIELD_WEBHOOK_RECOVERY_PREPARED_RUN_ID: ${{ inputs.held_recovery_prepared_run_id }}
        run: node .github/scripts/verify-webhook-recovery-candidate.mjs

  resolve-images:
    name: Select verified release image digests
    needs: [build, resolve-prepared-images]
    if: ${{ !cancelled() &&
      (needs.build.result == 'success' || needs.resolve-prepared-images.result == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      web_image: ${{ steps.select.outputs.web_image }}
      web_digest: ${{ steps.select.outputs.web_digest }}
      worker_image: ${{ steps.select.outputs.worker_image }}
      worker_digest: ${{ steps.select.outputs.worker_digest }}
      egress_proxy_image: ${{ steps.select.outputs.egress_proxy_image }}
      egress_proxy_digest: ${{ steps.select.outputs.egress_proxy_digest }}
      engine_revision: ${{ steps.select.outputs.engine_revision }}
    steps:
      - name: Select only the image source authorized for this release mode
        id: select
        env:
          HELD_RECOVERY: ${{ inputs.held_recovery_original_run_id != '' }}
          BUILD_RESULT: ${{ needs.build.result }}
          PREPARED_RESULT: ${{ needs.resolve-prepared-images.result }}
          BUILT_WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          BUILT_WEB_DIGEST: ${{ needs.build.outputs.web_digest }}
          BUILT_WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
          BUILT_WORKER_DIGEST: ${{ needs.build.outputs.worker_digest }}
          BUILT_EGRESS_IMAGE: ${{ needs.build.outputs.egress_proxy_image }}
          BUILT_EGRESS_DIGEST: ${{ needs.build.outputs.egress_proxy_digest }}
          BUILT_ENGINE_REVISION: ${{ needs.build.outputs.engine_revision }}
          PREPARED_WEB_IMAGE: ${{ needs.resolve-prepared-images.outputs.web_image }}
          PREPARED_WEB_DIGEST: ${{ needs.resolve-prepared-images.outputs.web_digest }}
          PREPARED_WORKER_IMAGE: ${{ needs.resolve-prepared-images.outputs.worker_image }}
          PREPARED_WORKER_DIGEST: ${{ needs.resolve-prepared-images.outputs.worker_digest }}
          PREPARED_EGRESS_IMAGE: ${{ needs.resolve-prepared-images.outputs.egress_proxy_image }}
          PREPARED_EGRESS_DIGEST: ${{ needs.resolve-prepared-images.outputs.egress_proxy_digest }}
          PREPARED_ENGINE_REVISION: ${{ needs.resolve-prepared-images.outputs.engine_revision }}
        run: |
          set -euo pipefail
          if [ "$HELD_RECOVERY" = true ]; then
            [ "$PREPARED_RESULT" = success ] && [ "$BUILD_RESULT" = skipped ] || exit 1
            prefix=PREPARED
          else
            [ "$BUILD_RESULT" = success ] && [ "$PREPARED_RESULT" = skipped ] || exit 1
            prefix=BUILT
          fi
          for name in WEB_IMAGE WEB_DIGEST WORKER_IMAGE WORKER_DIGEST EGRESS_IMAGE EGRESS_DIGEST ENGINE_REVISION; do
            value_var="${prefix}_${name}"
            value="${!value_var}"
            [ -n "$value" ] || { echo "::error::Verified image output is missing: $name"; exit 1; }
            key=$(tr '[:upper:]' '[:lower:]' <<< "$name")
            [ "$key" != egress_image ] || key=egress_proxy_image
            [ "$key" != egress_digest ] || key=egress_proxy_digest
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

  # Every merge to main pushes new SHA-tagged images; web also re-points :latest, while workers
  # remain immutable and deploy by verified digest. Multi-arch buildx pushes leave untagged manifests
  # per build (per-platform layers under the tagged manifest list), so versions accumulate
  # faster than commits. Cleanup runs only after the deploy job has promoted and verified
  # the worker digest. This avoids registry eventual-consistency races deleting a candidate
  # before the VM has pulled it.
  #
  # Uses dataaxiom/ghcr-cleanup-action rather than a raw "delete this version ID" call: it
  # resolves multi-arch manifest lists first and will not delete an untagged manifest that a
  # kept tagged version still references, which a naive per-ID delete could do and break a
  # pull of an image that still LOOKS tagged and valid.
  cleanup-old-images:
    name: Clean up superseded container images
    needs: [build, deploy]
    if: inputs.held_recovery_original_run_id == '' && needs.build.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Delete untagged and superseded web/scanner image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: lyrashield-ai/lyrashield-web
          # Keep the most recent 10 tagged versions (the deployed one plus a safety margin
          # for rollback) and remove every dangling untagged manifest.
          keep-n-tagged: 10
          delete-untagged: true
          # Live as of 2026-07-30. Founder-approved after reviewing a real dry-run pass
          # (run 30496418272): it reported "no tagged images found to delete" and "no
          # untagged images found" for both packages — with only ~10 accumulated versions
          # against keep-n-tagged: 10, nothing had aged out yet, so the first live run is a
          # verified no-op, not a leap of faith. The full sign-off record lives in
          # git history (docs/deployment/PRODUCTION_DEPLOYMENT.md, removed 2026-09-09).

          dry-run: false

      - name: Delete untagged and superseded worker image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: lyrashield-ai/lyrashield-worker
          # Worker images are pinned by digest on the worker VM, and the approved digest may
          # lag behind main deploys. Keep a much longer tail so a pinned digest is not garbage
          # collected while still in use.
          keep-n-tagged: 100
          delete-untagged: true
          dry-run: false

      - name: Delete superseded egress-proxy image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: lyrashield-ai/lyrashield-egress-proxy
          keep-n-tagged: 20
          delete-untagged: true
          dry-run: false

  verify-built-worker-image:
    name: Rehearse exact release worker image on disposable services
    needs: [resolve-images, resolve-prepared-images]
    # Every ordinary release rehearses its exact image. Held recovery can reuse
    # only the successful preparation proof whose receipt verifier checked the
    # current source, engine, worker digest, harness fingerprint, run attempt,
    # and GitHub artifact checksum.
    if: >-
      !cancelled() &&
      needs.resolve-images.result == 'success' &&
      (
        inputs.held_recovery_original_run_id == '' ||
        needs.resolve-prepared-images.result != 'success' ||
        needs.resolve-prepared-images.outputs.prepared_run_id == '' ||
        needs.resolve-prepared-images.outputs.prepared_run_id != inputs.held_recovery_prepared_run_id ||
        needs.resolve-prepared-images.outputs.prepared_run_attempt == '' ||
        needs.resolve-prepared-images.outputs.prepared_artifact_digest == '' ||
        needs.resolve-prepared-images.outputs.prepared_source_sha != (inputs.source_sha || github.sha) ||
        needs.resolve-prepared-images.outputs.engine_revision != needs.resolve-images.outputs.engine_revision ||
        needs.resolve-prepared-images.outputs.worker_image != needs.resolve-images.outputs.worker_image ||
        needs.resolve-prepared-images.outputs.worker_digest != needs.resolve-images.outputs.worker_digest ||
        needs.resolve-prepared-images.outputs.worker_rehearsal_harness_sha == '' ||
        needs.resolve-prepared-images.outputs.worker_rehearsal_harness_revision != (inputs.source_sha || github.sha)
      )
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/verify-webhook-worker-image.yml
    with:
      product_source_sha: ${{ inputs.source_sha || github.sha }}
      engine_revision: ${{ needs.resolve-images.outputs.engine_revision }}
      worker_image: ${{ needs.resolve-images.outputs.worker_image }}@${{ needs.resolve-images.outputs.worker_digest }}

  deploy:
    name: Deploy Azure Container Apps
    needs:
      [
        resolve-images,
        resolve-prepared-images,
        verify-built-worker-image,
        validate-manual-production-dispatch,
        preflight-compatible-baseline,
      ]
    if: >-
      !cancelled() &&
      (vars.AZURE_RESOURCE_GROUP != '') &&
      ((vars.AZURE_APP_CONTAINER_APP_NAME != '') || (vars.AZURE_SCANNER_CONTAINER_APP_NAME != '')) &&
      needs.resolve-images.result == 'success' &&
      needs.validate-manual-production-dispatch.result == 'success' &&
      needs.preflight-compatible-baseline.result == 'success' &&
      (
        needs.verify-built-worker-image.result == 'success' ||
        (
          inputs.held_recovery_original_run_id != '' &&
          needs.resolve-prepared-images.result == 'success' &&
          needs.resolve-prepared-images.outputs.prepared_run_id != '' &&
          needs.resolve-prepared-images.outputs.prepared_run_id == inputs.held_recovery_prepared_run_id &&
          needs.resolve-prepared-images.outputs.prepared_run_attempt != '' &&
          needs.resolve-prepared-images.outputs.prepared_artifact_digest != '' &&
          needs.resolve-prepared-images.outputs.prepared_source_sha == (inputs.source_sha || github.sha) &&
          needs.resolve-prepared-images.outputs.engine_revision == needs.resolve-images.outputs.engine_revision &&
          needs.resolve-prepared-images.outputs.worker_image == needs.resolve-images.outputs.worker_image &&
          needs.resolve-prepared-images.outputs.worker_digest == needs.resolve-images.outputs.worker_digest &&
          needs.resolve-prepared-images.outputs.worker_rehearsal_harness_sha != '' &&
          needs.resolve-prepared-images.outputs.worker_rehearsal_harness_revision == (inputs.source_sha || github.sha) &&
          needs.verify-built-worker-image.result == 'skipped'
        )
      )
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-azure-runtime.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      webhook_claims_cutover: ${{ needs.preflight-compatible-baseline.outputs.webhook_claims_cutover == 'true' }}
      held_recovery: ${{ needs.preflight-compatible-baseline.outputs.held_recovery_verified == 'true' }}
      held_recovery_original_run_id: ${{ needs.preflight-compatible-baseline.outputs.held_recovery_original_run_id }}
      held_recovery_original_owner: ${{ needs.preflight-compatible-baseline.outputs.held_recovery_original_owner }}
      held_recovery_original_source_sha: ${{ needs.preflight-compatible-baseline.outputs.held_recovery_original_source_sha }}
      engine_revision: ${{ needs.resolve-images.outputs.engine_revision }}
      web_image: ${{ needs.resolve-images.outputs.web_image }}
      web_digest: ${{ needs.resolve-images.outputs.web_digest }}
      worker_image: ${{ needs.resolve-images.outputs.worker_image }}
      worker_digest: ${{ needs.resolve-images.outputs.worker_digest }}
      egress_proxy_image: ${{ needs.resolve-images.outputs.egress_proxy_image }}
      egress_proxy_digest: ${{ needs.resolve-images.outputs.egress_proxy_digest }}
    secrets: inherit

  verify-held-recovery-outcome:
    name: Require completed held recovery deployment
    needs: deploy
    if: ${{ !cancelled() && inputs.held_recovery_original_run_id != '' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Reject skipped or failed recovery deployment
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          test "$DEPLOY_RESULT" = success || {
            echo '::error::Held recovery did not complete runtime deployment; production recovery is unverified.'
            exit 1
          }
