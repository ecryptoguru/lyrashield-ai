name: Deploy to Azure

on:
  workflow_call:
    inputs:
      source_sha:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Current main SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type deploy:<source_sha> to confirm emergency production deployment
        required: true
        type: string

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_SHA: ${{ inputs.source_sha || github.sha }}
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository }}/lyrashield-web
  WORKER_IMAGE: ghcr.io/${{ github.repository }}/lyrashield-worker
  EGRESS_PROXY_IMAGE: ghcr.io/${{ github.repository }}/lyrashield-egress-proxy
  ENGINE_REVISION: 9832d1b35c89fa2d0599efa68e52afbedf5b712b
  MARKETING_URL: ${{ vars.LYRASHIELD_MARKETING_URL || 'https://lyrashieldai.com' }}
  APP_URL: ${{ vars.LYRASHIELD_APP_URL || 'https://app.lyrashieldai.com' }}
  SCANNER_URL: ${{ vars.LYRASHIELD_SCANNER_URL || 'https://scanner.lyrashieldai.com' }}
  REQUIRE_EMAIL_VERIFICATION: ${{ vars.LYRASHIELD_REQUIRE_EMAIL_VERIFICATION || '0' }}
  PLATFORM_ADMIN_EMAILS: ecryptoguru@gmail.com,ankit@lyrashieldai.com
  # Cloud modes are protected azure-production variables. Local purchases stay
  # hard-off independently of Cloud launch state.
  POLAR_BILLING_ADMISSION: ${{ vars.POLAR_BILLING_ADMISSION || 'off' }}
  POLAR_LOCAL_BILLING_ADMISSION: "off"
  RAZORPAY_BILLING_ADMISSION: ${{ vars.RAZORPAY_BILLING_ADMISSION || 'off' }}
  RAZORPAY_LOCAL_BILLING_ADMISSION: "off"
  BILLING_CANARY_WORKSPACE_IDS: ${{ vars.BILLING_CANARY_WORKSPACE_IDS || '' }}
  CLOUDFLARE_ORIGIN_MTLS: ${{ vars.CLOUDFLARE_ORIGIN_MTLS || 'off' }}
  CLOUDFLARE_AOP_CERT_SHA256: ${{ vars.CLOUDFLARE_AOP_CERT_SHA256 || '' }}

jobs:
  validate-manual-production-dispatch:
    name: Validate emergency production dispatch
    runs-on: ubuntu-24.04
    steps:
      - name: Require the current main SHA and exact confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$CONFIRMATION" != "deploy:${SOURCE_SHA}" ]; then
            echo "::error::Manual production deployment requires the current main SHA and deploy:<source_sha>."
            exit 1
          fi
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$SOURCE_SHA" != "$latest_main" ]; then
            echo "::error::Manual production deployment may only target current main."
            exit 1
          fi

  build:
    needs: validate-manual-production-dispatch
    name: Build and push container images
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      web_image: ${{ steps.meta.outputs.web_image }}
      worker_image: ${{ steps.meta.outputs.worker_image }}
      egress_proxy_image: ${{ steps.meta.outputs.egress_proxy_image }}
      web_digest: ${{ steps.build-web.outputs.digest }}
      worker_digest: ${{ steps.build-worker.outputs.digest }}
      egress_proxy_digest: ${{ steps.build-egress-proxy.outputs.digest }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      # A production worker is reproducible only when its engine input is immutable.
      # Upgrade this pin deliberately after the cross-repository contract gate passes.
      - name: Checkout engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/lyrashield-engine
          ref: ${{ env.ENGINE_REVISION }}
          fetch-depth: 0
          path: lyrashield-engine
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Verify engine revision provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/verify-engine-revision.sh \
            lyrashield-engine "${{ env.ENGINE_REVISION }}" \
            "${{ github.repository_owner }}/lyrashield-engine"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify build environment isolation
        run: |
          if [ -n "${POLAR_ENVIRONMENT:-}" ]; then
            echo "::error::Provider runtime configuration must not leak into build-time contract tests."
            exit 1
          fi

      - name: Verify engine-worker contract
        run: bash .github/scripts/verify-engine-worker-contract.sh lyrashield-engine "$GITHUB_WORKSPACE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          {
            echo "web_image=${{ env.WEB_IMAGE }}:${{ env.DEPLOY_SHA }}"
            echo "worker_image=${{ env.WORKER_IMAGE }}:${{ env.DEPLOY_SHA }}"
            echo "egress_proxy_image=${{ env.EGRESS_PROXY_IMAGE }}:${{ env.DEPLOY_SHA }}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        id: build-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.DEPLOY_SHA }},${{ env.WEB_IMAGE }}:latest
          build-args: |
            BUILD_APP_URL=${{ env.APP_URL }}
            BUILD_PUBLIC_APP_URL=${{ env.SCANNER_URL }}
            BUILD_PUBLIC_MARKETING_URL=${{ env.MARKETING_URL }}
            BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
            BUILD_LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=${{ env.REQUIRE_EMAIL_VERIFICATION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        id: build-worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: worker
          push: true
          # Worker candidates stay immutable. Deployment consumes the verified digest;
          # no mutable :latest tag may point at an image before policy verification.
          tags: ${{ env.WORKER_IMAGE }}:${{ env.DEPLOY_SHA }}
          build-contexts: |
            engine=lyrashield-engine
          build-args: |
            BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
            io.lyrashield.engine.revision=${{ env.ENGINE_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push egress-proxy image
        id: build-egress-proxy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: egress-proxy
          push: true
          tags: ${{ env.EGRESS_PROXY_IMAGE }}:${{ env.DEPLOY_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed worker image
        run: |
          worker_ref="${{ env.WORKER_IMAGE }}@${{ steps.build-worker.outputs.digest }}"
          docker pull "$worker_ref"
          bash apps/worker/scripts/verify-worker-image.sh \
            "$worker_ref" "${{ env.DEPLOY_SHA }}" "${{ env.ENGINE_REVISION }}"

      - name: Worker image digest
        if: steps.build-worker.outcome == 'success'
        run: |
          echo "Pushed worker image: ${{ env.WORKER_IMAGE }}:${{ env.DEPLOY_SHA }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned digest: ${{ steps.build-worker.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      # Validates the exact immutable values the worker VM must inject into its
      # runtime environment (LYRASHIELD_PRODUCT_REVISION / _WORKER_IMAGE_DIGEST /
      # _ENGINE_REVISION) and records them for the guarded promotion below.
      - name: Validate worker provenance record
        if: steps.build-worker.outcome == 'success'
        shell: bash
        run: |
          is_40_hex() {
            value=$1
            case "$value" in
              ''|*[!0-9a-fA-F]*) return 1 ;;
            esac
            [ "${#value}" -eq 40 ]
          }
          is_64_hex() {
            value=$1
            case "$value" in
              ''|*[!0-9a-fA-F]*) return 1 ;;
            esac
            [ "${#value}" -eq 64 ]
          }
          digest="${{ steps.build-worker.outputs.digest }}"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::Worker digest must be sha256:<64 hex>"; exit 1 ;;
          esac
          is_64_hex "${digest#sha256:}" || { echo "::error::Worker digest must be sha256:<64 hex>"; exit 1; }
          is_40_hex "${{ env.DEPLOY_SHA }}" || { echo "::error::Product revision must be a 40-character SHA"; exit 1; }
          is_40_hex "${{ env.ENGINE_REVISION }}" || { echo "::error::Engine revision must be a 40-character SHA"; exit 1; }
          {
            echo "Worker provenance record (worker VM runtime values):"
            echo "- LYRASHIELD_PRODUCT_REVISION=${{ env.DEPLOY_SHA }}"
            echo "- LYRASHIELD_WORKER_IMAGE_DIGEST=$digest"
            echo "- LYRASHIELD_ENGINE_REVISION=${{ env.ENGINE_REVISION }}"
            echo "The deploy job promotes this digest only after Container App smoke checks pass."
          } >> "$GITHUB_STEP_SUMMARY"

  # Every merge to main pushes new SHA-tagged images; web also re-points :latest, while workers
  # remain immutable and deploy by verified digest. Multi-arch buildx pushes leave untagged manifests
  # per build (per-platform layers under the tagged manifest list), so versions accumulate
  # faster than commits. Cleanup runs only after the deploy job has promoted and verified
  # the worker digest. This avoids registry eventual-consistency races deleting a candidate
  # before the VM has pulled it.
  #
  # Uses dataaxiom/ghcr-cleanup-action rather than a raw "delete this version ID" call: it
  # resolves multi-arch manifest lists first and will not delete an untagged manifest that a
  # kept tagged version still references, which a naive per-ID delete could do and break a
  # pull of an image that still LOOKS tagged and valid.
  cleanup-old-images:
    name: Clean up superseded container images
    needs: [build, deploy]
    if: needs.build.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Delete untagged and superseded web/scanner image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: lyrashield-ai/lyrashield-web
          # Keep the most recent 10 tagged versions (the deployed one plus a safety margin
          # for rollback) and remove every dangling untagged manifest.
          keep-n-tagged: 10
          delete-untagged: true
          # Live as of 2026-07-30. Founder-approved after reviewing a real dry-run pass
          # (run 30496418272): it reported "no tagged images found to delete" and "no
          # untagged images found" for both packages — with only ~10 accumulated versions
          # against keep-n-tagged: 10, nothing had aged out yet, so the first live run is a
          # verified no-op, not a leap of faith. See docs/deployment/PRODUCTION_DEPLOYMENT.md
          # "Known production blockers" #4 for the full sign-off record.
          dry-run: false

      - name: Delete untagged and superseded worker image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: lyrashield-ai/lyrashield-worker
          # Worker images are pinned by digest on the worker VM, and the approved digest may
          # lag behind main deploys. Keep a much longer tail so a pinned digest is not garbage
          # collected while still in use.
          keep-n-tagged: 100
          delete-untagged: true
          dry-run: false

      - name: Delete superseded egress-proxy image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: lyrashield-ai/lyrashield-egress-proxy
          keep-n-tagged: 20
          delete-untagged: true
          dry-run: false

  deploy:
    name: Deploy Azure Container Apps
    needs: build
    runs-on: ubuntu-24.04
    # This budget covers migrations, parallel bounded candidate health checks,
    # production smoke, and bounded traffic recovery. Individual Azure
    # control-plane calls still have their own tighter limits below.
    timeout-minutes: 90
    permissions:
      contents: read
    environment:
      name: azure-production
      url: ${{ env.APP_URL }}
    if: >
      (vars.AZURE_RESOURCE_GROUP != '') &&
      ((vars.AZURE_APP_CONTAINER_APP_NAME != '') || (vars.AZURE_SCANNER_CONTAINER_APP_NAME != ''))
    steps:
      - name: Verify billing provider deployment configuration
        if: vars.AZURE_APP_CONTAINER_APP_NAME != ''
        env:
          POLAR_ENVIRONMENT: ${{ vars.POLAR_ENVIRONMENT }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          POLAR_ORG_ID: ${{ vars.POLAR_ORG_ID }}
          POLAR_PRODUCT_IDS: ${{ vars.POLAR_PRODUCT_IDS }}
          POLAR_LOCAL_PRODUCT_IDS: ${{ vars.POLAR_LOCAL_PRODUCT_IDS }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_PLAN_IDS: ${{ vars.RAZORPAY_PLAN_IDS }}
          POLAR_BILLING_ADMISSION: ${{ env.POLAR_BILLING_ADMISSION }}
          RAZORPAY_BILLING_ADMISSION: ${{ env.RAZORPAY_BILLING_ADMISSION }}
          BILLING_CANARY_WORKSPACE_IDS: ${{ env.BILLING_CANARY_WORKSPACE_IDS }}
          CLOUDFLARE_ORIGIN_MTLS: ${{ env.CLOUDFLARE_ORIGIN_MTLS }}
          CLOUDFLARE_AOP_CERT_SHA256: ${{ env.CLOUDFLARE_AOP_CERT_SHA256 }}
        run: |
          if [ "${POLAR_ENVIRONMENT}" != "production" ]; then
            echo "::error::azure-production requires POLAR_ENVIRONMENT=production; Sandbox belongs only in isolated staging."
            exit 1
          fi
          required=(
            POLAR_ACCESS_TOKEN POLAR_WEBHOOK_SECRET POLAR_ORG_ID
            POLAR_PRODUCT_IDS POLAR_LOCAL_PRODUCT_IDS
            RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET
            RAZORPAY_PLAN_IDS
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for declarative billing configuration. Purchase admission remains off, but provider webhook and reconciliation configuration must be complete."
              exit 1
            fi
          done
          case "$POLAR_ACCESS_TOKEN" in
            polar_oat_?*) ;;
            *)
              echo "::error::azure-production requires a Polar Organization Access Token; replace the protected POLAR_ACCESS_TOKEN secret."
              exit 1
              ;;
          esac
          case "$RAZORPAY_KEY_ID" in
            rzp_live_*) ;;
            *)
              echo "::error::azure-production requires a Razorpay live key ID; Test Mode belongs only in isolated staging."
              exit 1
              ;;
          esac
          # JavaScript template literal below is not shell expansion.
          # shellcheck disable=SC2016
          node -e '
            for (const name of ["POLAR_PRODUCT_IDS", "POLAR_LOCAL_PRODUCT_IDS", "RAZORPAY_PLAN_IDS"]) {
              const value = JSON.parse(process.env[name]);
              if (!value || Array.isArray(value) || typeof value !== "object" || Object.keys(value).length === 0) {
                throw new Error(`${name} must be a non-empty JSON object`);
              }
            }
            const requiredCatalogKeys = {
              POLAR_PRODUCT_IDS: ["starter_monthly", "starter_annual", "pro_monthly", "pro_annual", "launch_assurance_monthly", "launch_assurance_annual", "pack_100", "pack_250", "pack_500"],
              // Razorpay packs are quote-signed payment links, not plans. Their
              // prices and identity come from MINUTE_PACK_MAP and webhook notes.
              RAZORPAY_PLAN_IDS: ["starter_monthly", "starter_annual", "pro_monthly", "pro_annual", "launch_assurance_monthly", "launch_assurance_annual"],
            };
            for (const [name, keys] of Object.entries(requiredCatalogKeys)) {
              const value = JSON.parse(process.env[name]);
              for (const key of keys) if (!(key in value)) throw new Error(`${name} is missing ${key}`);
            }
            const modes = [process.env.POLAR_BILLING_ADMISSION, process.env.RAZORPAY_BILLING_ADMISSION];
            if (!modes.every((mode) => ["off", "canary", "public"].includes(mode))) throw new Error("Cloud billing mode is invalid");
            if (modes[0] !== modes[1]) throw new Error("Polar and Razorpay Cloud admissions must move jointly");
            const allowlist = process.env.BILLING_CANARY_WORKSPACE_IDS.split(",").filter(Boolean);
            if (modes[0] === "canary" && (!allowlist.length || !allowlist.every((id) => /^[A-Za-z0-9_-]{1,191}$/.test(id)))) {
              throw new Error("Canary admission requires valid workspace IDs");
            }
            if (modes[0] !== "canary" && allowlist.length) throw new Error("Only canary admission may set a workspace allowlist");
            if (process.env.CLOUDFLARE_ORIGIN_MTLS === "required" && !/^[a-fA-F0-9]{64}$/.test(process.env.CLOUDFLARE_AOP_CERT_SHA256)) {
              throw new Error("Required Cloudflare origin mTLS needs a certificate fingerprint");
            }
          '
          echo "Billing provider and protected admission configuration is valid."

      - name: Log in to Azure
        uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Container Apps extension
        run: az extension add --name containerapp --yes --only-show-errors

      - name: Prepare private registry and zero-downtime rollout
        id: rollout
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME || 'lyrashieldprodsecrets' }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          AZURE_SCANNER_CONTAINER_APP_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
          AZURE_EGRESS_PROXY_CONTAINER_APP_NAME: ${{ vars.AZURE_EGRESS_PROXY_CONTAINER_APP_NAME }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          WEB_DIGEST: ${{ needs.build.outputs.web_digest }}
          EGRESS_PROXY_IMAGE: ${{ needs.build.outputs.egress_proxy_image }}
          EGRESS_PROXY_DIGEST: ${{ needs.build.outputs.egress_proxy_digest }}
        run: |
          GHCR_TOKEN=$(az keyvault secret show \
            --vault-name "$AZURE_KEY_VAULT_NAME" \
            --name ghcr-token \
            --query value \
            --output tsv)
          if [ -z "$GHCR_TOKEN" ]; then
            echo "::error::Key Vault secret ghcr-token is empty. Refusing to create revisions that cannot pull their images."
            exit 1
          fi
          echo "::add-mask::$GHCR_TOKEN"

          verify_manifest() {
            local image="$1"
            local digest="$2"
            local repository="${image#ghcr.io/}"
            repository="${repository%:*}"
            local registry_token
            registry_token=$(curl --fail --silent --show-error \
              --user "$GHCR_USERNAME:$GHCR_TOKEN" \
              --get \
              --data-urlencode 'service=ghcr.io' \
              --data-urlencode "scope=repository:${repository}:pull" \
              https://ghcr.io/token | jq -r '.token // empty')
            if [ -z "$registry_token" ]; then
              echo "::error::GHCR did not issue a pull token for ${repository}."
              exit 1
            fi
            curl --fail --silent --show-error --output /dev/null \
              --header "Authorization: Bearer ${registry_token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repository}/manifests/${digest}"
          }

          prepare_container_app() {
            local output_name="$1"
            local container_app="$2"
            if [ -z "$container_app" ]; then
              echo "${output_name}_previous=" >> "$GITHUB_OUTPUT"
              return 0
            fi

            az containerapp revision set-mode \
              --name "$container_app" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --mode multiple \
              --output none

            local previous_revision
            previous_revision=$(az containerapp ingress traffic show \
              --name "$container_app" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?weight == \`100\`] | [0].revisionName" \
              --output tsv)
            if [ -z "$previous_revision" ] || [ "$previous_revision" = "null" ]; then
              echo "::error::${container_app} must have exactly one 100% traffic revision to preserve."
              exit 1
            fi

            az containerapp registry set \
              --name "$container_app" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --server ghcr.io \
              --username "$GHCR_USERNAME" \
              --password "$GHCR_TOKEN" \
              --output none
            echo "${output_name}_previous=${previous_revision}" >> "$GITHUB_OUTPUT"
          }

          verify_manifest "$WEB_IMAGE" "$WEB_DIGEST"
          verify_manifest "$EGRESS_PROXY_IMAGE" "$EGRESS_PROXY_DIGEST"
          prepare_container_app app "$AZURE_APP_CONTAINER_APP_NAME"
          prepare_container_app scanner "$AZURE_SCANNER_CONTAINER_APP_NAME"
          prepare_container_app egress "$AZURE_EGRESS_PROXY_CONTAINER_APP_NAME"
          unset GHCR_TOKEN

      # Schema first, then code. Migrations previously ran only in CI against a throwaway
      # database and never against production, so a release needing a schema change served
      # 500s until someone remembered to run this by hand. Ordering matters: new code must
      # never meet an old schema, which means migrations must be additive and
      # backward-compatible with the currently running image.
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout for migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_DIRECT_URL secret is not set — refusing to deploy code against an unmigrated schema."
            exit 1
          fi
          pnpm install --frozen-lockfile
          pnpm --filter @lyrashield/db exec prisma migrate deploy

      - name: Verify shared rate-limiting credentials
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "${UPSTASH_REDIS_REST_URL}" ] || [ -z "${UPSTASH_REDIS_REST_TOKEN}" ]; then
            echo "::error::UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN are not set. Rate limiting would fall back to per-instance memory, so the effective limit becomes (limit x replica count) and scaling out weakens the control. These are the HTTPS REST credentials and are NOT interchangeable with REDIS_URL."
            exit 1
          fi
          echo "Shared rate-limiting credentials present."

      - name: Verify BullMQ Redis credential
        if: vars.AZURE_APP_CONTAINER_APP_NAME != ''
        env:
          BULLMQ_REDIS_URL: ${{ secrets.BULLMQ_REDIS_URL }}
        run: |
          if [ -z "${BULLMQ_REDIS_URL}" ]; then
            echo "::error::BULLMQ_REDIS_URL is not set. The app cannot enqueue production scans without the BullMQ TLS endpoint. This is separate from the Upstash HTTPS REST credentials used for rate limiting."
            exit 1
          fi
          node -e '
            const value = process.env.BULLMQ_REDIS_URL;
            let url;
            try { url = new URL(value); } catch { process.exit(1); }
            if (url.protocol !== "rediss:" || !url.hostname || !url.username || !url.password) process.exit(1);
          ' || {
            echo "::error::BULLMQ_REDIS_URL must be a valid authenticated rediss:// URL in production."
            exit 1
          }
          echo "BullMQ TLS Redis credential present."

      - name: Verify evidence envelope key
        id: verify-evidence-kek
        env:
          LYRASHIELD_EVIDENCE_KEK: ${{ secrets.LYRASHIELD_EVIDENCE_KEK }}
          LYRASHIELD_EVIDENCE_KEK_ACTIVE_REF: ${{ vars.LYRASHIELD_EVIDENCE_KEK_ACTIVE_REF }}
          LYRASHIELD_EVIDENCE_KEK_KEYRING: ${{ secrets.LYRASHIELD_EVIDENCE_KEK_KEYRING }}
        run: |
          node packages/evidence-storage/scripts/validate-kek-config.mjs
          echo "version=${LYRASHIELD_EVIDENCE_KEK_ACTIVE_REF##*/}" >> "$GITHUB_OUTPUT"
          echo "Evidence envelope key configuration present and valid."

      - name: Sync evidence envelope key to app Container App
        id: sync-evidence-kek
        env:
          LYRASHIELD_EVIDENCE_KEK: ${{ secrets.LYRASHIELD_EVIDENCE_KEK }}
          LYRASHIELD_EVIDENCE_KEK_ACTIVE_REF: ${{ vars.LYRASHIELD_EVIDENCE_KEK_ACTIVE_REF }}
          LYRASHIELD_EVIDENCE_KEK_KEYRING: ${{ secrets.LYRASHIELD_EVIDENCE_KEK_KEYRING }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
        run: |
          # Only the app Container App uploads evidence (control-evidence
          # artifacts); the scanner app does not and the worker VM receives the
          # key via Key Vault (ops/worker/refresh-secrets.sh).
          active_name="ev-kek-${{ steps.verify-evidence-kek.outputs.version }}"
          keyring_digest=$(printf '%s' "$LYRASHIELD_EVIDENCE_KEK_KEYRING" | sha256sum | cut -c1-12)
          keyring_name="ev-ring-${keyring_digest}"
          if [ "${#active_name}" -gt 20 ] || [ "${#keyring_name}" -gt 20 ]; then
            echo "::error::Derived evidence secret name exceeds the Container Apps 20-character limit."
            exit 1
          fi
          echo "active_name=${active_name}" >> "$GITHUB_OUTPUT"
          echo "keyring_name=${keyring_name}" >> "$GITHUB_OUTPUT"
          if [ -n "$AZURE_APP_CONTAINER_APP_NAME" ]; then
            existing_secrets=$(timeout --foreground 180s az containerapp secret list \
              --only-show-errors \
              --name "$AZURE_APP_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query '[].name' --output tsv)
            active_exists=$(printf '%s\n' "$existing_secrets" | grep -Fxc "$active_name" || true)
            keyring_exists=$(printf '%s\n' "$existing_secrets" | grep -Fxc "$keyring_name" || true)
            if [ "$active_exists" = "1" ]; then
              echo "Immutable active evidence secret already exists; preserving it."
            elif [ "$active_exists" = "0" ]; then
              timeout --foreground 180s az containerapp secret set \
                --only-show-errors \
                --name "$AZURE_APP_CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --secrets "${active_name}=${LYRASHIELD_EVIDENCE_KEK}" || {
                  echo "::error::Failed to create immutable active evidence key for ${AZURE_APP_CONTAINER_APP_NAME}."
                  exit 1
                }
            else
              echo "::error::Active evidence secret inventory is ambiguous."
              exit 1
            fi
            if [ "$keyring_exists" = "1" ]; then
              echo "Immutable evidence keyring secret already exists; preserving it."
            elif [ "$keyring_exists" = "0" ]; then
              timeout --foreground 180s az containerapp secret set \
                --only-show-errors \
                --name "$AZURE_APP_CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --secrets "${keyring_name}=${LYRASHIELD_EVIDENCE_KEK_KEYRING}" || {
                  echo "::error::Failed to create immutable evidence keyring for ${AZURE_APP_CONTAINER_APP_NAME}."
                  exit 1
                }
            else
              echo "::error::Evidence keyring secret inventory is ambiguous."
              exit 1
            fi
          fi

      - name: Sync evidence storage credentials to app Container App
        env:
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME || 'lyrashieldprodsecrets' }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
        run: |
          if [ -z "$AZURE_APP_CONTAINER_APP_NAME" ]; then
            exit 0
          fi

          vault_base="https://${AZURE_KEY_VAULT_NAME}.vault.azure.net/secrets"

          timeout --foreground 180s az containerapp secret set \
            --only-show-errors \
            --name "$AZURE_APP_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets \
              "evidence-s3-endpoint=keyvaultref:${vault_base}/worker-r2-endpoint,identityref:system" \
              "evidence-s3-bucket=keyvaultref:${vault_base}/worker-r2-bucket,identityref:system" \
              "evidence-s3-access=keyvaultref:${vault_base}/worker-r2-access-key,identityref:system" \
              "evidence-s3-secret=keyvaultref:${vault_base}/worker-r2-secret-key,identityref:system" \
            --output none
          echo "Evidence storage Key Vault references synced to the app Container App."

      # secretref: below requires the Container App to already define secrets named
      # upstash-redis-rest-url / upstash-redis-rest-token. Nothing provisioned those, so the
      # secretref would fail az containerapp update outright on a fresh app. This step
      # (re)creates them from the same GitHub secrets checked above, on every deploy, so
      # rotating the GitHub secret also rotates the Container App's copy.
      - name: Sync Upstash secrets to Container Apps
        id: sync-upstash
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          AZURE_SCANNER_CONTAINER_APP_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
        run: |
          sync_upstash_secrets() {
            local container_app="$1"
            if ! timeout --foreground 180s az containerapp secret set \
              --only-show-errors \
              --name "$container_app" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets "upstash-redis-rest-url=${UPSTASH_REDIS_REST_URL}" "upstash-redis-rest-token=${UPSTASH_REDIS_REST_TOKEN}"; then
              echo "::error::Timed out or failed while syncing Upstash secrets to ${container_app}."
              exit 1
            fi
          }
          if [ -n "$AZURE_APP_CONTAINER_APP_NAME" ]; then
            sync_upstash_secrets "$AZURE_APP_CONTAINER_APP_NAME"
          fi
          if [ -n "$AZURE_SCANNER_CONTAINER_APP_NAME" ]; then
            sync_upstash_secrets "$AZURE_SCANNER_CONTAINER_APP_NAME"
          fi

      - name: Sync BullMQ Redis secret to Container Apps
        env:
          BULLMQ_REDIS_URL: ${{ secrets.BULLMQ_REDIS_URL }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          AZURE_SCANNER_CONTAINER_APP_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
        run: |
          sync_bullmq_secret() {
            local container_app="$1"
            timeout --foreground 180s az containerapp secret set \
              --only-show-errors \
              --name "$container_app" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets "bullmq-redis-url=${BULLMQ_REDIS_URL}"
          }
          if [ -n "$AZURE_APP_CONTAINER_APP_NAME" ]; then
            sync_bullmq_secret "$AZURE_APP_CONTAINER_APP_NAME"
          fi
          if [ -n "$AZURE_SCANNER_CONTAINER_APP_NAME" ]; then
            sync_bullmq_secret "$AZURE_SCANNER_CONTAINER_APP_NAME"
          fi

      - name: Sync billing provider secrets to app Container App
        if: vars.AZURE_APP_CONTAINER_APP_NAME != ''
        env:
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
        run: |
          if ! timeout --foreground 180s az containerapp secret set \
            --only-show-errors \
            --name "$AZURE_APP_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets \
              "polar-access-token=${POLAR_ACCESS_TOKEN}" \
              "polar-webhook-secret=${POLAR_WEBHOOK_SECRET}" \
              "razorpay-key-id=${RAZORPAY_KEY_ID}" \
              "razorpay-key-secret=${RAZORPAY_KEY_SECRET}" \
              "razorpay-webhook-secret=${RAZORPAY_WEBHOOK_SECRET}"; then
            echo "::error::Failed to sync billing provider secrets to ${AZURE_APP_CONTAINER_APP_NAME}."
            exit 1
          fi

      - name: Verify email verification credentials
        env:
          EMAIL_VERIFICATION_REQUIRED: ${{ env.REQUIRE_EMAIL_VERIFICATION }}
          POLAR_ENVIRONMENT: ${{ vars.POLAR_ENVIRONMENT }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          AZURE_SCANNER_CONTAINER_APP_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
        run: |
          if [ "$EMAIL_VERIFICATION_REQUIRED" != "1" ]; then
            exit 0
          fi
          verify_brevo_secret() {
            local container_app="$1"
            local secret_name
            secret_name=$(az containerapp secret list \
              --name "$container_app" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?name == 'brevo-api-key'].name | [0]" \
              --output tsv)
            if [ "$secret_name" != "brevo-api-key" ]; then
              echo "::error::${container_app} requires the pre-provisioned brevo-api-key Container App secret while email verification is enabled."
              exit 1
            fi
          }
          if [ -n "$AZURE_APP_CONTAINER_APP_NAME" ]; then
            verify_brevo_secret "$AZURE_APP_CONTAINER_APP_NAME"
          fi
          if [ -n "$AZURE_SCANNER_CONTAINER_APP_NAME" ]; then
            verify_brevo_secret "$AZURE_SCANNER_CONTAINER_APP_NAME"
          fi

      # Garbage-collect GitHub App secrets so rotation deletes what is no longer needed.
      # A runbook lives in docs/deployment/PRODUCTION_DEPLOYMENT.md "Known production
      # blockers" #6 and lays out app creation, credential inventory, webhook wiring, and
      # secret naming. Every deploy reconciles this list with Container App secrets:
      # existing secrets keep their type (PEM private key survives intact), and a secret
      # that vanishes from the set below is removed so stale material does not linger.
      # This block is independent of whether the app still needs rotation.
      - name: Verify GitHub App credentials
        env:
          GITHUB_APP_ID: ${{ secrets.LYRASHIELD_GITHUB_APP_ID }}
          GITHUB_APP_SLUG: ${{ secrets.LYRASHIELD_GITHUB_APP_SLUG }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.LYRASHIELD_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.LYRASHIELD_GITHUB_APP_WEBHOOK_SECRET }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.LYRASHIELD_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.LYRASHIELD_GITHUB_APP_CLIENT_SECRET }}
        run: |
          if [ -z "${GITHUB_APP_ID}" ] || [ -z "${GITHUB_APP_SLUG}" ] || [ -z "${GITHUB_APP_PRIVATE_KEY}" ] || [ -z "${GITHUB_WEBHOOK_SECRET}" ]; then
            echo "::warning::GITHUB_APP_ID / GITHUB_APP_SLUG / GITHUB_APP_PRIVATE_KEY / GITHUB_WEBHOOK_SECRET are not all set. GitHub connect path will 500 CONFIG_ERROR until they are. F1's four-way onboarding (URL/API/Skip) keeps signups alive in the meantime — see PRODUCTION_DEPLOYMENT.md #6 for runbook."
          else
            if ! echo "${GITHUB_APP_PRIVATE_KEY}" | grep -q "BEGIN"; then
              echo "::error::GITHUB_APP_PRIVATE_KEY must be a PEM-formatted key starting with -----BEGIN."
              exit 1
            fi
            echo "GitHub App credentials present."
          fi
          # OAuth client credentials are a separate, independently-optional group:
          # they are only needed to ownership-verify a FIRST-TIME install. Absent
          # them the callback fails closed (github=verification_required) while
          # already-connected workspaces keep working, so this warns and never
          # blocks a deploy.
          if [ -z "${GITHUB_APP_CLIENT_ID}" ] || [ -z "${GITHUB_APP_CLIENT_SECRET}" ]; then
            echo "::warning::GITHUB_APP_CLIENT_ID / GITHUB_APP_CLIENT_SECRET are not set. No new workspace can complete a GitHub install — the callback cannot verify installation ownership and fails closed. See PRODUCTION_DEPLOYMENT.md #6."
          else
            echo "GitHub App OAuth credentials present."
          fi

      - name: Sync GitHub App secrets to Container Apps
        id: sync-github-app
        env:
          GITHUB_APP_ID: ${{ secrets.LYRASHIELD_GITHUB_APP_ID }}
          GITHUB_APP_SLUG: ${{ secrets.LYRASHIELD_GITHUB_APP_SLUG }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.LYRASHIELD_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.LYRASHIELD_GITHUB_APP_WEBHOOK_SECRET }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.LYRASHIELD_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.LYRASHIELD_GITHUB_APP_CLIENT_SECRET }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          AZURE_SCANNER_CONTAINER_APP_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
        run: |
          if [ -z "${GITHUB_APP_ID}" ] || [ -z "${GITHUB_APP_SLUG}" ] || [ -z "${GITHUB_APP_PRIVATE_KEY}" ] || [ -z "${GITHUB_WEBHOOK_SECRET}" ]; then
            echo "Skipping GitHub App secret sync — not all secrets set (see verify step above)."
            exit 0
          fi
          # Appended only when both OAuth values are present, so a deploy made
          # before they are provisioned syncs exactly the same four secrets it
          # does today.
          OAUTH_SECRETS=()
          if [ -n "${GITHUB_APP_CLIENT_ID}" ] && [ -n "${GITHUB_APP_CLIENT_SECRET}" ]; then
            OAUTH_SECRETS=("github-app-client-id=${GITHUB_APP_CLIENT_ID}" "github-app-client-secret=${GITHUB_APP_CLIENT_SECRET}")
          fi
          sync_github_app_secrets() {
            local container_app="$1"
            if ! timeout --foreground 180s az containerapp secret set \
              --only-show-errors \
              --name "$container_app" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets "github-app-id=${GITHUB_APP_ID}" "github-app-slug=${GITHUB_APP_SLUG}" "github-app-private-key=${GITHUB_APP_PRIVATE_KEY}" "github-webhook-secret=${GITHUB_WEBHOOK_SECRET}" "${OAUTH_SECRETS[@]}"
            then
              echo "::error::Timed out or failed while syncing GitHub App secrets to ${container_app}."
              exit 1
            fi
          }
          if [ -n "$AZURE_APP_CONTAINER_APP_NAME" ]; then
            sync_github_app_secrets "$AZURE_APP_CONTAINER_APP_NAME"
          fi
          if [ -n "$AZURE_SCANNER_CONTAINER_APP_NAME" ]; then
            sync_github_app_secrets "$AZURE_SCANNER_CONTAINER_APP_NAME"
          fi

      - name: Deploy app Container App
        id: deploy-app
        if: vars.AZURE_APP_CONTAINER_APP_NAME != ''
        env:
          IMAGE: ${{ needs.build.outputs.web_image }}@${{ needs.build.outputs.web_digest }}
          LYRASHIELD_EVIDENCE_KEK_ACTIVE_REF: ${{ vars.LYRASHIELD_EVIDENCE_KEK_ACTIVE_REF }}
          LYRASHIELD_EVIDENCE_KEK_SECRET: ${{ steps.sync-evidence-kek.outputs.active_name }}
          LYRASHIELD_EVIDENCE_KEK_KEYRING_SECRET: ${{ steps.sync-evidence-kek.outputs.keyring_name }}
          POLAR_ENVIRONMENT: ${{ vars.POLAR_ENVIRONMENT }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.LYRASHIELD_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.LYRASHIELD_GITHUB_APP_CLIENT_SECRET }}
          EMAIL_VERIFICATION_REQUIRED: ${{ env.REQUIRE_EMAIL_VERIFICATION }}
          POLAR_ORG_ID: ${{ vars.POLAR_ORG_ID }}
          POLAR_PRODUCT_IDS: ${{ vars.POLAR_PRODUCT_IDS }}
          POLAR_LOCAL_PRODUCT_IDS: ${{ vars.POLAR_LOCAL_PRODUCT_IDS }}
          RAZORPAY_PLAN_IDS: ${{ vars.RAZORPAY_PLAN_IDS }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
        run: |
          # A secretref to a secret the Container App does not define is a hard
          # failure, so these are referenced only when the sync step above
          # actually provisioned them.
          OAUTH_ENV=()
          if [ -n "${GITHUB_APP_CLIENT_ID}" ] && [ -n "${GITHUB_APP_CLIENT_SECRET}" ]; then
            OAUTH_ENV=("GITHUB_APP_CLIENT_ID=secretref:github-app-client-id" "GITHUB_APP_CLIENT_SECRET=secretref:github-app-client-secret")
          fi
          EMAIL_ENV=()
          if [ "$EMAIL_VERIFICATION_REQUIRED" = "1" ]; then
            EMAIL_ENV=("BREVO_API_KEY=secretref:brevo-api-key")
          fi
          probe_dir=$(mktemp -d)
          trap 'rm -rf "$probe_dir"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=lyrashield-deploy-probe" \
            -keyout "$probe_dir/key.pem" -out "$probe_dir/cert.pem" >/dev/null 2>&1
          DEPLOY_PROBE_CERT_SHA256=$(openssl x509 -in "$probe_dir/cert.pem" -outform DER | sha256sum | cut -d' ' -f1)
          case "${{ env.CLOUDFLARE_ORIGIN_MTLS }}" in
            off) CLIENT_CERT_MODE=Ignore ;;
            required) CLIENT_CERT_MODE=Require ;;
            *) echo "::error::Invalid CLOUDFLARE_ORIGIN_MTLS mode."; exit 1 ;;
          esac
          CONTAINER_APP_RESOURCE_ID=$(az containerapp show \
            --name "$AZURE_APP_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query id \
            --output tsv)
          PREVIOUS_CLIENT_CERT_MODE=$(az rest \
            --method get \
            --url "${CONTAINER_APP_RESOURCE_ID}?api-version=2025-01-01" \
            --query 'properties.configuration.ingress.clientCertificateMode' \
            --output tsv)
          PREVIOUS_CLIENT_CERT_MODE=${PREVIOUS_CLIENT_CERT_MODE:-Ignore}
          echo "previous_client_cert_mode=${PREVIOUS_CLIENT_CERT_MODE}" >> "$GITHUB_OUTPUT"
          printf '%s' "$(jq -nc --arg mode "$CLIENT_CERT_MODE" '{properties: {configuration: {ingress: {clientCertificateMode: $mode}}}}')" | az rest \
            --method patch \
            --url "${CONTAINER_APP_RESOURCE_ID}?api-version=2025-01-01" \
            --headers 'Content-Type=application/json' \
            --body @- \
            --output none
          for attempt in $(seq 1 24); do
            APPLIED_CLIENT_CERT_MODE=$(az rest \
              --method get \
              --url "${CONTAINER_APP_RESOURCE_ID}?api-version=2025-01-01" \
              --query 'properties.configuration.ingress.clientCertificateMode' \
              --output tsv)
            if [ "${APPLIED_CLIENT_CERT_MODE,,}" = "${CLIENT_CERT_MODE,,}" ]; then
              break
            fi
            if [ "$attempt" = "24" ]; then
              echo "::error::Container Apps client certificate mode readback did not match the protected configuration."
              exit 1
            fi
            sleep 5
          done
          retry_app_update() {
            local attempt output
            for attempt in $(seq 1 24); do
              if output=$("$@" 2>&1); then
                printf '%s\n' "$output"
                return 0
              fi
              if ! grep -Fq 'ContainerAppOperationInProgress' <<< "$output"; then
                printf '%s\n' "$output" >&2
                return 1
              fi
              if [ "$attempt" = "24" ]; then
                printf '%s\n' "$output" >&2
                echo "::error::Container Apps operation did not release before the candidate update."
                return 1
              fi
              sleep 5
            done
          }
          retry_app_update az containerapp update \
            --name "$AZURE_APP_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${IMAGE}" \
            --set-env-vars \
              "NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}" \
              "NEXT_PUBLIC_MARKETING_URL=${{ env.MARKETING_URL }}" \
              "BETTER_AUTH_URL=${{ env.APP_URL }}" \
              "PLATFORM_ADMIN_EMAILS=${{ env.PLATFORM_ADMIN_EMAILS }}" \
              "LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=${{ env.REQUIRE_EMAIL_VERIFICATION }}" \
              "LYRASHIELD_DEPLOYMENT_ENVIRONMENT=production" \
              "LYRASHIELD_PRODUCT_REVISION=${{ env.DEPLOY_SHA }}" \
              "BILLING_STAGING_ADMISSION=off" \
              "BILLING_STAGING_ACCESS_TOKEN=" \
              "BILLING_STAGING_REGION=" \
              "CLOUDFLARE_ORIGIN_MTLS=${{ env.CLOUDFLARE_ORIGIN_MTLS }}" \
              "CLOUDFLARE_AOP_CERT_SHA256=${{ env.CLOUDFLARE_AOP_CERT_SHA256 }}" \
              "DEPLOY_PROBE_CERT_SHA256=${DEPLOY_PROBE_CERT_SHA256}" \
              "POLAR_ENVIRONMENT=${POLAR_ENVIRONMENT}" \
              "POLAR_ACCESS_TOKEN=secretref:polar-access-token" \
              "POLAR_ORG_ID=${POLAR_ORG_ID}" \
              "POLAR_WEBHOOK_SECRET=secretref:polar-webhook-secret" \
              "POLAR_PRODUCT_IDS=${POLAR_PRODUCT_IDS}" \
              "POLAR_LOCAL_PRODUCT_IDS=${POLAR_LOCAL_PRODUCT_IDS}" \
              "POLAR_BILLING_ADMISSION=${{ env.POLAR_BILLING_ADMISSION }}" \
              "POLAR_LOCAL_BILLING_ADMISSION=${{ env.POLAR_LOCAL_BILLING_ADMISSION }}" \
              "RAZORPAY_KEY_ID=secretref:razorpay-key-id" \
              "RAZORPAY_KEY_SECRET=secretref:razorpay-key-secret" \
              "RAZORPAY_WEBHOOK_SECRET=secretref:razorpay-webhook-secret" \
              "RAZORPAY_PLAN_IDS=${RAZORPAY_PLAN_IDS}" \
              "RAZORPAY_BILLING_ADMISSION=${{ env.RAZORPAY_BILLING_ADMISSION }}" \
              "RAZORPAY_LOCAL_BILLING_ADMISSION=${{ env.RAZORPAY_LOCAL_BILLING_ADMISSION }}" \
              "BILLING_CANARY_WORKSPACE_IDS=${{ env.BILLING_CANARY_WORKSPACE_IDS }}" \
              "REDIS_URL=secretref:bullmq-redis-url" \
              "UPSTASH_REDIS_REST_URL=secretref:upstash-redis-rest-url" \
              "UPSTASH_REDIS_REST_TOKEN=secretref:upstash-redis-rest-token" \
              "LYRASHIELD_EVIDENCE_KEK=secretref:${LYRASHIELD_EVIDENCE_KEK_SECRET}" \
              "LYRASHIELD_EVIDENCE_KEK_ACTIVE_REF=${LYRASHIELD_EVIDENCE_KEK_ACTIVE_REF}" \
              "LYRASHIELD_EVIDENCE_KEK_KEYRING=secretref:${LYRASHIELD_EVIDENCE_KEK_KEYRING_SECRET}" \
              "S3_ENDPOINT=secretref:evidence-s3-endpoint" \
              "S3_BUCKET=secretref:evidence-s3-bucket" \
              "S3_ACCESS_KEY=secretref:evidence-s3-access" \
              "S3_SECRET_KEY=secretref:evidence-s3-secret" \
              "S3_REGION=auto" \
              "GITHUB_APP_ID=secretref:github-app-id" \
              "GITHUB_APP_SLUG=secretref:github-app-slug" \
              "GITHUB_APP_PRIVATE_KEY=secretref:github-app-private-key" \
              "GITHUB_WEBHOOK_SECRET=secretref:github-webhook-secret" \
              "${EMAIL_ENV[@]}" \
              "${OAUTH_ENV[@]}" \
            --output none
          CANDIDATE_REVISION=$(az containerapp show \
            --name "$AZURE_APP_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestRevisionName \
            --output tsv)
          CANDIDATE_FQDN=$(az containerapp revision show \
            --name "$AZURE_APP_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$CANDIDATE_REVISION" \
            --query properties.fqdn \
            --output tsv)
          if [ -z "$CANDIDATE_REVISION" ] || [ -z "$CANDIDATE_FQDN" ]; then
            echo "::error::Azure did not return the app candidate revision and FQDN. Production traffic was not changed."
            exit 1
          fi
          echo "revision=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"
          echo "fqdn=$CANDIDATE_FQDN" >> "$GITHUB_OUTPUT"
          if [ "${{ env.CLOUDFLARE_ORIGIN_MTLS }}" = "required" ]; then
            for path in /api/ready /api/ready/evidence; do
              for attempt in $(seq 1 24); do
                if curl --fail --silent --show-error --max-time 10 \
                  --cert "$probe_dir/cert.pem" --key "$probe_dir/key.pem" \
                  "https://${CANDIDATE_FQDN}${path}"; then
                  break
                fi
                if [ "$attempt" = "24" ]; then
                  echo "::error::mTLS deployment probe failed for ${path}. Production traffic was not changed."
                  exit 1
                fi
                sleep 5
              done
            done
            echo "mTLS candidate probe passed with ephemeral certificate fingerprint only."
          fi

      - name: Deploy scanner Container App
        id: deploy-scanner
        if: steps.sync-upstash.outcome == 'success' && steps.sync-github-app.outcome == 'success' && vars.AZURE_SCANNER_CONTAINER_APP_NAME != ''
        env:
          IMAGE: ${{ needs.build.outputs.web_image }}@${{ needs.build.outputs.web_digest }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.LYRASHIELD_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.LYRASHIELD_GITHUB_APP_CLIENT_SECRET }}
          EMAIL_VERIFICATION_REQUIRED: ${{ env.REQUIRE_EMAIL_VERIFICATION }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_SCANNER_CONTAINER_APP_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
        run: |
          OAUTH_ENV=()
          if [ -n "${GITHUB_APP_CLIENT_ID}" ] && [ -n "${GITHUB_APP_CLIENT_SECRET}" ]; then
            OAUTH_ENV=("GITHUB_APP_CLIENT_ID=secretref:github-app-client-id" "GITHUB_APP_CLIENT_SECRET=secretref:github-app-client-secret")
          fi
          EMAIL_ENV=()
          if [ "$EMAIL_VERIFICATION_REQUIRED" = "1" ]; then
            EMAIL_ENV=("BREVO_API_KEY=secretref:brevo-api-key")
          fi
          az containerapp update \
            --name "$AZURE_SCANNER_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${IMAGE}" \
            --min-replicas 1 \
            --set-env-vars \
              "NEXT_PUBLIC_APP_URL=${{ env.SCANNER_URL }}" \
              "NEXT_PUBLIC_MARKETING_URL=${{ env.MARKETING_URL }}" \
              "BETTER_AUTH_URL=${{ env.APP_URL }}" \
              "PLATFORM_ADMIN_EMAILS=${{ env.PLATFORM_ADMIN_EMAILS }}" \
              "LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=${{ env.REQUIRE_EMAIL_VERIFICATION }}" \
              "LYRASHIELD_DEPLOYMENT_ENVIRONMENT=production" \
              "BILLING_STAGING_ADMISSION=off" \
              "BILLING_STAGING_ACCESS_TOKEN=" \
              "BILLING_STAGING_REGION=" \
              "POLAR_BILLING_ADMISSION=${{ env.POLAR_BILLING_ADMISSION }}" \
              "POLAR_LOCAL_BILLING_ADMISSION=${{ env.POLAR_LOCAL_BILLING_ADMISSION }}" \
              "RAZORPAY_BILLING_ADMISSION=${{ env.RAZORPAY_BILLING_ADMISSION }}" \
              "RAZORPAY_LOCAL_BILLING_ADMISSION=${{ env.RAZORPAY_LOCAL_BILLING_ADMISSION }}" \
              "BILLING_CANARY_WORKSPACE_IDS=" \
              "CLOUDFLARE_ORIGIN_MTLS=off" \
              "CLOUDFLARE_AOP_CERT_SHA256=" \
              "DEPLOY_PROBE_CERT_SHA256=" \
              "REDIS_URL=secretref:bullmq-redis-url" \
              "UPSTASH_REDIS_REST_URL=secretref:upstash-redis-rest-url" \
              "UPSTASH_REDIS_REST_TOKEN=secretref:upstash-redis-rest-token" \
              "GITHUB_APP_ID=secretref:github-app-id" \
              "GITHUB_APP_SLUG=secretref:github-app-slug" \
              "GITHUB_APP_PRIVATE_KEY=secretref:github-app-private-key" \
              "GITHUB_WEBHOOK_SECRET=secretref:github-webhook-secret" \
              "${EMAIL_ENV[@]}" \
              "${OAUTH_ENV[@]}" \
            --output none
          CANDIDATE_REVISION=$(az containerapp show \
            --name "$AZURE_SCANNER_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestRevisionName \
            --output tsv)
          CANDIDATE_FQDN=$(az containerapp revision show \
            --name "$AZURE_SCANNER_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$CANDIDATE_REVISION" \
            --query properties.fqdn \
            --output tsv)
          if [ -z "$CANDIDATE_REVISION" ] || [ -z "$CANDIDATE_FQDN" ]; then
            echo "::error::Azure did not return the scanner candidate revision and FQDN. Production traffic was not changed."
            exit 1
          fi
          echo "revision=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"
          echo "fqdn=$CANDIDATE_FQDN" >> "$GITHUB_OUTPUT"

      - name: Deploy egress-proxy Container App
        id: deploy-egress-proxy
        if: vars.AZURE_EGRESS_PROXY_CONTAINER_APP_NAME != ''
        env:
          IMAGE: ${{ needs.build.outputs.egress_proxy_image }}@${{ needs.build.outputs.egress_proxy_digest }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_EGRESS_PROXY_CONTAINER_APP_NAME: ${{ vars.AZURE_EGRESS_PROXY_CONTAINER_APP_NAME }}
        run: |
          az containerapp update \
            --name "$AZURE_EGRESS_PROXY_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none
          CANDIDATE_REVISION=$(az containerapp show \
            --name "$AZURE_EGRESS_PROXY_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestRevisionName \
            --output tsv)
          CANDIDATE_FQDN=$(az containerapp revision show \
            --name "$AZURE_EGRESS_PROXY_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$CANDIDATE_REVISION" \
            --query properties.fqdn \
            --output tsv)
          if [ -z "$CANDIDATE_REVISION" ] || [ -z "$CANDIDATE_FQDN" ]; then
            echo "::error::Azure did not return the egress-proxy candidate revision and FQDN. Production traffic was not changed."
            exit 1
          fi
          echo "revision=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"
          echo "fqdn=$CANDIDATE_FQDN" >> "$GITHUB_OUTPUT"

      - name: Smoke candidate revisions
        id: smoke-candidates
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          APP_REVISION: ${{ steps.deploy-app.outputs.revision }}
          SCANNER_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
          SCANNER_REVISION: ${{ steps.deploy-scanner.outputs.revision }}
          EGRESS_NAME: ${{ vars.AZURE_EGRESS_PROXY_CONTAINER_APP_NAME }}
          WORKER_VM_NAME: ${{ vars.AZURE_WORKER_VM_NAME || 'lyrashield-worker' }}
          APP_FQDN: ${{ steps.deploy-app.outputs.fqdn }}
          SCANNER_FQDN: ${{ steps.deploy-scanner.outputs.fqdn }}
          EGRESS_FQDN: ${{ steps.deploy-egress-proxy.outputs.fqdn }}
          EGRESS_REVISION: ${{ steps.deploy-egress-proxy.outputs.revision }}
          CLOUDFLARE_ORIGIN_MTLS: ${{ env.CLOUDFLARE_ORIGIN_MTLS }}
        run: |
          source ops/deployment/azure-vm-run-command.sh
          smoke_candidate() {
            local label="$1"
            local name="$2"
            local revision="$3"
            local fqdn="$4"
            local path="$5"
            if [ -z "$fqdn" ]; then return 0; fi
            for attempt in $(seq 1 120); do
              if [ "$attempt" = "61" ]; then
                echo "::warning::${label} candidate missed its first readiness window; restarting the zero-traffic revision once."
                timeout --foreground 180s az containerapp revision restart \
                  --name "$name" \
                  --resource-group "$RG" \
                  --revision "$revision" \
                  --output none
              fi
              if curl --fail --silent --show-error --max-time 5 "https://${fqdn}${path}"; then
                echo "${label} candidate health OK"
                return 0
              fi
              echo "${label} candidate not ready (attempt ${attempt}), retrying in 5s..."
              sleep 5
            done
            echo "::error::${label} candidate health failed after one bounded revision restart. Production traffic was not changed."
            return 1
          }
          smoke_egress_candidate() {
            if [ -z "$EGRESS_NAME" ]; then return 0; fi
            for attempt in $(seq 1 120); do
              if [ "$attempt" = "61" ]; then
                echo "::warning::egress-proxy candidate missed its first readiness window; restarting the zero-traffic revision once."
                timeout --foreground 180s az containerapp revision restart \
                  --name "$EGRESS_NAME" \
                  --resource-group "$RG" \
                  --revision "$EGRESS_REVISION" \
                  --output none
              fi
              local health
              local running
              health=$(az containerapp revision show \
                --name "$EGRESS_NAME" \
                --resource-group "$RG" \
                --revision "$EGRESS_REVISION" \
                --query properties.healthState \
                --output tsv)
              running=$(az containerapp revision show \
                --name "$EGRESS_NAME" \
                --resource-group "$RG" \
                --revision "$EGRESS_REVISION" \
                --query properties.runningState \
                --output tsv)
              if [ "$health" = "Healthy" ] && [[ "$running" == Running* ]]; then
                local result
                result=$(azure_vm_run_command_with_retry \
                  --name "$WORKER_VM_NAME" \
                  --resource-group "$RG" \
                  --command-id RunShellScript \
                  --scripts "curl --fail --silent --show-error --max-time 10 https://${EGRESS_FQDN}/health && echo EGRESS_HEALTH_OK" \
                  --query 'value[0].message' \
                  --output tsv)
                if grep -q EGRESS_HEALTH_OK <<< "$result"; then
                  echo "egress-proxy candidate health OK from worker VM"
                  return 0
                fi
                echo "::error::Worker VM could not reach the healthy egress-proxy candidate."
                return 1
              fi
              echo "egress-proxy candidate not ready (attempt ${attempt}), retrying in 5s..."
              sleep 5
            done
            echo "::error::egress-proxy candidate health failed after one bounded revision restart. Production traffic was not changed."
            return 1
          }
          if [ "$CLOUDFLARE_ORIGIN_MTLS" = "required" ]; then
            APP_SMOKE_PID=""
            echo "App mTLS candidate readiness already passed with ephemeral client certificate."
          else
            smoke_candidate app "$APP_NAME" "$APP_REVISION" "$APP_FQDN" /api/ready & APP_SMOKE_PID=$!
          fi
          smoke_candidate scanner "$SCANNER_NAME" "$SCANNER_REVISION" "$SCANNER_FQDN" /api/ready & SCANNER_SMOKE_PID=$!
          smoke_egress_candidate & EGRESS_SMOKE_PID=$!
          CANDIDATE_SMOKE_FAILED=0
          if [ -z "$APP_SMOKE_PID" ]; then
            :
          elif wait "$APP_SMOKE_PID"; then
            if [ -n "$APP_FQDN" ] && ! curl --fail --silent --show-error --max-time 5 "https://${APP_FQDN}/api/ready/evidence"; then
              echo "::error::app candidate evidence configuration is not ready. Production traffic was not changed."
              CANDIDATE_SMOKE_FAILED=1
            fi
          else
            CANDIDATE_SMOKE_FAILED=1
          fi
          wait "$SCANNER_SMOKE_PID" || CANDIDATE_SMOKE_FAILED=1
          wait "$EGRESS_SMOKE_PID" || CANDIDATE_SMOKE_FAILED=1
          exit "$CANDIDATE_SMOKE_FAILED"

      - name: Verify worker queues are empty before traffic promotion
        id: worker-preflight
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          WORKER_VM_NAME: ${{ vars.AZURE_WORKER_VM_NAME || 'lyrashield-worker' }}
        run: |
          source ops/deployment/azure-vm-run-command.sh
          payload=$(base64 --wrap=0 .github/scripts/promote-worker-vm.sh)
          result=$(azure_vm_run_command_with_retry \
            --name "$WORKER_VM_NAME" --resource-group "$RG" \
            --command-id RunShellScript \
            --scripts "printf '%s' '$payload' | base64 -d | sh -s -- --preflight" \
            --query 'value[0].message' --output tsv)
          printf '%s\n' "$result"
          grep -q "Worker empty-queue preflight passed" <<< "$result"

      - name: Promote healthy candidate revisions
        id: promote
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          APP_CANDIDATE: ${{ steps.deploy-app.outputs.revision }}
          APP_PREVIOUS: ${{ steps.rollout.outputs.app_previous }}
          SCANNER_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
          SCANNER_CANDIDATE: ${{ steps.deploy-scanner.outputs.revision }}
          SCANNER_PREVIOUS: ${{ steps.rollout.outputs.scanner_previous }}
          EGRESS_NAME: ${{ vars.AZURE_EGRESS_PROXY_CONTAINER_APP_NAME }}
          EGRESS_CANDIDATE: ${{ steps.deploy-egress-proxy.outputs.revision }}
          EGRESS_PREVIOUS: ${{ steps.rollout.outputs.egress_previous }}
        run: |
          set_traffic() {
            local name="$1"
            local revision="$2"
            if [ -z "$name" ]; then return 0; fi
            az containerapp ingress traffic set \
              --name "$name" \
              --resource-group "$RG" \
              --revision-weight "$revision=100" \
              --output none
          }
          restore_previous() {
            set_traffic "$APP_NAME" "$APP_PREVIOUS" || true
            set_traffic "$SCANNER_NAME" "$SCANNER_PREVIOUS" || true
            set_traffic "$EGRESS_NAME" "$EGRESS_PREVIOUS" || true
          }
          if ! set_traffic "$APP_NAME" "$APP_CANDIDATE" || \
             ! set_traffic "$SCANNER_NAME" "$SCANNER_CANDIDATE" || \
             ! set_traffic "$EGRESS_NAME" "$EGRESS_CANDIDATE"; then
            echo "::error::Candidate promotion failed. Restoring every previous traffic target."
            restore_previous
            exit 1
          fi

      - name: Smoke production traffic
        id: smoke-public
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          EGRESS_NAME: ${{ vars.AZURE_EGRESS_PROXY_CONTAINER_APP_NAME }}
          WORKER_VM_NAME: ${{ vars.AZURE_WORKER_VM_NAME || 'lyrashield-worker' }}
        run: |
          source ops/deployment/azure-vm-run-command.sh
          smoke_public() {
            local label="$1"
            local url="$2"
            if [ -z "$url" ]; then return 0; fi
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --max-time 10 "$url"; then
                echo "${label} production health OK"
                return 0
              fi
              echo "${label} production health not ready (attempt ${attempt}), retrying in 10s..."
              sleep 10
            done
            echo "::error::${label} production health failed after promotion."
            return 1
          }
          smoke_egress_from_worker() {
            local url="$1"
            if [ -z "$url" ]; then return 0; fi
            local result
            result=$(azure_vm_run_command_with_retry \
              --name "$WORKER_VM_NAME" \
              --resource-group "$RG" \
              --command-id RunShellScript \
              --scripts "curl --fail --silent --show-error --max-time 10 ${url} && echo EGRESS_HEALTH_OK" \
              --query 'value[0].message' \
              --output tsv)
            grep -q EGRESS_HEALTH_OK <<< "$result"
          }
          EGRESS_URL=""
          if [ -n "$EGRESS_NAME" ]; then
            EGRESS_FQDN=$(az containerapp show \
              --name "$EGRESS_NAME" \
              --resource-group "$RG" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)
            if [ -z "$EGRESS_FQDN" ]; then
              echo "::error::Azure did not return the egress-proxy production FQDN."
              exit 1
            fi
            EGRESS_URL="https://${EGRESS_FQDN}/health"
          fi
          smoke_public app "${{ env.APP_URL }}/api/ready"
          smoke_public scanner "${{ env.SCANNER_URL }}/api/ready"
          smoke_egress_from_worker "$EGRESS_URL"

      - name: Deactivate superseded Container App revisions
        if: steps.smoke-public.outcome == 'success'
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          APP_CURRENT: ${{ steps.deploy-app.outputs.revision }}
          APP_ROLLBACK: ${{ steps.rollout.outputs.app_previous }}
          SCANNER_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
          SCANNER_CURRENT: ${{ steps.deploy-scanner.outputs.revision }}
          SCANNER_ROLLBACK: ${{ steps.rollout.outputs.scanner_previous }}
          EGRESS_NAME: ${{ vars.AZURE_EGRESS_PROXY_CONTAINER_APP_NAME }}
          EGRESS_CURRENT: ${{ steps.deploy-egress-proxy.outputs.revision }}
          EGRESS_ROLLBACK: ${{ steps.rollout.outputs.egress_previous }}
        run: |
          deactivate_superseded() {
            local label="$1"
            local name="$2"
            local current="$3"
            local rollback="$4"
            if [ -z "$name" ]; then return 0; fi
            if [ -z "$current" ] || [ -z "$rollback" ] || [ "$current" = "$rollback" ]; then
              echo "::error::${label} revision cleanup requires distinct current and rollback revisions."
              return 1
            fi

            local traffic_revision
            local traffic_weight
            traffic_revision=$(az containerapp ingress traffic show \
              --name "$name" \
              --resource-group "$RG" \
              --query "[?weight == \`100\`].revisionName | [0]" \
              --output tsv)
            traffic_weight=$(az containerapp ingress traffic show \
              --name "$name" \
              --resource-group "$RG" \
              --query "[?revisionName == '${current}'].weight | [0]" \
              --output tsv)
            if [ "$traffic_revision" != "$current" ] || [ "$traffic_weight" != "100" ]; then
              echo "::error::${label} cleanup refused: ${current} is not the sole 100% traffic revision."
              return 1
            fi

            mapfile -t active_revisions < <(az containerapp revision list \
              --name "$name" \
              --resource-group "$RG" \
              --query "[?properties.active].name" \
              --output tsv)
            if ! printf '%s\n' "${active_revisions[@]}" | grep -Fxq "$current" || \
               ! printf '%s\n' "${active_revisions[@]}" | grep -Fxq "$rollback"; then
              echo "::error::${label} cleanup refused: current or rollback revision is not active."
              return 1
            fi

            for revision in "${active_revisions[@]}"; do
              if [ "$revision" = "$current" ] || [ "$revision" = "$rollback" ]; then
                continue
              fi
              local weight
              weight=$(az containerapp ingress traffic show \
                --name "$name" \
                --resource-group "$RG" \
                --query "[?revisionName == '${revision}'].weight | [0]" \
                --output tsv)
              if [ -n "$weight" ] && [ "$weight" != "0" ]; then
                echo "::error::${label} cleanup refused to deactivate traffic-serving revision ${revision} (${weight}%)."
                return 1
              fi
              az containerapp revision deactivate \
                --name "$name" \
                --resource-group "$RG" \
                --revision "$revision" \
                --output none
            done

            local active_count
            active_count=$(az containerapp revision list \
              --name "$name" \
              --resource-group "$RG" \
              --query "[?properties.active] | length(@)" \
              --output tsv)
            if [ "$active_count" != "2" ]; then
              echo "::error::${label} must retain exactly current and one rollback revision; found ${active_count}."
              return 1
            fi
            echo "${label} retained current ${current} and rollback ${rollback}; superseded revisions are inactive."
          }

          CLEANUP_FAILED=0
          deactivate_superseded app "$APP_NAME" "$APP_CURRENT" "$APP_ROLLBACK" || CLEANUP_FAILED=1
          deactivate_superseded scanner "$SCANNER_NAME" "$SCANNER_CURRENT" "$SCANNER_ROLLBACK" || CLEANUP_FAILED=1
          deactivate_superseded egress-proxy "$EGRESS_NAME" "$EGRESS_CURRENT" "$EGRESS_ROLLBACK" || CLEANUP_FAILED=1
          exit "$CLEANUP_FAILED"

      - name: Promote verified worker digest on VM
        id: worker-vm
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          WORKER_VM_NAME: ${{ vars.AZURE_WORKER_VM_NAME || 'lyrashield-worker' }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
          WORKER_DIGEST: ${{ needs.build.outputs.worker_digest }}
        run: |
          source ops/deployment/azure-vm-run-command.sh
          payload=$(base64 --wrap=0 .github/scripts/promote-worker-vm.sh)
          worker_ref="${WORKER_IMAGE%@*}@${WORKER_DIGEST}"
          export AZURE_VM_RUN_COMMAND_TIMEOUT_SECONDS=1800
          result=$(azure_vm_run_command_with_retry \
            --name "$WORKER_VM_NAME" \
            --resource-group "$RG" \
            --command-id RunShellScript \
            --scripts "printf '%s' '$payload' | base64 -d | sh -s -- '$worker_ref' '$DEPLOY_SHA' '$ENGINE_REVISION'" \
            --query 'value[0].message' \
            --output tsv)
          printf '%s\n' "$result"
          grep -q "Worker promotion passed for ${WORKER_DIGEST}" <<< "$result"

      # Migrations and app-scope configuration remain forward-only. This rollback
      # changes traffic only, after every candidate had already passed readiness.
      - name: Roll back production traffic on health failure
        if: failure() && (steps.promote.outcome == 'failure' || steps.smoke-public.outcome == 'failure' || steps.worker-vm.outcome == 'failure')
        env:
          APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          APP_PREVIOUS: ${{ steps.rollout.outputs.app_previous }}
          SCANNER_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
          SCANNER_PREVIOUS: ${{ steps.rollout.outputs.scanner_previous }}
          EGRESS_NAME: ${{ vars.AZURE_EGRESS_PROXY_CONTAINER_APP_NAME }}
          EGRESS_PREVIOUS: ${{ steps.rollout.outputs.egress_previous }}
          WORKER_VM_NAME: ${{ vars.AZURE_WORKER_VM_NAME || 'lyrashield-worker' }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_SMOKE_URL: ${{ env.APP_URL }}/api/ready
          SCANNER_SMOKE_URL: ${{ env.SCANNER_URL }}/api/ready
        run: |
          source ops/deployment/azure-vm-run-command.sh
          rollback_app() {
            local name="$1"
            local revision="$2"
            local smoke_url="$3"
            if [ -z "$name" ]; then return 0; fi
            az containerapp revision activate \
              --name "$name" \
              --resource-group "$RG" \
              --revision "$revision" \
              --output none
            az containerapp ingress traffic set \
              --name "$name" \
              --resource-group "$RG" \
              --revision-weight "$revision=100" \
              --output none
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 "$smoke_url"; then
                echo "Rollback readiness passed for ${name}"
                return 0
              fi
              echo "Rollback readiness not restored for ${name} (attempt ${attempt}), retrying in 5s..."
              sleep 5
            done
            return 1
          }
          rollback_egress() {
            local name="$1"
            local revision="$2"
            local smoke_url="$3"
            if [ -z "$name" ]; then return 0; fi
            az containerapp revision activate \
              --name "$name" \
              --resource-group "$RG" \
              --revision "$revision" \
              --output none
            az containerapp ingress traffic set \
              --name "$name" \
              --resource-group "$RG" \
              --revision-weight "$revision=100" \
              --output none
            local result
            result=$(azure_vm_run_command_with_retry \
              --name "$WORKER_VM_NAME" \
              --resource-group "$RG" \
              --command-id RunShellScript \
              --scripts "curl --fail --silent --show-error --max-time 10 ${smoke_url} && echo EGRESS_HEALTH_OK" \
              --query 'value[0].message' \
              --output tsv)
            grep -q EGRESS_HEALTH_OK <<< "$result"
          }
          EGRESS_SMOKE_URL=""
          if [ -n "$EGRESS_NAME" ]; then
            EGRESS_FQDN=$(az containerapp show \
              --name "$EGRESS_NAME" \
              --resource-group "$RG" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)
            EGRESS_SMOKE_URL="https://${EGRESS_FQDN}/health"
          fi
          ROLLBACK_FAILED=0
          rollback_app "$APP_NAME" "$APP_PREVIOUS" "$APP_SMOKE_URL" || ROLLBACK_FAILED=1
          rollback_app "$SCANNER_NAME" "$SCANNER_PREVIOUS" "$SCANNER_SMOKE_URL" || ROLLBACK_FAILED=1
          rollback_egress "$EGRESS_NAME" "$EGRESS_PREVIOUS" "$EGRESS_SMOKE_URL" || ROLLBACK_FAILED=1
          if [ "$ROLLBACK_FAILED" -ne 0 ]; then
            echo "::error::One or more previous revisions did not recover. Manual recovery required."
            exit 1
          fi

      - name: Restore prior ingress mode after failed rollout
        if: >
          failure() && steps.deploy-app.outputs.previous_client_cert_mode != '' &&
          (steps.deploy-app.outcome == 'failure' || steps.deploy-scanner.outcome == 'failure' ||
          steps.deploy-egress-proxy.outcome == 'failure' || steps.smoke-candidates.outcome == 'failure' ||
          steps.worker-preflight.outcome == 'failure' ||
          steps.promote.outcome == 'failure' || steps.smoke-public.outcome == 'failure' || steps.worker-vm.outcome == 'failure')
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          PREVIOUS_CLIENT_CERT_MODE: ${{ steps.deploy-app.outputs.previous_client_cert_mode }}
        run: |
          case "$PREVIOUS_CLIENT_CERT_MODE" in
            Ignore|Require) ;;
            *) echo "::error::Refusing to restore an unexpected Container Apps client certificate mode."; exit 1 ;;
          esac
          APP_RESOURCE_ID=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query id \
            --output tsv)
          printf '%s' "$(jq -nc --arg mode "$PREVIOUS_CLIENT_CERT_MODE" '{properties: {configuration: {ingress: {clientCertificateMode: $mode}}}}')" | az rest \
            --method patch \
            --url "${APP_RESOURCE_ID}?api-version=2025-01-01" \
            --headers 'Content-Type=application/json' \
            --body @- \
            --output none
          for attempt in $(seq 1 24); do
            restored_mode=$(az rest \
              --method get \
              --url "${APP_RESOURCE_ID}?api-version=2025-01-01" \
              --query 'properties.configuration.ingress.clientCertificateMode' \
              --output tsv)
            if [ "${restored_mode,,}" = "${PREVIOUS_CLIENT_CERT_MODE,,}" ]; then
              exit 0
            fi
            if [ "$attempt" = "24" ]; then
              break
            fi
            sleep 5
          done
          echo "::error::Previous Container Apps client certificate mode did not recover after rollout failure."
          exit 1

      - name: Deactivate zero-traffic candidates after failed rollout
        if: >
          failure() &&
          (steps.deploy-app.outcome == 'failure' || steps.deploy-scanner.outcome == 'failure' ||
          steps.deploy-egress-proxy.outcome == 'failure' || steps.smoke-candidates.outcome == 'failure' ||
          steps.worker-preflight.outcome == 'failure' ||
          steps.promote.outcome == 'failure' || steps.smoke-public.outcome == 'failure' || steps.worker-vm.outcome == 'failure')
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
          APP_CANDIDATE: ${{ steps.deploy-app.outputs.revision }}
          APP_PREVIOUS: ${{ steps.rollout.outputs.app_previous }}
          SCANNER_NAME: ${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}
          SCANNER_CANDIDATE: ${{ steps.deploy-scanner.outputs.revision }}
          SCANNER_PREVIOUS: ${{ steps.rollout.outputs.scanner_previous }}
          EGRESS_NAME: ${{ vars.AZURE_EGRESS_PROXY_CONTAINER_APP_NAME }}
          EGRESS_CANDIDATE: ${{ steps.deploy-egress-proxy.outputs.revision }}
          EGRESS_PREVIOUS: ${{ steps.rollout.outputs.egress_previous }}
        run: |
          deactivate_candidate() {
            local label="$1"
            local name="$2"
            local candidate="$3"
            local previous="$4"
            if [ -z "$name" ] || [ -z "$candidate" ] || [ "$candidate" = "$previous" ]; then return 0; fi
            local weight
            weight=$(az containerapp ingress traffic show \
              --name "$name" \
              --resource-group "$RG" \
              --query "[?revisionName == '${candidate}'].weight | [0]" \
              --output tsv)
            if [ -n "$weight" ] && [ "$weight" != "0" ]; then
              echo "::error::${label} candidate ${candidate} still serves ${weight}% traffic; refusing to deactivate it."
              return 1
            fi
            if [ "$(az containerapp revision show --name "$name" --resource-group "$RG" --revision "$candidate" --query properties.active --output tsv)" = "true" ]; then
              az containerapp revision deactivate \
                --name "$name" \
                --resource-group "$RG" \
                --revision "$candidate" \
                --output none
              echo "Deactivated zero-traffic ${label} candidate ${candidate}."
            fi
          }
          CLEANUP_FAILED=0
          deactivate_candidate app "$APP_NAME" "$APP_CANDIDATE" "$APP_PREVIOUS" || CLEANUP_FAILED=1
          deactivate_candidate scanner "$SCANNER_NAME" "$SCANNER_CANDIDATE" "$SCANNER_PREVIOUS" || CLEANUP_FAILED=1
          deactivate_candidate egress-proxy "$EGRESS_NAME" "$EGRESS_CANDIDATE" "$EGRESS_PREVIOUS" || CLEANUP_FAILED=1
          exit "$CLEANUP_FAILED"
