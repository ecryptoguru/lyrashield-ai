name: Deploy to Azure

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository }}/lyrashield-web
  WORKER_IMAGE: ghcr.io/${{ github.repository }}/lyrashield-worker
  MARKETING_URL: ${{ vars.LYRASHIELD_MARKETING_URL || 'https://lyrashieldai.com' }}
  APP_URL: ${{ vars.LYRASHIELD_APP_URL || 'https://app.lyrashieldai.com' }}
  SCANNER_URL: ${{ vars.LYRASHIELD_SCANNER_URL || 'https://scanner.lyrashieldai.com' }}
  REQUIRE_EMAIL_VERIFICATION: ${{ vars.LYRASHIELD_REQUIRE_EMAIL_VERIFICATION || '0' }}

jobs:
  build:
    name: Build and push container images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      web_image: ${{ steps.meta.outputs.web_image }}
      worker_image: ${{ steps.meta.outputs.worker_image }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The worker image requires the sibling engine source. If the engine repo
      # is not available this step is skipped and only the web image is built.
      - name: Checkout engine
        id: engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: ${{ github.repository_owner }}/lyrashield-engine
          path: lyrashield-engine
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          echo "web_image=${{ env.WEB_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "worker_image=${{ env.WORKER_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }},${{ env.WEB_IMAGE }}:latest
          build-args: |
            BUILD_APP_URL=${{ env.APP_URL }}
            BUILD_PUBLIC_APP_URL=${{ env.SCANNER_URL }}
            BUILD_PUBLIC_MARKETING_URL=${{ env.MARKETING_URL }}
            BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        id: build-worker
        if: steps.engine.outcome == 'success' && hashFiles('lyrashield-engine/pyproject.toml') != ''
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          target: worker
          push: true
          tags: ${{ env.WORKER_IMAGE }}:${{ github.sha }},${{ env.WORKER_IMAGE }}:latest
          build-contexts: |
            engine=lyrashield-engine
          build-args: |
            BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Worker image digest
        if: steps.build-worker.outcome == 'success'
        run: |
          echo "Pushed worker image: ${{ env.WORKER_IMAGE }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # Every merge to main pushes a new SHA-tagged image and re-points :latest, with nothing ever
  # deleting what it replaced. Multi-arch buildx pushes also leave several untagged manifests
  # per build (per-platform layers under the tagged manifest list), so versions accumulate
  # faster than commits. Runs after `deploy` (not `build`) so the freshly deployed image is
  # never the one being cleaned up.
  #
  # Uses dataaxiom/ghcr-cleanup-action rather than a raw "delete this version ID" call: it
  # resolves multi-arch manifest lists first and will not delete an untagged manifest that a
  # kept tagged version still references, which a naive per-ID delete could do and break a
  # pull of an image that still LOOKS tagged and valid.
  cleanup-old-images:
    name: Clean up superseded container images
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged and superseded image versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: lyrashield-ai/lyrashield-web,lyrashield-ai/lyrashield-worker
          # Keep the most recent 10 tagged versions of each package (the deployed one plus a
          # safety margin for rollback) and remove every dangling untagged manifest.
          keep-n-tagged: 10
          delete-untagged: true
          # Live as of 2026-07-30. Founder-approved after reviewing a real dry-run pass
          # (run 30496418272): it reported "no tagged images found to delete" and "no
          # untagged images found" for both packages — with only ~10 accumulated versions
          # against keep-n-tagged: 10, nothing had aged out yet, so the first live run is a
          # verified no-op, not a leap of faith. See docs/deployment/PRODUCTION_DEPLOYMENT.md
          # "Known production blockers" #4 for the full sign-off record.
          dry-run: false

  deploy:
    name: Deploy Azure Container Apps
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: azure-production
      url: ${{ env.APP_URL }}
    if: >
      (vars.AZURE_RESOURCE_GROUP != '') &&
      ((vars.AZURE_APP_CONTAINER_APP_NAME != '') || (vars.AZURE_SCANNER_CONTAINER_APP_NAME != ''))
    steps:
      - name: Log in to Azure
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Container Apps extension
        run: az extension add --name containerapp --yes --only-show-errors

      # Schema first, then code. Migrations previously ran only in CI against a throwaway
      # database and never against production, so a release needing a schema change served
      # 500s until someone remembered to run this by hand. Ordering matters: new code must
      # never meet an old schema, which means migrations must be additive and
      # backward-compatible with the currently running image.
      - name: Checkout for migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_DIRECT_URL secret is not set — refusing to deploy code against an unmigrated schema."
            exit 1
          fi
          pnpm install --frozen-lockfile
          pnpm --filter @lyrashield/db exec prisma migrate deploy

      - name: Verify shared rate-limiting credentials
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "${UPSTASH_REDIS_REST_URL}" ] || [ -z "${UPSTASH_REDIS_REST_TOKEN}" ]; then
            echo "::error::UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN are not set. Rate limiting would fall back to per-instance memory, so the effective limit becomes (limit x replica count) and scaling out weakens the control. These are the HTTPS REST credentials and are NOT interchangeable with REDIS_URL."
            exit 1
          fi
          echo "Shared rate-limiting credentials present."

      # secretref: below requires the Container App to already define secrets named
      # upstash-redis-rest-url / upstash-redis-rest-token. Nothing provisioned those, so the
      # secretref would fail az containerapp update outright on a fresh app. This step
      # (re)creates them from the same GitHub secrets checked above, on every deploy, so
      # rotating the GitHub secret also rotates the Container App's copy.
      - name: Sync Upstash secrets to Container Apps
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -n "${{ vars.AZURE_APP_CONTAINER_APP_NAME }}" ]; then
            az containerapp secret set \
              --name "${{ vars.AZURE_APP_CONTAINER_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --secrets "upstash-redis-rest-url=${UPSTASH_REDIS_REST_URL}" "upstash-redis-rest-token=${UPSTASH_REDIS_REST_TOKEN}"
          fi
          if [ -n "${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}" ]; then
            az containerapp secret set \
              --name "${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --secrets "upstash-redis-rest-url=${UPSTASH_REDIS_REST_URL}" "upstash-redis-rest-token=${UPSTASH_REDIS_REST_TOKEN}"
          fi

      # Garbage-collect GitHub App secrets so rotation deletes what is no longer needed.
      # A runbook lives in docs/deployment/PRODUCTION_DEPLOYMENT.md "Known production
      # blockers" #6 and lays out app creation, credential inventory, webhook wiring, and
      # secret naming. Every deploy reconciles this list with Container App secrets:
      # existing secrets keep their type (PEM private key survives intact), and a secret
      # that vanishes from the set below is removed so stale material does not linger.
      # This block is independent of whether the app still needs rotation.
      - name: Verify GitHub App credentials
        env:
          GITHUB_APP_ID: ${{ secrets.LYRASHIELD_GITHUB_APP_ID }}
          GITHUB_APP_SLUG: ${{ secrets.LYRASHIELD_GITHUB_APP_SLUG }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.LYRASHIELD_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.LYRASHIELD_GITHUB_APP_WEBHOOK_SECRET }}
        run: |
          if [ -z "${GITHUB_APP_ID}" ] || [ -z "${GITHUB_APP_SLUG}" ] || [ -z "${GITHUB_APP_PRIVATE_KEY}" ] || [ -z "${GITHUB_WEBHOOK_SECRET}" ]; then
            echo "::warning::GITHUB_APP_ID / GITHUB_APP_SLUG / GITHUB_APP_PRIVATE_KEY / GITHUB_WEBHOOK_SECRET are not all set. GitHub connect path will 500 CONFIG_ERROR until they are. F1's four-way onboarding (URL/API/Skip) keeps signups alive in the meantime — see PRODUCTION_DEPLOYMENT.md #6 for runbook."
          else
            if ! echo "${GITHUB_APP_PRIVATE_KEY}" | grep -q "BEGIN"; then
              echo "::error::GITHUB_APP_PRIVATE_KEY must be a PEM-formatted key starting with -----BEGIN."
              exit 1
            fi
            echo "GitHub App credentials present."
          fi

      - name: Sync GitHub App secrets to Container Apps
        env:
          GITHUB_APP_ID: ${{ secrets.LYRASHIELD_GITHUB_APP_ID }}
          GITHUB_APP_SLUG: ${{ secrets.LYRASHIELD_GITHUB_APP_SLUG }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.LYRASHIELD_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.LYRASHIELD_GITHUB_APP_WEBHOOK_SECRET }}
        run: |
          if [ -z "${GITHUB_APP_ID}" ] || [ -z "${GITHUB_APP_SLUG}" ] || [ -z "${GITHUB_APP_PRIVATE_KEY}" ] || [ -z "${GITHUB_WEBHOOK_SECRET}" ]; then
            echo "Skipping GitHub App secret sync — not all secrets set (see verify step above)."
            exit 0
          fi
          if [ -n "${{ vars.AZURE_APP_CONTAINER_APP_NAME }}" ]; then
            az containerapp secret set \
              --name "${{ vars.AZURE_APP_CONTAINER_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --secrets "github-app-id=${GITHUB_APP_ID}" "github-app-slug=${GITHUB_APP_SLUG}" "github-app-private-key=${GITHUB_APP_PRIVATE_KEY}" "github-webhook-secret=${GITHUB_WEBHOOK_SECRET}"
          fi
          if [ -n "${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}" ]; then
            az containerapp secret set \
              --name "${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --secrets "github-app-id=${GITHUB_APP_ID}" "github-app-slug=${GITHUB_APP_SLUG}" "github-app-private-key=${GITHUB_APP_PRIVATE_KEY}" "github-webhook-secret=${GITHUB_WEBHOOK_SECRET}"
          fi

      - name: Deploy app Container App
        if: vars.AZURE_APP_CONTAINER_APP_NAME != ''
        env:
          IMAGE: ${{ needs.build.outputs.web_image }}
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_APP_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${IMAGE}" \
            --set-env-vars \
              "NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}" \
              "NEXT_PUBLIC_MARKETING_URL=${{ env.MARKETING_URL }}" \
              "BETTER_AUTH_URL=${{ env.APP_URL }}" \
              "LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=${{ env.REQUIRE_EMAIL_VERIFICATION }}" \
              "UPSTASH_REDIS_REST_URL=secretref:upstash-redis-rest-url" \
              "UPSTASH_REDIS_REST_TOKEN=secretref:upstash-redis-rest-token" \
              "GITHUB_APP_ID=secretref:github-app-id" \
              "GITHUB_APP_SLUG=secretref:github-app-slug" \
              "GITHUB_APP_PRIVATE_KEY=secretref:github-app-private-key" \
              "GITHUB_WEBHOOK_SECRET=secretref:github-webhook-secret"

      - name: Deploy scanner Container App
        if: vars.AZURE_SCANNER_CONTAINER_APP_NAME != ''
        env:
          IMAGE: ${{ needs.build.outputs.web_image }}
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_SCANNER_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${IMAGE}" \
            --set-env-vars \
              "NEXT_PUBLIC_APP_URL=${{ env.SCANNER_URL }}" \
              "NEXT_PUBLIC_MARKETING_URL=${{ env.MARKETING_URL }}" \
              "BETTER_AUTH_URL=${{ env.APP_URL }}" \
              "LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=${{ env.REQUIRE_EMAIL_VERIFICATION }}" \
              "UPSTASH_REDIS_REST_URL=secretref:upstash-redis-rest-url" \
              "UPSTASH_REDIS_REST_TOKEN=secretref:upstash-redis-rest-token" \
              "GITHUB_APP_ID=secretref:github-app-id" \
              "GITHUB_APP_SLUG=secretref:github-app-slug" \
              "GITHUB_APP_PRIVATE_KEY=secretref:github-app-private-key" \
              "GITHUB_WEBHOOK_SECRET=secretref:github-webhook-secret"

      - name: Smoke app health
        if: vars.AZURE_APP_CONTAINER_APP_NAME != ''
        env:
          SMOKE_URL: "${{ env.APP_URL }}/api/ready"
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 "$SMOKE_URL"; then
              echo "App health OK"
              exit 0
            fi
            echo "App health not ready (attempt $i), retrying in 10s..."
            sleep 10
          done
          echo "App health smoke failed after 60 attempts"
          exit 1

      - name: Smoke scanner health
        if: vars.AZURE_SCANNER_CONTAINER_APP_NAME != ''
        env:
          SMOKE_URL: "${{ env.SCANNER_URL }}/api/ready"
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 "$SMOKE_URL"; then
              echo "Scanner health OK"
              exit 0
            fi
            echo "Scanner health not ready (attempt $i), retrying in 10s..."
            sleep 10
          done
          echo "Scanner health smoke failed after 60 attempts"
          exit 1
