name: Verify exact webhook worker image without production access

on:
  workflow_call:
    inputs:
      cold_release:
        description: Run native cold single-worker checks for the protected release caller
        type: boolean
        default: false
      product_source_sha:
        description: Immutable product commit recorded in this worker image's OCI provenance
        required: true
        type: string
      engine_revision:
        description: Immutable engine revision recorded in this worker image's OCI provenance
        required: true
        type: string
      worker_image:
        description: Full worker image reference pinned by sha256 digest
        required: true
        type: string
    outputs:
      cold_sandbox_image:
        description: Authenticated immutable sandbox used by same-run native checks
        value: ${{ jobs.verify-worker-image.outputs.cold_sandbox_image }}
      rehearsal_harness_sha:
        description: SHA-256 fingerprint of the exact-image rehearsal workflow and scripts
        value: ${{ jobs.verify-worker-image.outputs.rehearsal_harness_sha }}

permissions:
  contents: read
  packages: read

jobs:
  verify-worker-image:
    name: Exercise exact compatible worker image on disposable services
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      cold_sandbox_image: ${{ steps.cold-sandbox.outputs.sandbox_image }}
      rehearsal_harness_sha: ${{ steps.harness.outputs.sha }}
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lyrashield
          POSTGRES_PASSWORD: lyrashield
          POSTGRES_DB: lyrashield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lyrashield -d lyrashield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.product_source_sha }}
      EXPECTED_ENGINE_REVISION: ${{ inputs.engine_revision }}
      WORKER_IMAGE: ${{ inputs.worker_image }}
      LYRASHIELD_TEST_DB_DISPOSABLE: "1"
      DATABASE_URL: postgresql://lyrashield:lyrashield@localhost:5432/lyrashield?schema=public
      DATABASE_DIRECT_URL: postgresql://lyrashield:lyrashield@localhost:5432/lyrashield?schema=public
      DATABASE_SYSTEM_URL: postgresql://lyrashield:lyrashield@localhost:5432/lyrashield?schema=public
      SHADOW_DATABASE_URL: postgresql://lyrashield:lyrashield@localhost:5432/lyrashield_shadow?schema=public
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: dummy-ci-only-secret-not-a-real-credential-32chars
      BETTER_AUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      PLATFORM_ADMIN_EMAILS: ecryptoguru@gmail.com,ankit@lyrashieldai.com
    steps:
      - name: Checkout exact worker source and schema revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.product_source_sha }}
          path: product
          persist-credentials: false

      - name: Checkout disposable smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Confirm smoke harness source
        working-directory: harness
        env:
          HARNESS_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HARNESS_SHA"

      - name: Fingerprint exact-image rehearsal harness
        id: harness
        working-directory: harness
        run: echo "sha=$(node .github/scripts/worker-image-rehearsal-harness-sha.mjs)" >> "$GITHUB_OUTPUT"

      - name: Validate immutable worker source and digest inputs
        env:
          PRODUCT_SOURCE_SHA: ${{ inputs.product_source_sha }}
          ENGINE_REVISION: ${{ inputs.engine_revision }}
          WORKER_IMAGE: ${{ inputs.worker_image }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRODUCT_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ENGINE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          canonical_worker_image="$(bash harness/.github/scripts/normalize-worker-image-reference.sh \
            "$WORKER_IMAGE" "$GITHUB_REPOSITORY")"
          echo "CANONICAL_WORKER_IMAGE=$canonical_worker_image" >> "$GITHUB_ENV"

      - name: Verify the worker image source matches its OCI provenance
        working-directory: product
        shell: bash
        env:
          BASE_SHA: ${{ inputs.product_source_sha }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.2.0
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: product/pnpm-lock.yaml

      - name: Install locked dependencies and generate the matching Prisma client
        working-directory: product
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate

      - name: Apply current migrations to disposable PostgreSQL
        working-directory: product
        run: pnpm --filter @lyrashield/db migrate:deploy

      - name: Verify held-recovery schema against isolated disposable PostgreSQL
        working-directory: product
        env:
          WEBHOOK_RECOVERY_SCHEMA_POSTGRES_URL: postgresql://lyrashield:lyrashield@127.0.0.1:5432/lyrashield
        run: node --test .github/scripts/tests/webhook-cutover-schema.postgres.test.mjs

      - name: Verify exact admission release Lua against disposable Redis
        working-directory: product
        env:
          WEBHOOK_RECOVERY_RELEASE_REDIS_URL: redis://127.0.0.1:6379/0
        run: node --test .github/scripts/tests/webhook-cutover-release.redis.test.mjs

      - name: Create restricted disposable worker role
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$POSTGRES_CONTAINER" psql -X -U lyrashield -d lyrashield -v ON_ERROR_STOP=1 \
            < harness/.github/scripts/disposable-worker-rehearsal-role.sql

      - name: Authenticate to GHCR for read-only digest pull
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull and verify the exact worker image provenance
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$CANONICAL_WORKER_IMAGE"
          repo_digests="$(docker image inspect "$CANONICAL_WORKER_IMAGE" --format '{{join .RepoDigests "\n"}}')"
          grep -Fxq "$CANONICAL_WORKER_IMAGE" <<<"$repo_digests"
          bash apps/worker/scripts/verify-worker-image.sh \
            "$CANONICAL_WORKER_IMAGE" "$EXPECTED_SOURCE_SHA" "$EXPECTED_ENGINE_REVISION"

      - name: Prepare pinned GitHub attestation verifier on the disposable runner
        if: inputs.cold_release == true
        working-directory: product
        run: bash .github/scripts/prepare-qualification-verifier.sh
      - name: Reauthenticate immutable sandbox publication and native inventory
        if: inputs.cold_release == true
        id: cold-sandbox
        working-directory: product/apps/worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --import tsx ../../.github/scripts/verify-cold-sandbox.mjs
          sudo chown root:root "$RUNNER_TEMP/cold-sandbox" "$RUNNER_TEMP/cold-sandbox/verification.json" "$RUNNER_TEMP/cold-sandbox/expected.json"
          sudo chmod 0555 "$RUNNER_TEMP/cold-sandbox"
      - name: Prove external systemd cold recovery without production resources
        if: inputs.cold_release == true
        working-directory: product
        env:
          LYRASHIELD_RUN_ISOLATED_SYSTEMD_PROOF: "1"
        run: node .github/scripts/tests/worker-recovery.systemd.mjs
      - name: Prove recovery preserves original PostgreSQL epoch and paid holds
        if: inputs.cold_release == true
        working-directory: product
        env:
          LYRASHIELD_RUN_WORKER_RECOVERY_POSTGRES_PROOF: "1"
        run: node .github/scripts/tests/worker-auto-recovery.postgres.mjs
      - name: Checkout pinned engine for native installed-SDK probes
        if: inputs.cold_release == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/lyrashield-engine
          ref: ${{ inputs.engine_revision }}
          path: cold-engine
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python for cold native probes
        if: inputs.cold_release == true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Exercise actual installed engine SDK over native TCP and SIGKILL
        if: inputs.cold_release == true
        working-directory: harness
        env:
          HARNESS_SHA: ${{ github.sha }}
        run: |
          python3.12 .github/scripts/run-cold-engine-native-probes.py \
            --candidate "$CANONICAL_WORKER_IMAGE" "$EXPECTED_SOURCE_SHA" \
            --engine-repo "$GITHUB_WORKSPACE/cold-engine" --harness-sha "$HARNESS_SHA" \
            --receipt "$RUNNER_TEMP/cold-native-probe-receipt.json"
      - name: Exercise actual sandbox credentials and live network denial
        if: inputs.cold_release == true
        working-directory: harness
        env:
          HARNESS_SHA: ${{ github.sha }}
          SANDBOX_IMAGE: ${{ steps.cold-sandbox.outputs.sandbox_image }}
        run: |
          python3.12 .github/scripts/run-cold-engine-native-probes.py \
            --candidate "$CANONICAL_WORKER_IMAGE" "$EXPECTED_SOURCE_SHA" \
            --engine-repo "$GITHUB_WORKSPACE/cold-engine" --harness-sha "$HARNESS_SHA" \
            --sandbox-image "$SANDBOX_IMAGE" --docker-socket /var/run/docker.sock \
            --receipt "$RUNNER_TEMP/cold-sandbox-native-receipt.json"
      - name: Prove funded admission survives actual worker SIGKILL and queue redelivery
        if: inputs.cold_release == true
        working-directory: product
        run: |
          docker pull postgres@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
          docker pull redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          bash .github/scripts/run-cold-paid-claim-image-probe.sh \
            --candidate "$CANONICAL_WORKER_IMAGE" "$EXPECTED_SOURCE_SHA" "$EXPECTED_ENGINE_REVISION" \
            --receipt "$RUNNER_TEMP/cold-paid-claim-image-receipt.json"
      - name: Retain actual native probe evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && inputs.cold_release == true
        with:
          name: cold-native-probes-${{ inputs.product_source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cold-native-probe-receipt.json
            ${{ runner.temp }}/cold-sandbox-native-receipt.json
            ${{ runner.temp }}/cold-sandbox-publication.json
            ${{ runner.temp }}/cold-paid-claim-image-receipt.json
            ${{ runner.temp }}/cold-sandbox/verification.json
            ${{ runner.temp }}/cold-sandbox/expected.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify runtime and system TLS using the exact worker image
        working-directory: product
        env:
          POSTGRES_IMAGE: postgres:16-alpine
        run: WORKER_IMAGE="$CANONICAL_WORKER_IMAGE" node .github/scripts/tests/supabase-db-tls.docker.mjs

      - name: Run actual retry code from the worker image against disposable Postgres and Redis
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          set -euo pipefail
          network="webhook-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker network create "$network" >/dev/null
          docker network connect --alias postgres "$network" "$POSTGRES_CONTAINER"
          docker network connect --alias redis "$network" "$REDIS_CONTAINER"
          cp harness/.github/scripts/webhook-track-image-smoke.mjs "$RUNNER_TEMP/webhook-track-image-smoke.mjs"
          chmod 0444 "$RUNNER_TEMP/webhook-track-image-smoke.mjs"
          docker run --rm \
            --network "$network" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --cpus 2 --memory 2g --pids-limit 256 \
            --mount "type=bind,src=$RUNNER_TEMP/webhook-track-image-smoke.mjs,dst=/app/apps/worker/.ci-webhook-track-image-smoke.mjs,readonly" \
            --workdir /app/apps/worker \
            --entrypoint /app/apps/worker/node_modules/.bin/tsx \
            --env NODE_ENV=test \
            --env LYRASHIELD_TEST_DB_DISPOSABLE=1 \
            --env "DATABASE_URL=postgresql://app_runtime_ci:runtime-ci-only@postgres:5432/lyrashield?schema=public" \
            --env "DATABASE_DIRECT_URL=postgresql://lyrashield:lyrashield@postgres:5432/lyrashield?schema=public" \
            --env "DATABASE_SYSTEM_URL=postgresql://lyrashield:lyrashield@postgres:5432/lyrashield?schema=public" \
            --env REDIS_URL=redis://redis:6379 \
            --env 'POLAR_PRODUCT_IDS={"pro_monthly":"fixture-worker-smoke-pro-monthly"}' \
            --env POLAR_LOCAL_PRODUCT_IDS= \
            --env BETTER_AUTH_SECRET=dummy-ci-only-secret-not-a-real-credential-32chars \
            --env BETTER_AUTH_URL=http://127.0.0.1:3100 \
            --env NEXT_PUBLIC_APP_URL=http://127.0.0.1:3100 \
            --env PLATFORM_ADMIN_EMAILS=ecryptoguru@gmail.com,ankit@lyrashieldai.com \
            "$CANONICAL_WORKER_IMAGE" .ci-webhook-track-image-smoke.mjs
          {
            echo "## Exact worker image rehearsal passed"
            echo
            echo "- Image: \`$CANONICAL_WORKER_IMAGE\`"
            echo "- Product source: \`$EXPECTED_SOURCE_SHA\`"
            echo "- Engine revision: \`$EXPECTED_ENGINE_REVISION\`"
            echo "- Coverage: actual webhook retry and due-recovery code on disposable PostgreSQL and Redis."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Boot the exact worker image to readiness with production startup checks
        shell: bash
        run: |
          set -euo pipefail
          network="webhook-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="webhook-startup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          daemon="webhook-startup-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          socket_volume="webhook-startup-docker-socket-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create --label "lyrashield.startup-owner=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" "$socket_volume" >/dev/null
          cleanup_startup() {
            status=$?
            docker rm -f "$container" >/dev/null 2>&1 || true
            if ! docker rm -f "$daemon" >/dev/null 2>&1; then status=1; fi
            if [ -n "$(docker ps -aq --filter "name=^/$daemon$")" ]; then status=1; fi
            [ "$status" -ne 0 ] || docker volume rm "$socket_volume" >/dev/null
            exit "$status"
          }
          trap cleanup_startup EXIT
          # The startup gate observes a real invocation-owned nested daemon.
          # It has no host Docker socket, TCP listener or external network.
          docker run --detach --name "$daemon" --privileged --network none \
            --label "lyrashield.startup-owner=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --env DOCKER_TLS_CERTDIR= \
            --mount "type=volume,src=$socket_volume,dst=/cold" \
            --entrypoint dockerd \
            docker.io/library/docker@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121 \
            --host=unix:///cold/docker.sock --pidfile=/cold/dockerd.pid --shutdown-timeout=5 >/dev/null
          daemon_ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$daemon" docker --host unix:///cold/docker.sock info >/dev/null 2>&1; then daemon_ready=true; break; fi
            [ "$(docker inspect "$daemon" --format '{{.State.Running}}')" = true ] || break
            sleep 1
          done
          [ "$daemon_ready" = true ]
          [ -z "$(docker exec "$daemon" docker --host unix:///cold/docker.sock container ls --all --quiet)" ]
          socket_group=$(docker exec "$daemon" stat -c '%g' /cold/docker.sock)
          cold_flags=(--mount "type=volume,src=$socket_volume,dst=/cold"
            --group-add "$socket_group" --env DOCKER_HOST=unix:///cold/docker.sock)
          if [ "${{ inputs.cold_release }}" = true ]; then
            epoch=$(docker run --rm --network "$network" --entrypoint node --workdir /app/apps/worker \
              --env NODE_ENV=test --env LYRASHIELD_TEST_DB_DISPOSABLE=1 \
              --env 'DATABASE_URL=postgresql://app_runtime_ci:runtime-ci-only@postgres:5432/lyrashield?schema=public' \
              --env REDIS_URL=redis://redis:6379 \
              --env BETTER_AUTH_SECRET=dummy-ci-only-secret-not-a-real-credential-32chars \
              --env BETTER_AUTH_URL=http://127.0.0.1:3100 --env NEXT_PUBLIC_APP_URL=http://127.0.0.1:3100 \
              "$CANONICAL_WORKER_IMAGE" --import tsx --input-type=module -e 'const {captureColdDatabaseEpoch}=await import("./src/operations/capture-cold-database-epoch.ts");console.log(await captureColdDatabaseEpoch());')
            [[ "$epoch" =~ ^[a-f0-9]{64}$ ]]
            cold_flags+=(--mount "type=bind,src=$RUNNER_TEMP/cold-sandbox,dst=/etc/lyrashield/cold-sandbox,readonly"
              --env LYRASHIELD_COLD_SINGLE_WORKER=1 --env "LYRASHIELD_COLD_DATABASE_EPOCH_SHA256=$epoch"
              --env "LYRASHIELD_IMAGE=${{ steps.cold-sandbox.outputs.sandbox_image }}"
              --env LYRASHIELD_SANDBOX_SBOM_COVERAGE_VERIFY_PATH=/etc/lyrashield/cold-sandbox/verification.json
              --env LYRASHIELD_SANDBOX_SBOM_COVERAGE_EXPECTED_PATH=/etc/lyrashield/cold-sandbox/expected.json
              --env LYRASHIELD_SANDBOX_SBOM_COVERAGE_REPO=ecryptoguru/lyrashield-engine
              --env LYRASHIELD_SANDBOX_SBOM_COVERAGE_REF=refs/heads/main
              --env "LYRASHIELD_SANDBOX_SBOM_COVERAGE_ENGINE_REVISION=$EXPECTED_ENGINE_REVISION"
              --env "LYRASHIELD_SANDBOX_SBOM_COVERAGE_WORKFLOW_REVISION=$(node -p 'require("./product/.github/cold-sandbox-publication.json").publicationRevision')"
              --env "LYRASHIELD_SANDBOX_SBOM_COVERAGE_RUN_ID=$(node -p 'require("./product/.github/cold-sandbox-publication.json").publishRunId')"
              --env "LYRASHIELD_SANDBOX_SBOM_COVERAGE_RUN_ATTEMPT=$(node -p 'require("./product/.github/cold-sandbox-publication.json").publishAttempt')")
          fi
          docker run --detach \
            --name "$container" \
            --network "$network" \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 3g --pids-limit 768 \
            --env NODE_ENV=production \
            --env TRUSTED_PROXY_IP_HEADER=x-forwarded-for \
            --env IP_HASH_SALT=synthetic-ci-only-ip-hash-salt-32chars \
            --env BREVO_API_KEY=synthetic-ci-only-mail-provider-key \
            --env LYRASHIELD_WORKER_CONCURRENCY=1 \
            --env "LYRASHIELD_PRODUCT_REVISION=$EXPECTED_SOURCE_SHA" \
            --env "LYRASHIELD_ENGINE_REVISION=$EXPECTED_ENGINE_REVISION" \
            --env "LYRASHIELD_WORKER_IMAGE_DIGEST=${CANONICAL_WORKER_IMAGE##*@}" \
            --env "DATABASE_URL=postgresql://app_runtime_ci:runtime-ci-only@postgres:5432/lyrashield?schema=public" \
            --env "DATABASE_SYSTEM_URL=postgresql://lyrashield:lyrashield@postgres:5432/lyrashield?schema=public" \
            --env REDIS_URL=redis://redis:6379 \
            --env BETTER_AUTH_SECRET=dummy-ci-only-secret-not-a-real-credential-32chars \
            --env BETTER_AUTH_URL=http://127.0.0.1:3100 \
            --env NEXT_PUBLIC_APP_URL=http://127.0.0.1:3100 \
            --env PLATFORM_ADMIN_EMAILS=ecryptoguru@gmail.com,ankit@lyrashieldai.com \
            --env LYRASHIELD_LUNA_LLM=gpt-6-luna \
            --env LYRASHIELD_SOL_LLM=gpt-6-sol \
            --env AZURE_AI_API_KEY=synthetic-ci-only \
            --env LYRASHIELD_ALLOW_LOCAL_SANDBOX_HOST=1 \
            --env "LYRASHIELD_ENGINE_SANDBOX_NETWORK=$network" \
            --env "LYRASHIELD_IMAGE=ghcr.io/ecryptoguru/lyrashield-sandbox@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            --env LYRASHIELD_ENGINE_WORK_ROOT=/tmp \
            --env TMPDIR=/tmp \
            --env S3_ENDPOINT=https://storage.example.invalid \
            --env S3_BUCKET=synthetic-ci-bucket \
            --env S3_ACCESS_KEY=synthetic-ci-access \
            --env S3_SECRET_KEY=synthetic-ci-secret \
            --env LYRASHIELD_EVIDENCE_KEK=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --env 'LYRASHIELD_EVIDENCE_KEK_KEYRING={}' \
            "${cold_flags[@]}" "$CANONICAL_WORKER_IMAGE" >/dev/null
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$container" test -f /tmp/lyrashield-worker-ready; then
              ready=true
              break
            fi
            [ "$(docker inspect "$container" --format '{{.State.Running}}')" = true ] || break
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs "$container" 2>&1 | tail -40
            echo "::error::Exact production-mode worker image did not reach readiness after ${attempt} checks on disposable services."
            exit 1
          fi
          docker stop --time 15 "$container" >/dev/null
          echo "Exact production-mode worker startup reached readiness on disposable services." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify cold database epoch failure in the exact running image
        if: inputs.cold_release == true
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          network="webhook-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="cold-epoch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          cp harness/.github/scripts/cold-database-epoch-image-probe.mjs "$RUNNER_TEMP/cold-database-epoch-image-probe.mjs"
          chmod 0444 "$RUNNER_TEMP/cold-database-epoch-image-probe.mjs"
          cold_node() {
            docker run --rm --network "$network" --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL \
              --security-opt no-new-privileges:true --cpus 2 --memory 2g --pids-limit 256 \
              --workdir /app/apps/worker --entrypoint node \
              --env NODE_ENV=test --env LYRASHIELD_TEST_DB_DISPOSABLE=1 \
              --env 'DATABASE_URL=postgresql://app_runtime_ci:runtime-ci-only@postgres:5432/lyrashield?schema=public' \
              --env 'DATABASE_SYSTEM_URL=postgresql://lyrashield:lyrashield@postgres:5432/lyrashield?schema=public' \
              --env REDIS_URL=redis://redis:6379 \
              --env BETTER_AUTH_SECRET=dummy-ci-only-secret-not-a-real-credential-32chars \
              --env BETTER_AUTH_URL=http://127.0.0.1:3100 --env NEXT_PUBLIC_APP_URL=http://127.0.0.1:3100 \
              "$CANONICAL_WORKER_IMAGE" --import tsx "$@"
          }
          epoch=$(cold_node --input-type=module -e 'const {captureColdDatabaseEpoch}=await import("./src/operations/capture-cold-database-epoch.ts");console.log(await captureColdDatabaseEpoch());')
          [[ "$epoch" =~ ^[a-f0-9]{64}$ ]]
          docker run --detach --name "$container" --network "$network" --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL \
            --security-opt no-new-privileges:true --cpus 2 --memory 2g --pids-limit 256 \
            --mount "type=bind,src=$RUNNER_TEMP/cold-database-epoch-image-probe.mjs,dst=/app/apps/worker/.ci-cold-database-epoch-image-probe.mjs,readonly" \
            --workdir /app/apps/worker --entrypoint node \
            --env NODE_ENV=test --env LYRASHIELD_TEST_DB_DISPOSABLE=1 \
            --env 'DATABASE_URL=postgresql://app_runtime_ci:runtime-ci-only@postgres:5432/lyrashield?schema=public' \
            --env 'DATABASE_SYSTEM_URL=postgresql://lyrashield:lyrashield@postgres:5432/lyrashield?schema=public' \
            --env REDIS_URL=redis://redis:6379 \
            --env BETTER_AUTH_SECRET=dummy-ci-only-secret-not-a-real-credential-32chars \
            --env BETTER_AUTH_URL=http://127.0.0.1:3100 --env NEXT_PUBLIC_APP_URL=http://127.0.0.1:3100 \
            --env LYRASHIELD_COLD_SINGLE_WORKER=1 --env "LYRASHIELD_COLD_DATABASE_EPOCH_SHA256=$epoch" \
            --env "COLD_PROBE_WORKER_IMAGE=$CANONICAL_WORKER_IMAGE" --env "COLD_PROBE_PRODUCT_REVISION=$EXPECTED_SOURCE_SHA" \
            "$CANONICAL_WORKER_IMAGE" --import tsx .ci-cold-database-epoch-image-probe.mjs >/dev/null
          ready=false
          for ((attempt = 0; attempt < 30; attempt++)); do
            if docker exec "$container" test -f /tmp/cold-epoch-await-restart; then ready=true; break; fi
            [ "$(docker inspect "$container" --format '{{.State.Running}}')" = true ] || break
            sleep 1
          done
          [ "$ready" = true ]
          docker restart "$POSTGRES_CONTAINER" >/dev/null
          for ((attempt = 0; attempt < 30; attempt++)); do
            [ "$(docker inspect "$POSTGRES_CONTAINER" --format '{{.State.Health.Status}}')" != healthy ] || break
            sleep 1
          done
          [ "$(docker inspect "$POSTGRES_CONTAINER" --format '{{.State.Health.Status}}')" = healthy ]
          docker exec "$container" touch /tmp/cold-epoch-restarted
          [ "$(timeout 120 docker wait "$container")" = 0 ]
          docker logs "$container" > "$RUNNER_TEMP/cold-database-epoch-image-receipt.json"
          docker rm "$container" >/dev/null
          trap - EXIT
      - name: Retain actual database epoch restart evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && inputs.cold_release == true
        with:
          name: cold-database-epoch-${{ inputs.product_source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cold-database-epoch-image-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove disposable service network
        if: always()
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          network="webhook-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker network inspect "$network" >/dev/null 2>&1; then
            docker network disconnect "$network" "$POSTGRES_CONTAINER" || true
            docker network disconnect "$network" "$REDIS_CONTAINER" || true
            docker network rm "$network"
          fi
