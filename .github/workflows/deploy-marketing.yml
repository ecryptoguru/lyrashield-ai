name: Deploy marketing

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marketing-production
  cancel-in-progress: false

jobs:
  source:
    name: Check current marketing source
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.source.outputs.current }}
    steps:
      - name: Skip superseded source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$SOURCE_SHA" = "$latest_main" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-marketing:
    name: Deploy Marketing to Cloudflare
    needs: source
    if: needs.source.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-production
      url: https://lyrashieldai.com
    steps:
      # Routing compares the current source with Cloudflare's exact homepage
      # revision marker, so a later docs-only push still carries any earlier
      # undeployed marketing or shared changes into CI and deployment routing.
      # App-only changes do not affect the marketing Worker. Unknown production
      # baselines fail closed to full validation and both release routes.
      # The smoke step below is what actually proves the deploy landed.
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          # Every workflow runs pnpm install as an explicit step; the
          # successor action's install default is true, so opt out.
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production marketing Worker
        env:
          PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PUBLIC_PROJECT_KEY }}
          LYRASHIELD_MARKETING_REVISION: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$PUBLIC_POSTHOG_KEY" =~ ^phc_[A-Za-z0-9]+$ ]]; then
            echo "::error::POSTHOG_PUBLIC_PROJECT_KEY is missing or malformed."
            exit 1
          fi
          pnpm --filter @lyrashield/marketing build

      - name: Verify generated marketing revision
        env:
          EXPECTED_REVISION: ${{ inputs.source_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs"

          const expected = process.env.EXPECTED_REVISION
          if (!/^[0-9a-f]{40}$/.test(expected ?? "")) {
            throw new Error("EXPECTED_REVISION must be a full Git SHA")
          }

          const html = readFileSync("apps/marketing/dist/client/index.html", "utf8")
          const marker = `<meta name="lyrashield-build-revision" content="${expected}">`
          if (!html.includes(marker)) {
            throw new Error("Generated marketing homepage is missing the exact build revision")
          }

          const worker = JSON.parse(
            readFileSync("apps/marketing/dist/server/wrangler.json", "utf8")
          )
          if (worker.assets?.directory !== "../client") {
            throw new Error("Generated Cloudflare Worker does not serve the verified client artifact")
          }
          console.log(`Generated marketing artifact serves revision ${expected}`)
          NODE

      - name: Apply D1 migrations and deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/marketing
          # VULN-H-002: no wranglerVersion — the action uses the wrangler
          # resolved by pnpm-lock.yaml (4.125.0), which the frozen lockfile
          # and minimumReleaseAge already vet. A floating major would hand
          # the production Cloudflare token to whatever 4.x is newest.
          command: |
            d1 migrations apply lyrashield-marketing-waitlist --remote --config dist/server/wrangler.json
            deploy --config dist/server/wrangler.json

      - name: Smoke production routes
        shell: bash
        run: |
          for path in / /methodology /tools /robots.txt /sitemap-index.xml /llms.txt; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              "https://lyrashieldai.com${path}" > /dev/null
          done
          curl --silent --show-error --retry 5 --retry-all-errors \
            "https://lyrashieldai.com/api/waitlist/position?code=INVALID" \
            --output /dev/null --write-out '%{http_code}' | grep --quiet '^404$'
          curl --silent --show-error --head "https://www.lyrashieldai.com/tools?source=ci" \
            | grep --ignore-case --quiet '^location: https://lyrashieldai.com/tools?source=ci'

      - name: Assert the live homepage is the build we just shipped
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          # A 200 cannot detect a stale deploy — the previous smoke step passed happily for
          # hours against an old build. These assert markers that only exist in the current
          # homepage, so a skipped, failed, or cache-pinned deploy fails the run instead.
          #
          # If you intentionally change or remove either element, update the marker here in
          # the same commit. A failure means the live site is not serving this commit.
          #
          # Retried with backoff: a wrangler deploy that itself succeeds can take a short
          # window to propagate across Cloudflare's edge, and the very first check here once
          # failed one second after a deploy that had already reported success. A
          # cache-busting query param avoids being served a stale edge-cached response during
          # that window.
          markers=(
            'data-cta-id="premium-hero-lite-check"'
            'data-cta-id="story-report-create-account"'
          )

          for attempt in $(seq 1 8); do
            homepage="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "https://lyrashieldai.com/?cachebust=${SOURCE_SHA}-${attempt}")"
            live_revision="$(printf '%s' "$homepage" | sed -n 's/.*<meta name="lyrashield-build-revision" content="\([0-9a-f]\{40\}\)".*/\1/p' | head -n 1)"

            if [ "$live_revision" = "$SOURCE_SHA" ]; then
              missing=""
              for marker in "${markers[@]}"; do
                if ! printf '%s' "$homepage" | grep --quiet --fixed-strings "$marker"; then
                  missing="$marker"
                  break
                fi
              done

              if [ -z "$missing" ]; then
                echo "Live homepage serves revision ${SOURCE_SHA} with expected feature markers (attempt ${attempt})."
                exit 0
              fi
            fi

            echo "Attempt ${attempt}: live revision '${live_revision:-missing}', expected '${SOURCE_SHA}', missing marker '${missing:-none}'; retrying in 15s..."
            sleep 15
          done

          echo "::error::Live homepage did not serve revision '${SOURCE_SHA}' with all expected markers after 8 attempts."
          exit 1

      - name: Submit the live sitemap to IndexNow
        continue-on-error: true
        shell: bash
        run: |
          # Bing's index backs Microsoft Copilot answers, so this is the one
          # discovery signal that is fully in-repo. The script never exits
          # non-zero on a network or provider failure; continue-on-error keeps
          # a discovery hint from ever failing a release.
          node apps/marketing/scripts/indexnow.mjs --origin https://lyrashieldai.com
