name: Configure Cloud billing admission

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Joint Polar and Razorpay Cloud admission mode
        required: true
        type: choice
        options: ["off", canary, public]
      canary_workspace_ids:
        description: Comma-separated workspace IDs; required only for canary
        required: false
        type: string
      source_sha:
        description: Exact deployed product SHA
        required: true
        type: string
      web_image_digest:
        description: Exact deployed web image reference with digest
        required: true
        type: string

concurrency:
  # Same group family as deploy-azure's production deploy: a canary admission
  # configure and a production deploy both assume they are the sole writer of
  # container-app traffic weights (each sets its revision to 100). Running
  # them concurrently can interleave and leave traffic split. Grouped so they
  # queue against each other.
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # v16 4.3: production Azure login moved from the long-lived
    # AZURE_CREDENTIALS secret to federated OIDC (same as deploy-azure and
    # the desktop release). No client secret is stored.
    permissions:
      contents: read
      id-token: write
    environment: azure-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_DEPLOY_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --yes --only-show-errors
      - name: Apply joint Cloud admission without rebuilding
        env:
          GH_TOKEN: ${{ secrets.ADMISSION_CONFIG_TOKEN }}
          CLOUD_BILLING_MODE: ${{ inputs.mode }}
          BILLING_CANARY_WORKSPACE_IDS: ${{ inputs.canary_workspace_ids }}
          DEPLOY_SHA: ${{ inputs.source_sha }}
          WEB_IMAGE_DIGEST: ${{ inputs.web_image_digest }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_CONTAINER_APP_NAME: ${{ vars.AZURE_APP_CONTAINER_APP_NAME }}
        run: bash .github/scripts/configure-cloud-billing-admission.sh
