name: Regenerate pnpm lockfile

# Manual, opt-in utility: regenerate pnpm-lock.yaml on a branch and commit it
# back. Used when a dependency override or version change needs the lockfile
# refreshed but the change was authored without local npm access. Never runs
# automatically on push/PR — only via workflow_dispatch with an explicit branch.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to regenerate the lockfile on"
        required: true
        type: string

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate pnpm-lock.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile if it changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "lyrashield-bot"
          git config user.email "bot@lyrashield.local"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): regenerate pnpm-lock.yaml"
          git push
