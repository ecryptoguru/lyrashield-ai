name: Webhook empty-state migration rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/webhook-empty-state-rehearsal.yml"
      - "packages/db/package.json"
      - "packages/db/prisma/migrations/20261002120000_webhook_track_due_db_default/migration.sql"
      - "packages/db/prisma/migrations/20261002130000_webhook_track_utc_schedule/migration.sql"
      - "packages/db/prisma/migrations/20261002130100_webhook_track_utc_schedule_index/migration.sql"
      - "packages/db/prisma/migrations/20261002130200_webhook_track_operator_recovery/migration.sql"
      - "packages/db/scripts/webhook-empty-state-*.mjs"
      - "packages/db/scripts/webhook-backup-connection.mjs"
      - "ops/worker/webhook-empty-state-*.mjs"
      - "ops/worker/tests.webhook-empty-state*.test.mjs"
      - "ops/worker/Dockerfile.empty-state-rehearsal"
      - "lint/webhook-empty-state.config.mjs"
      - "ops/worker/rehearse-webhook-empty-state-trusted-v2.sh"
      - "packages/integrations/src/queue.ts"
      - "packages/integrations/src/index.ts"
      - "packages/db/scripts/tests/webhook-empty-state-*.mjs"
      - ".github/scripts/*webhook-empty-state*.mjs"
      - ".github/workflows/webhook-empty-state-*.yml"

permissions:
  contents: read

jobs:
  postgres-17:
    name: Disposable PostgreSQL 17 and Prisma 7.9 rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rehearsal-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LYRASHIELD_TEST_DB_DISPOSABLE: "1"
      DATABASE_DIRECT_URL: postgresql://postgres:rehearsal-only@127.0.0.1:5432/postgres?schema=public
      DATABASE_URL: postgresql://postgres:rehearsal-only@127.0.0.1:5432/postgres?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact Prisma CLI version
        shell: bash
        run: |
          set -euo pipefail
          version="$(pnpm --filter @lyrashield/db exec prisma --version)"
          printf '%s\n' "$version"
          grep -Eq '^prisma[[:space:]]*:[[:space:]]*7\.9\.1$' <<< "$version"

      - name: Run empty-state migration contract tests
        run: >-
          node --test packages/db/scripts/tests/webhook-empty-state-migration.contract.mjs
          packages/db/scripts/tests/webhook-empty-state-*.test.mjs
          ops/worker/tests.webhook-empty-state*.test.mjs

      - name: Check references in every privileged adapter branch
        run: >-
          pnpm exec eslint --no-config-lookup --config lint/webhook-empty-state.config.mjs
          ops/worker/webhook-empty-state-*.mjs packages/db/scripts/webhook-empty-state-*.mjs

      - name: Verify genuine public Actions fixture with default official trust roots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fixture_base=https://raw.githubusercontent.com/cli/cli/v2.95.0/pkg/cmd/attestation/test/data
          curl --fail --silent --show-error --retry 3 "$fixture_base/reusable-workflow-artifact" -o "$RUNNER_TEMP/public-artifact"
          curl --fail --silent --show-error --retry 3 "$fixture_base/reusable-workflow-attestation.sigstore.json" -o "$RUNNER_TEMP/public-bundle.json"
          echo "49a3aa6075e0f49f82843e74b5baa614ad2a588e6675612bf108a0a008c5ac25  $RUNNER_TEMP/public-artifact" | sha256sum --check
          echo "88e35c3496fc9b9bd29629b69271bd32738e170f0d85a12d67da0c72c743f3bd  $RUNNER_TEMP/public-bundle.json" | sha256sum --check
          gh version
          gh attestation verify "$RUNNER_TEMP/public-artifact" --bundle "$RUNNER_TEMP/public-bundle.json" \
            --repo malancas/attest-demo \
            --signer-workflow github/artifact-attestations-workflows/.github/workflows/attest.yml \
            --signer-digest 09b495c3f12c7881b3cc17209a327792065c1a1d \
            --source-digest 95baf27389e83e6a5c48f42e190d48d7abcea19e --source-ref refs/heads/main \
            --cert-oidc-issuer https://token.actions.githubusercontent.com --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/public-verified.json"

      - name: Rehearse fresh empty-state migration and completed retry
        run: node packages/db/scripts/tests/webhook-empty-state-postgres-rehearsal.mjs

      - name: Build disposable trusted-v2 runtime
        run: docker build -f ops/worker/Dockerfile.empty-state-rehearsal -t lyra-disposable-trusted-v2:local .

      - name: Rehearse enabled copied trusted-v2 with actual PostgreSQL and Prisma
        run: bash ops/worker/rehearse-webhook-empty-state-trusted-v2.sh
