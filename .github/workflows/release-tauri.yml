name: Release Desktop (Tauri)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semver tag to build (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ENGINE_REVISION: bbc5e25008fd0a9c620f77ebff4979799a59e339
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Verify release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify secrets, tag, and version
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            WINDOWS_CERTIFICATE_PFX WINDOWS_CERTIFICATE_PASSWORD \
            TAURI_UPDATER_PRIVATE_KEY TAURI_UPDATER_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required Desktop release secret $name is missing"
              exit 1
            fi
          done
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be semver with a v prefix: $RELEASE_TAG"
            exit 1
          fi
          test -n "$(git tag --points-at HEAD --list "$RELEASE_TAG")" || {
            echo "::error::$RELEASE_TAG does not point at the checked-out commit"
            exit 1
          }
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          test "v$version" = "$RELEASE_TAG" || {
            echo "::error::Desktop version $version does not match $RELEASE_TAG"
            exit 1
          }

  macos:
    name: macOS ${{ matrix.arch }} signed package
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Checkout pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/lyrashield-engine
          ref: ${{ env.ENGINE_REVISION }}
          fetch-depth: 0
          path: lyrashield-engine
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Verify engine revision provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/verify-engine-revision.sh \
            lyrashield-engine "$ENGINE_REVISION" \
            "${{ github.repository_owner }}/lyrashield-engine"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-22
        with:
          targets: ${{ matrix.target }}

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build version-matched engine sidecar
        working-directory: lyrashield-engine
        run: |
          set -euo pipefail
          bash scripts/build.sh
          mkdir -p ../apps/desktop/src-tauri/binaries
          cp dist/strix "../apps/desktop/src-tauri/binaries/lyrashield-engine-${{ matrix.target }}"
          chmod +x "../apps/desktop/src-tauri/binaries/lyrashield-engine-${{ matrix.target }}"

      - name: Build Desktop frontend
        run: pnpm --filter @lyrashield/desktop-frontend build

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          EXPECTED_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          certificate_file="$(mktemp /tmp/lyrashield-certificate.XXXXXX.p12)"
          keychain_file="$(mktemp /tmp/lyrashield-keychain.XXXXXX.keychain-db)"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$certificate_file"
          security create-keychain -p "$keychain_password" "$keychain_file"
          security set-keychain-settings -lut 21600 "$keychain_file"
          security unlock-keychain -p "$keychain_password" "$keychain_file"
          security import "$certificate_file" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_file"
          security set-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_file"
          security list-keychains -d user -s "$keychain_file"
          security find-identity -v -p codesigning "$keychain_file" | grep -F "$EXPECTED_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$EXPECTED_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          args: --target ${{ matrix.target }} --bundles app,dmg --config tauri.release.conf.json

      - name: Verify signed and stapled app
        run: |
          set -euo pipefail
          app="$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle" -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"

      - name: Give macOS assets architecture-specific names
        env:
          BUNDLE_DIR: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          rename_one() {
            pattern="$1"
            suffix="$2"
            signed="$3"
            count="$(find "$BUNDLE_DIR" -type f -name "$pattern" | wc -l | tr -d ' ')"
            test "$count" = 1 || {
              echo "::error::Expected exactly one $pattern, found $count"
              exit 1
            }
            source="$(find "$BUNDLE_DIR" -type f -name "$pattern" -print -quit)"
            destination="${source%"$suffix"}-${ARCH}${suffix}"
            mv "$source" "$destination"
            if [ "$signed" = true ]; then
              test -s "$source.sig"
              mv "$source.sig" "$destination.sig"
            fi
          }
          rename_one '*.dmg' '.dmg' false
          rename_one '*.app.tar.gz' '.app.tar.gz' true

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lyrashield-desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz.sig
          if-no-files-found: error

  windows:
    name: Windows x86_64 signed package
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Checkout pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/lyrashield-engine
          ref: ${{ env.ENGINE_REVISION }}
          fetch-depth: 0
          path: lyrashield-engine
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Verify engine revision provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/verify-engine-revision.sh \
            lyrashield-engine "$ENGINE_REVISION" \
            "${{ github.repository_owner }}/lyrashield-engine"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-22

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build version-matched engine sidecar
        shell: bash
        working-directory: lyrashield-engine
        run: |
          set -euo pipefail
          bash scripts/build.sh
          mkdir -p ../apps/desktop/src-tauri/binaries
          cp dist/strix.exe ../apps/desktop/src-tauri/binaries/lyrashield-engine-x86_64-pc-windows-msvc.exe

      - name: Build Desktop frontend
        run: pnpm --filter @lyrashield/desktop-frontend build

      - name: Import Windows signing certificate
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = [System.IO.Path]::GetTempFileName() + ".pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.HasPrivateKey) { throw "Imported Windows signing certificate has no private key." }
          $config = Get-Content apps/desktop/src-tauri/tauri.release.conf.json | ConvertFrom-Json -AsHashtable
          $config.bundle.windows = @{
            certificateThumbprint = $certificate.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          }
          $config | ConvertTo-Json -Depth 4 | Set-Content apps/desktop/src-tauri/tauri.windows.conf.json

      - name: Build and sign Windows installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          args: --bundles nsis --config tauri.windows.conf.json

      - name: Verify Windows installer signature
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer was built." }
          signtool verify /pa /v $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Windows installer signature verification failed." }

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lyrashield-desktop-windows-x86_64
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.exe.sig
          if-no-files-found: error

  publish-draft:
    name: Assemble signed draft release
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Assemble updater manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import urllib.parse

          root = pathlib.Path("artifacts")

          def signed_pair(directory, suffix):
              files = sorted((root / directory).rglob("*"))
              artifacts = [path for path in files if path.is_file() and path.name.endswith(suffix)]
              signatures = [path for path in files if path.is_file() and path.name.endswith(suffix + ".sig")]
              if len(artifacts) != 1 or len(signatures) != 1:
                  raise SystemExit(f"expected one signed {suffix} in {directory}")
              signature = signatures[0].read_text(encoding="utf-8").strip()
              if not signature:
                  raise SystemExit(f"empty updater signature for {artifacts[0].name}")
              return artifacts[0], signature

          mac_arm = signed_pair("lyrashield-desktop-macos-aarch64", ".app.tar.gz")
          mac_x64 = signed_pair("lyrashield-desktop-macos-x86_64", ".app.tar.gz")
          windows = signed_pair("lyrashield-desktop-windows-x86_64", "-setup.exe")
          tag = os.environ["RELEASE_TAG"]
          base = f"https://github.com/ecryptoguru/lyrashield-ai/releases/download/{tag}"

          def entry(pair):
              artifact, signature = pair
              return {
                  "signature": signature,
                  "url": f"{base}/{urllib.parse.quote(artifact.name)}",
              }

          manifest = {
              "version": tag.removeprefix("v"),
              "notes": f"LyraShield Local {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": {
                  "darwin-aarch64": entry(mac_arm),
                  "darwin-x86_64": entry(mac_x64),
                  "windows-x86_64": entry(windows),
              },
          }
          pathlib.Path("latest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY

      - name: Create signed draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/**/*-setup.exe
            artifacts/**/*-setup.exe.sig
            latest.json
