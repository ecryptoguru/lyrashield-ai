name: Release Desktop (Tauri)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  ENGINE_REVISION: "1f911b6aa0ad5ea78db80dfaa1ec7cf1e56619f0"

jobs:
  build-macos:
    name: macOS Universal (DMG + app)
    runs-on: macos-14
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout engine (pinned revision)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ecryptoguru/lyrashield-engine
          ref: ${{ env.ENGINE_REVISION }}
          path: lyrashield-engine

      - name: Verify engine revision immutability
        run: |
          cd lyrashield-engine
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "${{ env.ENGINE_REVISION }}" ]; then
            echo "::error::Engine revision mismatch: expected ${{ env.ENGINE_REVISION }}, got $ACTUAL"
            exit 1
          fi
          echo "Engine revision confirmed: $ACTUAL"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @lyrashield/desktop-frontend build

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::Apple certificate not set — build will be unsigned"
            exit 0
          fi
          CERT_FILE=$(mktemp /tmp/certificate.XXXXXX.p12)
          KEYCHAIN_FILE=$(mktemp /tmp/keychain.XXXXXX.keychain-db)
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$CERT_FILE" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security list-keychains -d user -s "$KEYCHAIN_FILE" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_FILE"

      - name: Build Tauri app (universal macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing — when no certificate is set, Tauri skips codesigning
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "LyraShield Desktop ${{ github.ref_name }}"
          releaseBody: "LyraShield Local/Desktop app release. See the assets below for macOS and Windows installers."
          releaseDraft: true
          prerelease: false
          args: "--target universal-apple-darwin"

      # Notarize the macOS app so Gatekeeper accepts it on first launch. Without
      # this, even a Developer-ID-signed build shows "cannot be opened because
      # the developer cannot be verified". Uses App Store Connect API key auth
      # (not the Apple-ID-password path). Skipped gracefully when the cert or
      # the notarization creds are not provisioned (e.g. unsigned dev builds).
      - name: Notarize macOS app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No Apple certificate — skipping notarization (unsigned dev build)"
            exit 0
          fi
          if [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_KEY" ]; then
            echo "::warning::Apple signing cert present but App Store Connect API creds (APPLE_API_ISSUER / APPLE_API_KEY_ID / APPLE_API_KEY) are not set — app is signed but NOT notarized; Gatekeeper will warn."
            exit 0
          fi
          # App Store Connect API key file (notarytool -p expects the .p8 content path)
          KEY_FILE=$(mktemp /tmp/AuthKey.XXXXXX.p8)
          echo "$APPLE_API_KEY" | base64 --decode > "$KEY_FILE" 2>/dev/null || printf '%s' "$APPLE_API_KEY" > "$KEY_FILE"
          # Notarize every produced .dmg (and .app.zip if present)
          shopt -s nullglob
          ARTIFACTS=( apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app )
          for ART in "${ARTIFACTS[@]}"; do
            [ -e "$ART" ] || continue
            echo "Notarizing: $ART"
            xcrun notarytool submit "$ART" \
              --key "$KEY_FILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --wait --timeout 30m
            # Staple the ticket so the app verifies offline too
            case "$ART" in
              *.dmg) xcrun stapler staple "$ART" ;;
              *.app) xcrun stapler staple "$ART" ;;
            esac
          done
          rm -f "$KEY_FILE"

  build-windows:
    name: Windows x64 (NSIS installer)
    runs-on: windows-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout engine (pinned revision)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ecryptoguru/lyrashield-engine
          ref: ${{ env.ENGINE_REVISION }}
          path: lyrashield-engine

      - name: Verify engine revision immutability
        run: |
          cd lyrashield-engine
          $actual = git rev-parse HEAD
          if ($actual -ne "${{ env.ENGINE_REVISION }}") {
            Write-Error "Engine revision mismatch: expected ${{ env.ENGINE_REVISION }}, got $actual"
            exit 1
          }
          Write-Host "Engine revision confirmed: $actual"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @lyrashield/desktop-frontend build

      - name: Build Tauri app (Windows x64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows code signing (Azure Trusted Signing or certificate)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "LyraShield Desktop ${{ github.ref_name }}"
          releaseBody: "LyraShield Local/Desktop app release. See the assets below for macOS and Windows installers."
          releaseDraft: true
          prerelease: false

  publish-manifest:
    name: Publish signed updater manifest
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate or download updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # Try to download an existing latest.json from the release (tauri-action may have uploaded one)
          gh release download "$TAG" --pattern "latest.json" --output latest.json || true
          if [ ! -f latest.json ] || [ ! -s latest.json ]; then
            echo "No latest.json from tauri-action — generating from release assets"
            # Download the macOS .tar.gz and Windows .exe to compute signatures
            gh release download "$TAG" --pattern "*.tar.gz" --dir /tmp/assets/ || true
            gh release download "$TAG" --pattern "*-setup.exe" --dir /tmp/assets/ --clobber || true

            MAC_TARBALL=$(ls /tmp/assets/*.tar.gz 2>/dev/null | head -1)
            WIN_INSTALLER=$(ls /tmp/assets/*-setup.exe 2>/dev/null | head -1)

            # Install tauri CLI for signing
            npm install -g @tauri-apps/cli@2

            MAC_SIGNATURE=""
            if [ -n "$MAC_TARBALL" ]; then
              MAC_SIGNATURE=$(npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$MAC_TARBALL" 2>/dev/null | grep -oP 'signature:\s*\K.*' || echo "")
            fi
            WIN_SIGNATURE=""
            if [ -n "$WIN_INSTALLER" ]; then
              WIN_SIGNATURE=$(npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$WIN_INSTALLER" 2>/dev/null | grep -oP 'signature:\s*\K.*' || echo "")
            fi

            # Build the manifest JSON
            MAC_URL="https://github.com/ecryptoguru/lyrashield-ai/releases/download/${TAG}/$(basename "$MAC_TARBALL" 2>/dev/null || echo '')"
            WIN_URL="https://github.com/ecryptoguru/lyrashield-ai/releases/download/${TAG}/$(basename "$WIN_INSTALLER" 2>/dev/null || echo '')"

            cat > latest.json <<EOFMANIFEST
          {
            "version": "${VERSION}",
            "notes": "LyraShield Local/Desktop ${TAG}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_SIGNATURE}",
                "url": "${MAC_URL}"
              },
              "darwin-x86_64": {
                "signature": "${MAC_SIGNATURE}",
                "url": "${MAC_URL}"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIGNATURE}",
                "url": "${WIN_URL}"
              }
            }
          }
          EOFMANIFEST
          fi
          echo "Manifest content:"
          cat latest.json

      - name: Verify no private keys in manifest
        run: |
          if grep -qi "PRIVATE\|BEGIN.*PRIVATE" latest.json; then
            echo "::error::Private key material found in manifest!"
            exit 1
          fi
          echo "Manifest clean — no private key material."

      - name: Upload manifest as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" latest.json --clobber
          echo "Manifest published to GitHub Releases."

      # LICENSE_PUBLISHED_BUILD pins the perpetual-fallback build on the server
      # (apps/web/src/lib/licenses/license-service.ts resolvePublishedFallbackBuild).
      # It is a Container App env var set by deploy-azure.yml and is NOT safe to
      # auto-write from here: a partial `az containerapp update` would clobber the
      # other env vars, and a full redeploy is too heavy a side effect for a
      # desktop release. So we surface the exact value + the one command instead
      # of letting it be forgotten on release day. (Founder deploy-gated.)
      - name: Remind to bump LICENSE_PUBLISHED_BUILD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "### ⚠️ Post-release step — bump the fallback build"
            echo ""
            echo "Set the app Container App's \`LICENSE_PUBLISHED_BUILD\` to \`${VERSION}\` so new"
            echo "licenses pin this build as their perpetual-fallback version:"
            echo ""
            echo "\`\`\`bash"
            echo "az containerapp update --name \"\$AZURE_APP_CONTAINER_APP_NAME\" \\"
            echo "  --resource-group \"\$AZURE_RESOURCE_GROUP\" \\"
            echo "  --set-env-vars \"LICENSE_PUBLISHED_BUILD=${VERSION}\""
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::LICENSE_PUBLISHED_BUILD should be set to ${VERSION} on the app Container App (see job summary)."
