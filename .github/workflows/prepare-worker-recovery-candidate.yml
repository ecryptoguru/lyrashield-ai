name: Prepare webhook recovery images without production access

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      runtime_qualification:
        required: false
        default: false
        type: boolean
    outputs:
      prepared_fleet:
        description: Same-run exact image tuple after disposable rehearsal
        value: ${{ jobs.receipt.outputs.prepared_fleet }}
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit to build and rehearse
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-webhook-recovery-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  ENGINE_REVISION: 7fa1c5afeda2b0d8521876cee9e89168665d77a3

jobs:
  build:
    name: Build immutable recovery candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      actions: read
      checks: read
      pull-requests: read
    outputs:
      web_image: ${{ steps.references.outputs.web_image }}
      worker_image: ${{ steps.references.outputs.worker_image }}
      egress_proxy_image: ${{ steps.references.outputs.egress_proxy_image }}
      broker_image: ${{ steps.references.outputs.broker_image }}
      supervisor_image: ${{ steps.references.outputs.supervisor_image }}
      provider_gateway_image: ${{ steps.references.outputs.provider_gateway_image }}
      engine_revision: ${{ env.ENGINE_REVISION }}
    steps:
      - name: Require exact current main
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_SHA" = "$DISPATCH_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_SHA"

      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Qualify exact merged source against required PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.source_sha }}
        run: node .github/scripts/qualify-release-source.mjs

      - name: Checkout pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/lyrashield-engine
          ref: ${{ env.ENGINE_REVISION }}
          path: lyrashield-engine
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Verify source and engine provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash .github/scripts/verify-engine-revision.sh lyrashield-engine "$ENGINE_REVISION" "$GITHUB_REPOSITORY_OWNER/lyrashield-engine"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify engine-worker contract
        run: bash .github/scripts/verify-engine-worker-contract.sh lyrashield-engine "$GITHUB_WORKSPACE"
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to candidate registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select unique candidate tags
        id: tags
        run: |
          set -euo pipefail
          tag="candidate-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "web=$repository/lyrashield-web:$tag"
            echo "worker=$repository/lyrashield-worker:$tag"
            echo "egress=$repository/lyrashield-egress-proxy:$tag"
            echo "broker=$repository/lyrashield-broker:$tag"
            echo "supervisor=$repository/lyrashield-supervisor:$tag"
            echo "provider_gateway=$repository/lyrashield-provider-gateway:$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Verify public build configuration
        env:
          POSTHOG_PUBLIC_PROJECT_KEY: ${{ vars.POSTHOG_PUBLIC_PROJECT_KEY }}
        run: |
          [[ "$POSTHOG_PUBLIC_PROJECT_KEY" =~ ^phc_[A-Za-z0-9]+$ ]]
          test -z "${POLAR_ENVIRONMENT:-}"
      - name: Build web candidate
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.web }}
          build-args: |
            BUILD_APP_URL=https://app.lyrashieldai.com
            BUILD_PUBLIC_APP_URL=https://scanner.lyrashieldai.com
            BUILD_PUBLIC_MARKETING_URL=https://lyrashieldai.com
            BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
            BUILD_LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=1
            BUILD_NEXT_PUBLIC_POSTHOG_KEY=${{ vars.POSTHOG_PUBLIC_PROJECT_KEY }}
            BUILD_NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            BUILD_NEXT_PUBLIC_SENTRY_RELEASE=${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            io.lyrashield.accounting.protocol=reservations/2
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,mode=max,scope=recovery-web
      - name: Build worker candidate
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.worker }}
          build-contexts: engine=lyrashield-engine
          build-args: BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            io.lyrashield.engine.revision=${{ env.ENGINE_REVISION }}
            io.lyrashield.accounting.protocol=reservations/2
          cache-from: type=gha,scope=release-worker
          cache-to: type=gha,mode=max,scope=recovery-worker
      - name: Build egress proxy candidate
        id: egress
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: egress-proxy
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.egress }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          cache-from: type=gha,scope=release-egress-proxy
          cache-to: type=gha,mode=max,scope=recovery-egress-proxy
      - name: Build broker candidate
        if: inputs.runtime_qualification == true
        id: broker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: controller
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.broker }}
          build-args: |
            PRODUCT_REVISION=${{ inputs.source_sha }}
            ENGINE_REVISION=${{ env.ENGINE_REVISION }}
      - name: Build supervisor candidate
        if: inputs.runtime_qualification == true
        id: supervisor
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: supervisor
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.supervisor }}
          build-args: |
            PRODUCT_REVISION=${{ inputs.source_sha }}
            ENGINE_REVISION=${{ env.ENGINE_REVISION }}
      - name: Build provider gateway candidate
        if: inputs.runtime_qualification == true
        id: provider-gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: provider-gateway
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.provider_gateway }}
          build-args: |
            PRODUCT_REVISION=${{ inputs.source_sha }}
            ENGINE_REVISION=${{ env.ENGINE_REVISION }}
      - name: Bind exact candidate digests
        id: references
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          EGRESS_DIGEST: ${{ steps.egress.outputs.digest }}
          BROKER_DIGEST: ${{ steps.broker.outputs.digest }}
          SUPERVISOR_DIGEST: ${{ steps.supervisor.outputs.digest }}
          GATEWAY_DIGEST: ${{ steps.provider-gateway.outputs.digest }}
          RUNTIME_QUALIFICATION: ${{ inputs.runtime_qualification }}
        run: |
          set -euo pipefail
          for digest in "$WEB_DIGEST" "$WORKER_DIGEST" "$EGRESS_DIGEST"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          done
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "web_image=$repository/lyrashield-web@$WEB_DIGEST"
            echo "worker_image=$repository/lyrashield-worker@$WORKER_DIGEST"
            echo "egress_proxy_image=$repository/lyrashield-egress-proxy@$EGRESS_DIGEST"
            if [ "$RUNTIME_QUALIFICATION" = true ]; then
              for digest in "$BROKER_DIGEST" "$SUPERVISOR_DIGEST" "$GATEWAY_DIGEST"; do
                [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
              done
              echo "broker_image=$repository/lyrashield-broker@$BROKER_DIGEST"
              echo "supervisor_image=$repository/lyrashield-supervisor@$SUPERVISOR_DIGEST"
              echo "provider_gateway_image=$repository/lyrashield-provider-gateway@$GATEWAY_DIGEST"
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Verify the exact prepared web and worker image contracts
        env:
          PREPARED_WEB: ${{ steps.references.outputs.web_image }}
          PREPARED_WORKER: ${{ steps.references.outputs.worker_image }}
        run: bash .github/scripts/verify-v26-images.sh "$PREPARED_WEB" "$PREPARED_WORKER" "$SOURCE_SHA" "$ENGINE_REVISION"

  rehearse:
    needs: build
    uses: ./.github/workflows/verify-webhook-worker-image.yml
    with:
      product_source_sha: ${{ inputs.source_sha }}
      engine_revision: ${{ needs.build.outputs.engine_revision }}
      worker_image: ${{ needs.build.outputs.worker_image }}
      cold_release: ${{ inputs.runtime_qualification == true }}
    permissions:
      contents: read
      packages: read

  receipt:
    name: Record verified candidate identities
    needs: [build, rehearse]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      prepared_fleet: ${{ steps.prepared-fleet.outputs.prepared_fleet }}
    steps:
      - name: Checkout tuple binder
        if: inputs.runtime_qualification == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Bind the rehearsed same-run fleet
        if: inputs.runtime_qualification == true
        id: prepared-fleet
        env:
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
          EGRESS_PROXY_IMAGE: ${{ needs.build.outputs.egress_proxy_image }}
          BROKER_IMAGE: ${{ needs.build.outputs.broker_image }}
          SUPERVISOR_IMAGE: ${{ needs.build.outputs.supervisor_image }}
          PROVIDER_GATEWAY_IMAGE: ${{ needs.build.outputs.provider_gateway_image }}
          SANDBOX_IMAGE: ${{ needs.rehearse.outputs.cold_sandbox_image }}
        run: node .github/scripts/prepared-runtime-fleet.mjs
      - name: Write verified preparation receipt
        env:
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
          EGRESS_PROXY_IMAGE: ${{ needs.build.outputs.egress_proxy_image }}
          REHEARSAL_HARNESS_SHA: ${{ needs.rehearse.outputs.rehearsal_harness_sha }}
          REHEARSAL_HARNESS_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              "schemaVersion": 2,
              "sourceSha": os.environ["SOURCE_SHA"],
              "engineRevision": os.environ["ENGINE_REVISION"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "rehearsal": {
                  "harnessSha": os.environ["REHEARSAL_HARNESS_SHA"],
                  "harnessRevision": os.environ["REHEARSAL_HARNESS_REVISION"],
              },
              "images": {
                  "web": os.environ["WEB_IMAGE"],
                  "worker": os.environ["WORKER_IMAGE"],
                  "egressProxy": os.environ["EGRESS_PROXY_IMAGE"],
              },
          }
          Path("recovery-candidate-receipt.json").write_text(json.dumps(receipt, sort_keys=True) + "\n")
          PY
      - name: Upload verified receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webhook-recovery-candidate-${{ inputs.source_sha }}
          path: recovery-candidate-receipt.json
          if-no-files-found: error
          retention-days: 7
