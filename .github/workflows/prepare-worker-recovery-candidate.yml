name: Prepare webhook recovery images without production access

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit to build and rehearse
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-webhook-recovery-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  ENGINE_REVISION: 3001517530300ca5f602536bfadcbd3c95ad3039

jobs:
  build:
    name: Build immutable recovery candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      web_image: ${{ steps.references.outputs.web_image }}
      worker_image: ${{ steps.references.outputs.worker_image }}
      egress_proxy_image: ${{ steps.references.outputs.egress_proxy_image }}
      engine_revision: ${{ env.ENGINE_REVISION }}
    steps:
      - name: Require exact current main
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_SHA" = "$DISPATCH_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_SHA"

      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/lyrashield-engine
          ref: ${{ env.ENGINE_REVISION }}
          path: lyrashield-engine
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Verify source and engine provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash .github/scripts/verify-engine-revision.sh lyrashield-engine "$ENGINE_REVISION" "$GITHUB_REPOSITORY_OWNER/lyrashield-engine"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify engine-worker contract
        run: bash .github/scripts/verify-engine-worker-contract.sh lyrashield-engine "$GITHUB_WORKSPACE"
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to candidate registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select unique candidate tags
        id: tags
        run: |
          set -euo pipefail
          tag="candidate-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "web=$repository/lyrashield-web:$tag"
            echo "worker=$repository/lyrashield-worker:$tag"
            echo "egress=$repository/lyrashield-egress-proxy:$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Verify public build configuration
        env:
          POSTHOG_PUBLIC_PROJECT_KEY: ${{ vars.POSTHOG_PUBLIC_PROJECT_KEY }}
        run: |
          [[ "$POSTHOG_PUBLIC_PROJECT_KEY" =~ ^phc_[A-Za-z0-9]+$ ]]
          test -z "${POLAR_ENVIRONMENT:-}"
      - name: Build web candidate
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.web }}
          build-args: |
            BUILD_APP_URL=https://app.lyrashieldai.com
            BUILD_PUBLIC_APP_URL=https://scanner.lyrashieldai.com
            BUILD_PUBLIC_MARKETING_URL=https://lyrashieldai.com
            BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
            BUILD_LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=1
            BUILD_NEXT_PUBLIC_POSTHOG_KEY=${{ vars.POSTHOG_PUBLIC_PROJECT_KEY }}
            BUILD_NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            BUILD_NEXT_PUBLIC_SENTRY_RELEASE=${{ inputs.source_sha }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,mode=max,scope=recovery-web
      - name: Build worker candidate
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.worker }}
          build-contexts: engine=lyrashield-engine
          build-args: BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            io.lyrashield.engine.revision=${{ env.ENGINE_REVISION }}
          cache-from: type=gha,scope=release-worker
          cache-to: type=gha,mode=max,scope=recovery-worker
      - name: Build egress proxy candidate
        id: egress
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: egress-proxy
          push: true
          sbom: true
          tags: ${{ steps.tags.outputs.egress }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          cache-from: type=gha,scope=release-egress-proxy
          cache-to: type=gha,mode=max,scope=recovery-egress-proxy
      - name: Bind exact candidate digests
        id: references
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          EGRESS_DIGEST: ${{ steps.egress.outputs.digest }}
        run: |
          set -euo pipefail
          for digest in "$WEB_DIGEST" "$WORKER_DIGEST" "$EGRESS_DIGEST"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          done
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "web_image=$repository/lyrashield-web@$WEB_DIGEST"
            echo "worker_image=$repository/lyrashield-worker@$WORKER_DIGEST"
            echo "egress_proxy_image=$repository/lyrashield-egress-proxy@$EGRESS_DIGEST"
          } >> "$GITHUB_OUTPUT"

  rehearse:
    needs: build
    uses: ./.github/workflows/verify-webhook-worker-image.yml
    with:
      product_source_sha: ${{ inputs.source_sha }}
      engine_revision: ${{ needs.build.outputs.engine_revision }}
      worker_image: ${{ needs.build.outputs.worker_image }}
    permissions:
      contents: read
      packages: read

  receipt:
    name: Record verified candidate identities
    needs: [build, rehearse]
    runs-on: ubuntu-24.04
    steps:
      - name: Write verified preparation receipt
        env:
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
          EGRESS_PROXY_IMAGE: ${{ needs.build.outputs.egress_proxy_image }}
          REHEARSAL_HARNESS_SHA: ${{ needs.rehearse.outputs.rehearsal_harness_sha }}
          REHEARSAL_HARNESS_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              "schemaVersion": 2,
              "sourceSha": os.environ["SOURCE_SHA"],
              "engineRevision": os.environ["ENGINE_REVISION"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "rehearsal": {
                  "harnessSha": os.environ["REHEARSAL_HARNESS_SHA"],
                  "harnessRevision": os.environ["REHEARSAL_HARNESS_REVISION"],
              },
              "images": {
                  "web": os.environ["WEB_IMAGE"],
                  "worker": os.environ["WORKER_IMAGE"],
                  "egressProxy": os.environ["EGRESS_PROXY_IMAGE"],
              },
          }
          Path("recovery-candidate-receipt.json").write_text(json.dumps(receipt, sort_keys=True) + "\n")
          PY
      - name: Upload verified receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webhook-recovery-candidate-${{ inputs.source_sha }}
          path: recovery-candidate-receipt.json
          if-no-files-found: error
          retention-days: 7
