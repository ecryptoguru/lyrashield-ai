name: Deploy billing staging

on:
  workflow_dispatch:
    inputs:
      recover_stale_migration:
        description: "Recover the one schema-checked stale staging migration record before deploy"
        required: false
        type: choice
        default: none
        options:
          - none
          - 20260814020000_ai_system_profile_versions
      verify_provider_receipt:
        description: "Run only after a hosted Sandbox/Test payment delivered its provider webhook"
        required: false
        type: boolean
        default: false
      prepare_razorpay_checkout:
        description: "Create one disposable Razorpay Test subscription checkout in isolated INR staging"
        required: false
        type: boolean
        default: false
      prepare_polar_checkout:
        description: "Create one disposable Polar Sandbox subscription checkout in isolated USD staging"
        required: false
        type: boolean
        default: false
      receipt_provider:
        description: "polar or razorpay"
        required: false
        type: string
      receipt_event_id:
        description: "Provider-delivered webhook event ID"
        required: false
        type: string
      receipt_resolve_razorpay_subscription_charge:
        description: "Resolve exactly one processed Razorpay subscription.charged event for the provided workspace and subscription"
        required: false
        type: boolean
        default: false
      receipt_resolve_razorpay_subscription_cancellation:
        description: "Resolve exactly one processed Razorpay subscription.cancelled event for the provided workspace and subscription"
        required: false
        type: boolean
        default: false
      receipt_resolve_polar_subscription_purchase:
        description: "Resolve one processed Polar subscription.active or subscription.created event"
        required: false
        type: boolean
        default: false
      receipt_resolve_polar_subscription_cancellation:
        description: "Resolve exactly one processed Polar subscription.canceled or subscription.revoked event"
        required: false
        type: boolean
        default: false
      receipt_workspace_id:
        description: "Disposable staging workspace ID"
        required: false
        type: string
      receipt_kind:
        description: "subscription or pack"
        required: false
        type: string
      receipt_phase:
        description: "Marker-safe lifecycle phase, such as purchase, cancellation, partial_refund, full_refund, replay, or cleanup"
        required: false
        type: string
      receipt_object_id:
        description: "Provider subscription or payment object ID"
        required: false
        type: string
      receipt_plan:
        description: "Expected plan for a subscription receipt"
        required: false
        type: string
      receipt_interval:
        description: "Expected interval for a subscription receipt"
        required: false
        type: string
      receipt_status:
        description: "Expected subscription status"
        required: false
        type: string
      receipt_minutes:
        description: "Expected minutes for a pack receipt"
        required: false
        type: string
      receipt_remaining_minutes:
        description: "Expected remaining minutes after purchase/refund"
        required: false
        type: string
      receipt_commission_count:
        description: "Expected commissions bound to the provider object (default 0)"
        required: false
        type: string
      receipt_commission_status:
        description: "Expected commission status when count is non-zero"
        required: false
        type: string
      receipt_audit_action:
        description: "Expected workspace audit action bound to the provider object"
        required: false
        type: string
      receipt_audit_resource_id:
        description: "Audit resource ID when it differs from the provider object"
        required: false
        type: string
      receipt_audit_count:
        description: "Expected matching audit rows (required with an audit action)"
        required: false
        type: string

concurrency:
  group: deploy-billing-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy isolated billing staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: billing-staging
      url: ${{ vars.STAGING_APP_URL }}
    env:
      RESOURCE_GROUP: ${{ vars.STAGING_RESOURCE_GROUP }}
      CONTAINER_ENVIRONMENT: ${{ vars.STAGING_CONTAINER_ENVIRONMENT }}
      CONTAINER_APP: ${{ vars.STAGING_CONTAINER_APP }}
      REGISTRY: ${{ vars.STAGING_REGISTRY }}
      IMAGE_SHA: ${{ github.sha }}
      PULL_IDENTITY_ID: ${{ vars.STAGING_PULL_IDENTITY_ID }}
      APP_IDENTITY_ID: ${{ vars.STAGING_APP_IDENTITY_ID }}
      APP_IDENTITY_CLIENT_ID: ${{ vars.STAGING_APP_IDENTITY_CLIENT_ID }}
      DEPLOY_CLIENT_ID: ${{ vars.STAGING_AZURE_CLIENT_ID }}
      DEPLOY_TENANT_ID: ${{ vars.STAGING_AZURE_TENANT_ID }}
      DEPLOY_SUBSCRIPTION_ID: ${{ vars.STAGING_AZURE_SUBSCRIPTION_ID }}
      APP_URL: ${{ vars.STAGING_APP_URL }}
      REDIS_HOST: ${{ vars.STAGING_REDIS_HOST }}
      KEY_VAULT_NAME: ${{ vars.LYRASHIELD_KEY_VAULT_NAME }}
      LICENSE_SIGNING_KEY_ID: ${{ vars.LICENSE_SIGNING_KEY_ID }}
      DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
      DATABASE_SERVER: ${{ vars.STAGING_DATABASE_SERVER }}
      DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
      DATABASE_ADMIN_USER: ${{ vars.STAGING_DATABASE_ADMIN_USER }}
      PLATFORM_ADMIN_EMAILS: ${{ vars.PLATFORM_ADMIN_EMAILS }}
      REQUIRE_EMAIL_VERIFICATION: ${{ vars.LYRASHIELD_REQUIRE_EMAIL_VERIFICATION }}
      POLAR_ENVIRONMENT: ${{ vars.POLAR_ENVIRONMENT }}
      POLAR_ORG_ID: ${{ vars.POLAR_ORG_ID }}
      POLAR_PRODUCT_IDS: ${{ vars.POLAR_PRODUCT_IDS }}
      POLAR_LOCAL_PRODUCT_IDS: ${{ vars.POLAR_LOCAL_PRODUCT_IDS }}
      RAZORPAY_PLAN_IDS: ${{ vars.RAZORPAY_PLAN_IDS }}
      BILLING_USD_INR_RATE: ${{ vars.BILLING_USD_INR_RATE }}
      BILLING_STAGING_REGION: ${{ vars.STAGING_BILLING_REGION }}
      RECOVER_STALE_MIGRATION: ${{ inputs.recover_stale_migration || 'none' }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate staging-only contract
        shell: bash
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUNTIME_PASSWORD: ${{ secrets.STAGING_DATABASE_RUNTIME_PASSWORD }}
          SYSTEM_PASSWORD: ${{ secrets.STAGING_DATABASE_SYSTEM_PASSWORD }}
          STAGING_ACCESS_TOKEN: ${{ secrets.STAGING_BILLING_ACCESS_TOKEN }}
          REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.LYRASHIELD_INTERNAL_API_KEY }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_WEBHOOK_PREVIOUS_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_PREVIOUS_SECRET }}
        run: |
          set -euo pipefail
          required=(
            RESOURCE_GROUP CONTAINER_ENVIRONMENT CONTAINER_APP REGISTRY IMAGE_SHA
            PULL_IDENTITY_ID APP_IDENTITY_ID APP_IDENTITY_CLIENT_ID
            DEPLOY_CLIENT_ID DEPLOY_TENANT_ID DEPLOY_SUBSCRIPTION_ID APP_URL REDIS_HOST
            KEY_VAULT_NAME LICENSE_SIGNING_KEY_ID DATABASE_HOST DATABASE_SERVER DATABASE_NAME DATABASE_ADMIN_USER
            DATABASE_ADMIN_URL DATABASE_URL RUNTIME_PASSWORD SYSTEM_PASSWORD STAGING_ACCESS_TOKEN
            REDIS_PASSWORD BETTER_AUTH_SECRET
            INTERNAL_API_KEY POLAR_ACCESS_TOKEN POLAR_WEBHOOK_SECRET POLAR_ORG_ID
            POLAR_PRODUCT_IDS POLAR_LOCAL_PRODUCT_IDS RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET
            RAZORPAY_WEBHOOK_SECRET RAZORPAY_PLAN_IDS BILLING_STAGING_REGION PLATFORM_ADMIN_EMAILS
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::billing-staging protected value ${name} is required."
              exit 1
            fi
          done

          [ "$RESOURCE_GROUP" = "LyraShieldAI-Billing-Staging" ]
          [ "$CONTAINER_ENVIRONMENT" = "lyrashield-billing-staging-env" ]
          [ "$CONTAINER_APP" = "lyrashield-billing-staging" ]
          [ "$POLAR_ENVIRONMENT" = "sandbox" ]
          [ "$REQUIRE_EMAIL_VERIFICATION" = "0" ]
          case "$RAZORPAY_KEY_ID" in rzp_test_*) ;; *) exit 1 ;; esac
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_URL" =~ ^https://lyrashield-billing-staging\..+\.azurecontainerapps\.io$ ]]
          [[ "$REGISTRY" =~ ^lyrashieldbillingstageacr\.azurecr\.io$ ]]
          [[ "${PULL_IDENTITY_ID,,}" == *"/resourcegroups/lyrashieldai-billing-staging/"* ]]
          [[ "${APP_IDENTITY_ID,,}" == *"/resourcegroups/lyrashieldai-billing-staging/"* ]]
          [ "$KEY_VAULT_NAME" = "lyrashieldbillingstage" ]
          [ "$DATABASE_SERVER" = "lyrashield-billing-stage-pg" ]
          case "$RECOVER_STALE_MIGRATION" in
            none|20260814020000_ai_system_profile_versions) ;;
            *) echo "::error::Unsupported staging migration recovery request."; exit 1 ;;
          esac
          [ "$DATABASE_HOST" = "${DATABASE_SERVER}.postgres.database.azure.com" ]
          case "$BILLING_STAGING_REGION" in usd|inr) ;; *) exit 1 ;; esac
          [ "$REDIS_HOST" = "lyrashield-billing-redis" ]
          [ "${#STAGING_ACCESS_TOKEN}" -ge 32 ]

          for admission in \
            "${{ vars.POLAR_BILLING_ADMISSION }}" \
            "${{ vars.POLAR_LOCAL_BILLING_ADMISSION }}" \
            "${{ vars.RAZORPAY_BILLING_ADMISSION }}" \
            "${{ vars.RAZORPAY_LOCAL_BILLING_ADMISSION }}"; do
            [ "$admission" = "off" ] || {
              echo "::error::Every billing staging purchase admission must remain off."
              exit 1
            }
          done

          # JavaScript template literal is evaluated by Node, not this shell.
          # shellcheck disable=SC2016
          node -e '
            for (const name of ["POLAR_PRODUCT_IDS", "POLAR_LOCAL_PRODUCT_IDS", "RAZORPAY_PLAN_IDS"]) {
              const map = JSON.parse(process.env[name]);
              if (!map || Array.isArray(map) || Object.keys(map).length === 0) process.exit(1);
            }
            for (const [name, user] of [["DATABASE_ADMIN_URL", process.env.DATABASE_ADMIN_USER], ["DATABASE_URL", "app_runtime_staging"]]) {
              const url = new URL(process.env[name]);
              if (url.protocol !== "postgresql:" || url.hostname !== process.env.DATABASE_HOST ||
                  url.pathname !== `/${process.env.DATABASE_NAME}` || decodeURIComponent(url.username) !== user) process.exit(1);
            }
          '

      - name: Log in to isolated Azure staging
        id: azure-login
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ env.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.DEPLOY_TENANT_ID }}
          subscription-id: ${{ env.DEPLOY_SUBSCRIPTION_ID }}

      - name: Verify isolated OIDC scope
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --yes --only-show-errors

          resource_group_id=$(az group show --name "$RESOURCE_GROUP" --query id --output tsv)
          expected_resource_group_id="/subscriptions/${DEPLOY_SUBSCRIPTION_ID}/resourceGroups/LyraShieldAI-Billing-Staging"
          [ "${resource_group_id,,}" = "${expected_resource_group_id,,}" ] || {
            echo "::error::Azure login did not resolve the fixed isolated staging resource group."
            exit 1
          }
          assignments=$(az role assignment list \
            --assignee "$DEPLOY_CLIENT_ID" \
            --all \
            --query '[].scope' \
            --output tsv)
          [ -n "$assignments" ] || {
            echo "::error::OIDC principal has no direct Azure role assignment."
            exit 1
          }
          while IFS= read -r scope; do
            case "${scope,,}" in
              "${resource_group_id,,}"|"${resource_group_id,,}"/*) ;;
              *)
                echo "::error::OIDC principal has a role assignment outside isolated staging."
                exit 1
                ;;
            esac
          done <<< "$assignments"

          expected_database_id="${resource_group_id}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${DATABASE_SERVER}"
          actual_database_id=$(az postgres flexible-server show \
            --name "$DATABASE_SERVER" --resource-group "$RESOURCE_GROUP" \
            --query id --output tsv)
          actual_database_host=$(az postgres flexible-server show \
            --name "$DATABASE_SERVER" --resource-group "$RESOURCE_GROUP" \
            --query fullyQualifiedDomainName --output tsv)
          [ "${actual_database_id,,}" = "${expected_database_id,,}" ] || {
            echo "::error::Database resource is outside the fixed isolated staging identity."
            exit 1
          }
          [ "$actual_database_host" = "$DATABASE_HOST" ] || {
            echo "::error::Database URL host does not match the isolated Azure PostgreSQL resource."
            exit 1
          }

          # The Container Apps CLI may try to create AcrPull even when the
          # assignment already exists, which this least-privileged OIDC role
          # intentionally cannot do. Verify the immutable prerequisite using
          # the object ID path (no Microsoft Graph lookup) before any job/app.
          pull_principal_id=$(az identity show \
            --ids "$PULL_IDENTITY_ID" --query principalId --output tsv)
          registry_id=$(az acr show \
            --name "${REGISTRY%%.*}" --resource-group "$RESOURCE_GROUP" \
            --query id --output tsv)
          acrpull_scope=$(az role assignment list \
            --assignee-object-id "$pull_principal_id" \
            --scope "$registry_id" \
            --query "[?roleDefinitionName=='AcrPull' && principalId=='${pull_principal_id}'].scope" \
            --output tsv)
          [ "${acrpull_scope,,}" = "${registry_id,,}" ] || {
            echo "::error::Pull identity must have exactly one AcrPull assignment at the isolated staging registry scope."
            exit 1
          }

      - name: Ensure isolated staging Redis TCP ingress
        shell: bash
        run: |
          set -euo pipefail
          redis_app="$REDIS_HOST"
          az containerapp ingress enable \
            --name "$redis_app" --resource-group "$RESOURCE_GROUP" \
            --type internal --transport tcp --target-port 6379 --exposed-port 6379 \
            --output none
          redis_ingress=$(az containerapp show \
            --name "$redis_app" --resource-group "$RESOURCE_GROUP" \
            --query 'properties.configuration.ingress' --output json)
          node -e '
            const ingress = JSON.parse(process.argv[1]);
            if (
              ingress.external !== false ||
              String(ingress.transport).toLowerCase() !== "tcp" ||
              ingress.targetPort !== 6379 ||
              ingress.exposedPort !== 6379
            ) process.exit(1);
          ' "$redis_ingress"

      - name: Allow required staging database extensions
        shell: bash
        run: |
          set -euo pipefail
          current=$(az postgres flexible-server parameter show \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "$DATABASE_SERVER" \
            --name azure.extensions \
            --query value --output tsv)
          case ",${current,,}," in
            *,pgcrypto,*) ;;
            *)
              az postgres flexible-server parameter set \
                --resource-group "$RESOURCE_GROUP" \
                --server-name "$DATABASE_SERVER" \
                --name azure.extensions \
                --value "${current:+${current},}pgcrypto" \
                --output none
              ;;
          esac
          actual=$(az postgres flexible-server parameter show \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "$DATABASE_SERVER" \
            --name azure.extensions \
            --query value --output tsv)
          case ",${actual,,}," in
            *,pgcrypto,*) ;;
            *) echo "::error::pgcrypto is not allow-listed on isolated billing staging."; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to isolated staging registry
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "${REGISTRY%%.*}" --only-show-errors

      - name: Build and push exact-SHA staging web image
        id: build-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.REGISTRY }}/lyrashield-web:${{ env.IMAGE_SHA }}
          build-args: |
            BUILD_APP_URL=${{ env.APP_URL }}
            BUILD_PUBLIC_APP_URL=${{ env.APP_URL }}
            BUILD_PUBLIC_MARKETING_URL=https://lyrashieldai.com
            BUILD_TRUSTED_PROXY_IP_HEADER=x-forwarded-for
            BUILD_LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=0
          labels: |
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
          cache-from: type=gha,scope=billing-staging-web
          cache-to: type=gha,mode=max,scope=billing-staging-web

      - name: Build and push exact-SHA staging migration image
        id: build-migration
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: workspace-builder
          push: true
          tags: ${{ env.REGISTRY }}/lyrashield-migrate:${{ env.IMAGE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
          cache-from: type=gha,scope=billing-staging-migrate
          cache-to: type=gha,mode=max,scope=billing-staging-migrate

      - name: Build and push exact-SHA staging E2E image
        id: build-e2e
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: billing-e2e
          push: true
          tags: ${{ env.REGISTRY }}/lyrashield-billing-e2e:${{ env.IMAGE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
          cache-from: type=gha,scope=billing-staging-e2e
          cache-to: type=gha,mode=max,scope=billing-staging-e2e

      - name: Verify staging image provenance and owned job executables
        shell: bash
        env:
          WEB_DIGEST: ${{ steps.build-web.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.build-migration.outputs.digest }}
          E2E_DIGEST: ${{ steps.build-e2e.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$MIGRATION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$E2E_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          registry_name=${REGISTRY%%.*}
          web_tag_digest=$(az acr manifest show-metadata \
            --registry "$registry_name" \
            --name "lyrashield-web:${IMAGE_SHA}" \
            --query digest --output tsv)
          migration_tag_digest=$(az acr manifest show-metadata \
            --registry "$registry_name" \
            --name "lyrashield-migrate:${IMAGE_SHA}" \
            --query digest --output tsv)
          e2e_tag_digest=$(az acr manifest show-metadata \
            --registry "$registry_name" \
            --name "lyrashield-billing-e2e:${IMAGE_SHA}" \
            --query digest --output tsv)
          [ "$web_tag_digest" = "$WEB_DIGEST" ]
          [ "$migration_tag_digest" = "$MIGRATION_DIGEST" ]
          [ "$e2e_tag_digest" = "$E2E_DIGEST" ]

          web_image="${REGISTRY}/lyrashield-web@${WEB_DIGEST}"
          migration_image="${REGISTRY}/lyrashield-migrate@${MIGRATION_DIGEST}"
          e2e_image="${REGISTRY}/lyrashield-billing-e2e@${E2E_DIGEST}"
          docker pull "$web_image"
          docker pull "$migration_image"
          docker pull "$e2e_image"
          [ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_image")" = "$IMAGE_SHA" ]
          [ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$migration_image")" = "$IMAGE_SHA" ]
          [ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$e2e_image")" = "$IMAGE_SHA" ]
          docker run --rm --entrypoint /usr/bin/test "$migration_image" \
            -x /app/packages/db/scripts/run-billing-staging-migrations.sh
          docker run --rm --entrypoint /usr/bin/test "$migration_image" \
            -x /app/packages/db/scripts/provision-billing-staging-roles.mjs
          docker run --rm --entrypoint /usr/bin/test "$migration_image" \
            -x /app/packages/db/scripts/manage-billing-staging-e2e-role.mjs
          docker run --rm --entrypoint /usr/bin/test "$e2e_image" \
            -x /app/e2e/billing/run-staging-proof.sh
          docker run --rm --entrypoint /usr/bin/test "$e2e_image" \
            -x /app/e2e/billing/verify-staging-config.sh
          docker run --rm \
            --entrypoint /app/e2e/billing/verify-staging-config.sh \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://billing_e2e_staging:test@db.example.invalid:5432/staging \
            -e DATABASE_SYSTEM_URL=postgresql://billing_e2e_staging:test@db.example.invalid:5432/staging \
            -e BETTER_AUTH_SECRET=billing-staging-image-smoke-secret \
            -e BETTER_AUTH_URL=https://lyrashield-billing-staging.test.centralindia.azurecontainerapps.io \
            -e NEXT_PUBLIC_APP_URL=https://lyrashield-billing-staging.test.centralindia.azurecontainerapps.io \
            -e NEXT_PUBLIC_MARKETING_URL=https://lyrashieldai.com \
            -e TRUSTED_PROXY_IP_HEADER=x-forwarded-for \
            -e LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=0 \
            -e PLATFORM_ADMIN_EMAILS=ecryptoguru@gmail.com,ankit@lyrashieldai.com \
            -e LYRASHIELD_DEPLOYMENT_ENVIRONMENT=billing-staging \
            -e BILLING_STAGING_ADMISSION=restricted \
            -e BILLING_STAGING_ACCESS_TOKEN=static-image-access-token-value-x \
            -e BILLING_STAGING_REGION=usd \
            -e POLAR_BILLING_ADMISSION=off \
            -e POLAR_LOCAL_BILLING_ADMISSION=off \
            -e RAZORPAY_BILLING_ADMISSION=off \
            -e RAZORPAY_LOCAL_BILLING_ADMISSION=off \
            -e POLAR_ENVIRONMENT=sandbox \
            -e RAZORPAY_KEY_ID=rzp_test_image_smoke \
            "$e2e_image"

          {
            echo "WEB_DIGEST=${WEB_DIGEST}"
            echo "MIGRATION_DIGEST=${MIGRATION_DIGEST}"
            echo "E2E_DIGEST=${E2E_DIGEST}"
          } >> "$GITHUB_ENV"

      - name: Run migrations and provision restricted runtime role
        shell: bash
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          RUNTIME_PASSWORD: ${{ secrets.STAGING_DATABASE_RUNTIME_PASSWORD }}
          SYSTEM_PASSWORD: ${{ secrets.STAGING_DATABASE_SYSTEM_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.verify_provider_receipt }}" = "true" ] && \
            { [ "${{ inputs.prepare_razorpay_checkout }}" = "true" ] || [ "${{ inputs.prepare_polar_checkout }}" = "true" ]; }; then
            echo "::error::Provider receipt verification and checkout preparation cannot run together."
            exit 1
          fi
          if [ "${{ inputs.prepare_razorpay_checkout }}" = "true" ] && \
            [ "${{ inputs.prepare_polar_checkout }}" = "true" ]; then
            echo "::error::Prepare only one provider checkout per staging run."
            exit 1
          fi
          migration_image="${REGISTRY}/lyrashield-migrate@${MIGRATION_DIGEST}"
          job_suffix=${GITHUB_RUN_ID: -10}
          recovery_job="lyra-mig-recover-${job_suffix}"
          migration_job="lyra-migrate-${job_suffix}"
          role_job="lyra-db-role-${job_suffix}"

          wait_for_job() {
            local job=$1 execution status container_name provisioning_state
            local configured_secrets template_secret_refs expected_setting expected_secret expected_name expected_value actual_value template_ready
            shift
            template_ready=false
            for _ in {1..60}; do
              provisioning_state=$(az containerapp job show \
                --name "$job" --resource-group "$RESOURCE_GROUP" \
                --query properties.provisioningState --output tsv)
              case "$provisioning_state" in
                Succeeded)
                  configured_secrets=" $(az containerapp job secret list \
                    --name "$job" --resource-group "$RESOURCE_GROUP" \
                    --query '[].name' --output tsv 2>/dev/null | tr '\t\r\n' '   ' || true) "
                  template_secret_refs=" $(az containerapp job show \
                    --name "$job" --resource-group "$RESOURCE_GROUP" \
                    --query 'properties.template.containers[].env[].secretRef' \
                    --output tsv 2>/dev/null | tr '\t\r\n' '   ' || true) "
                  template_ready=true
                  for expected_setting in "$@"; do
                    if [[ "$expected_setting" == *=* ]]; then
                      expected_name=${expected_setting%%=*}
                      expected_value=${expected_setting#*=}
                      actual_value=$(az containerapp job show \
                        --name "$job" --resource-group "$RESOURCE_GROUP" \
                        --query "properties.template.containers[0].env[?name=='${expected_name}'].value | [0]" \
                        --output tsv 2>/dev/null || true)
                      [ "$actual_value" = "$expected_value" ] && continue
                    else
                      printf -v expected_secret '%s-%s' "$expected_setting" "$job"
                      if [[ "$configured_secrets" == *" ${expected_secret} "* && \
                        "$template_secret_refs" == *" ${expected_secret} "* ]]; then
                        continue
                      fi
                    fi
                    template_ready=false
                    break
                  done
                  $template_ready && break
                  ;;
                Failed)
                  echo "::error::${job} failed to provision."
                  return 1
                  ;;
              esac
              sleep 5
            done
            if [ "$provisioning_state" != "Succeeded" ] || ! $template_ready; then
              echo "::error::Timed out applying the secret-bearing template for ${job}."
              return 1
            fi
            execution=$(.github/scripts/start-billing-staging-job.sh "$job" "$RESOURCE_GROUP")
            for _ in {1..150}; do
              if ! status=$(az containerapp job execution show \
                --name "$job" \
                --resource-group "$RESOURCE_GROUP" \
                --job-execution-name "$execution" \
                --query properties.status --output tsv 2>/dev/null); then
                # Azure can accept a job start before its execution is queryable.
                sleep 10
                continue
              fi
              case "$status" in
                Succeeded) return 0 ;;
                Failed|Stopped)
                  echo "::error::${job} ended with ${status}."
                  container_name=$(az containerapp job show \
                    --name "$job" \
                    --resource-group "$RESOURCE_GROUP" \
                    --query 'properties.template.containers[0].name' \
                    --output tsv)
                  az containerapp job execution show \
                    --name "$job" \
                    --resource-group "$RESOURCE_GROUP" \
                    --job-execution-name "$execution" \
                    --query '{name:name,status:properties.status,startTime:properties.startTime,endTime:properties.endTime}' \
                    --output jsonc || true
                  az containerapp job replica list \
                    --name "$job" \
                    --resource-group "$RESOURCE_GROUP" \
                    --execution "$execution" \
                    --output jsonc || true
                  az containerapp job logs show \
                    --name "$job" \
                    --resource-group "$RESOURCE_GROUP" \
                    --execution "$execution" \
                    --container "$container_name" \
                    --tail 300 \
                    --format text || true
                  return 1
                  ;;
              esac
              sleep 10
            done
            echo "::error::Timed out waiting for ${job}."
            return 1
          }

          stop_job_executions() {
            local job=$1 active
            active=$(az containerapp job execution list \
              --name "$job" --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.status!='Succeeded' && properties.status!='Failed' && properties.status!='Stopped'].name" \
              --output tsv)
            if [ -n "$active" ]; then
              az containerapp job stop \
                --name "$job" --resource-group "$RESOURCE_GROUP" --output none
            fi
            for _ in {1..60}; do
              active=$(az containerapp job execution list \
                --name "$job" --resource-group "$RESOURCE_GROUP" \
                --query "[?properties.status!='Succeeded' && properties.status!='Failed' && properties.status!='Stopped'].name" \
                --output tsv)
              [ -z "$active" ] && return 0
              sleep 5
            done
            echo "::error::Timed out stopping active executions for ${job}."
            return 1
          }

          create_job() {
            local job=$1 executable=$2
            if az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
              stop_job_executions "$job"
              az containerapp job delete \
                --name "$job" --resource-group "$RESOURCE_GROUP" --yes --output none
            fi
            .github/scripts/create-billing-staging-job.sh \
              "$job" "$migration_image" "$executable" 1200
          }

          if [ "$RECOVER_STALE_MIGRATION" != "none" ]; then
            JOB_SECRET_SPECS='database-admin-url=DATABASE_ADMIN_URL' \
              JOB_ENV_SPECS=$(printf '%s\n' \
                'DATABASE_ADMIN_URL=secretref:database-admin-url' \
                "BILLING_STAGING_RECOVER_MIGRATION=${RECOVER_STALE_MIGRATION}") \
              create_job "$recovery_job" /app/packages/db/scripts/recover-billing-staging-migration.mjs
            wait_for_job "$recovery_job" database-admin-url \
              "BILLING_STAGING_RECOVER_MIGRATION=${RECOVER_STALE_MIGRATION}"
          fi

          JOB_SECRET_SPECS='database-admin-url=DATABASE_ADMIN_URL' \
            JOB_ENV_SPECS='DATABASE_ADMIN_URL=secretref:database-admin-url' \
            create_job "$migration_job" /app/packages/db/scripts/run-billing-staging-migrations.sh
          wait_for_job "$migration_job" database-admin-url

          JOB_SECRET_SPECS=$(printf '%s\n' \
              'database-admin-url=DATABASE_ADMIN_URL' \
              'runtime-password=RUNTIME_PASSWORD' \
              'system-password=SYSTEM_PASSWORD') \
            JOB_ENV_SPECS=$(printf '%s\n' \
              'DATABASE_ADMIN_URL=secretref:database-admin-url' \
              'RUNTIME_PASSWORD=secretref:runtime-password' \
              'SYSTEM_PASSWORD=secretref:system-password') \
            create_job "$role_job" /app/packages/db/scripts/provision-billing-staging-roles.mjs
          wait_for_job "$role_job" database-admin-url runtime-password system-password

      - name: Delete one-shot database jobs
        if: ${{ always() && steps.azure-login.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          stop_job_executions() {
            local job=$1 active
            active=$(az containerapp job execution list \
              --name "$job" --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.status!='Succeeded' && properties.status!='Failed' && properties.status!='Stopped'].name" \
              --output tsv)
            if [ -n "$active" ]; then
              az containerapp job stop \
                --name "$job" --resource-group "$RESOURCE_GROUP" --output none
            fi
            for _ in {1..60}; do
              active=$(az containerapp job execution list \
                --name "$job" --resource-group "$RESOURCE_GROUP" \
                --query "[?properties.status!='Succeeded' && properties.status!='Failed' && properties.status!='Stopped'].name" \
                --output tsv)
              [ -z "$active" ] && return 0
              sleep 5
            done
            echo "::error::Timed out stopping active executions for ${job}."
            return 1
          }

          purge_job() {
            local job=$1
            if az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
              stop_job_executions "$job"
              az containerapp job delete \
                --name "$job" \
                --resource-group "$RESOURCE_GROUP" \
                --yes \
                --output none
            fi
          }

          job_suffix=${GITHUB_RUN_ID: -10}
          purge_job "lyra-mig-recover-${job_suffix}" database-admin-url
          purge_job "lyra-migrate-${job_suffix}" database-admin-url
          purge_job "lyra-db-role-${job_suffix}" database-admin-url runtime-password system-password
          # Remove pre-run-id jobs left by cancelled historical runs.
          purge_job lyra-stage-migration-recovery database-admin-url
          purge_job lyrashield-stage-migrate database-admin-url
          purge_job lyrashield-stage-db-role database-admin-url runtime-password system-password

      - name: Create or update public disposable staging app
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYSTEM_PASSWORD: ${{ secrets.STAGING_DATABASE_SYSTEM_PASSWORD }}
          STAGING_ACCESS_TOKEN: ${{ secrets.STAGING_BILLING_ACCESS_TOKEN }}
          REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.LYRASHIELD_INTERNAL_API_KEY }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_WEBHOOK_PREVIOUS_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_PREVIOUS_SECRET }}
        run: |
          set -euo pipefail
          web_image="${REGISTRY}/lyrashield-web@${WEB_DIGEST}"
          encoded_redis_password=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["REDIS_PASSWORD"], safe=""))')
          redis_url="redis://:${encoded_redis_password}@${REDIS_HOST}:6379"
          system_database_url=$(node -e '
            const url = new URL(process.env.DATABASE_URL);
            url.username = "app_system_staging";
            url.password = process.env.SYSTEM_PASSWORD;
            process.stdout.write(url.toString());
          ')
          echo "::add-mask::${redis_url}"
          echo "::add-mask::${system_database_url}"

          retry_containerapp_write() {
            local label=$1
            shift
            local attempt output status wait_seconds
            for attempt in {1..5}; do
              if output=$("$@" 2>&1); then
                [ -z "$output" ] || printf '%s\n' "$output" >&2
                return 0
              else
                status=$?
              fi
              printf '%s\n' "$output" >&2
              if ! grep -Fq '(ConflictingConcurrentWriteNotAllowed)' <<< "$output" || [ "$attempt" -eq 5 ]; then
                return "$status"
              fi
              wait_seconds=$((attempt * 5))
              echo "::warning::Azure rejected ${label} with a concurrent-write conflict; retrying after ${wait_seconds}s."
              sleep "$wait_seconds"
            done
          }

          secrets=(
            "database-url=${DATABASE_URL}"
            "database-system-url=${system_database_url}"
            "better-auth-secret=${BETTER_AUTH_SECRET}"
            "internal-api-key=${INTERNAL_API_KEY}"
            "billing-staging-access=${STAGING_ACCESS_TOKEN}"
            "redis-url=${redis_url}"
            "polar-access-token=${POLAR_ACCESS_TOKEN}"
            "polar-webhook=${POLAR_WEBHOOK_SECRET}"
            "razorpay-key-id=${RAZORPAY_KEY_ID}"
            "razorpay-key-secret=${RAZORPAY_KEY_SECRET}"
            "razorpay-webhook=${RAZORPAY_WEBHOOK_SECRET}"
          )
          env_vars=(
            'DATABASE_URL=secretref:database-url'
            'DATABASE_SYSTEM_URL=secretref:database-system-url'
            'BETTER_AUTH_SECRET=secretref:better-auth-secret'
            'LYRASHIELD_INTERNAL_API_KEY=secretref:internal-api-key'
            'LYRASHIELD_DEPLOYMENT_ENVIRONMENT=billing-staging'
            'BILLING_STAGING_ADMISSION=restricted'
            'BILLING_STAGING_ACCESS_TOKEN=secretref:billing-staging-access'
            # Two real browser actors each sign up, sign out, and sign in during proof.
            'RATE_LIMIT_AUTH_MAX=1000'
            "BILLING_STAGING_REGION=${BILLING_STAGING_REGION}"
            'REDIS_URL=secretref:redis-url'
            "BETTER_AUTH_URL=${APP_URL}"
            "NEXT_PUBLIC_APP_URL=${APP_URL}"
            'NEXT_PUBLIC_MARKETING_URL=https://lyrashieldai.com'
            "PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS}"
            "LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION}"
            'TRUSTED_PROXY_IP_HEADER=x-forwarded-for'
            "POLAR_ENVIRONMENT=${POLAR_ENVIRONMENT}"
            'POLAR_ACCESS_TOKEN=secretref:polar-access-token'
            "POLAR_ORG_ID=${POLAR_ORG_ID}"
            'POLAR_WEBHOOK_SECRET=secretref:polar-webhook'
            "POLAR_PRODUCT_IDS=${POLAR_PRODUCT_IDS}"
            "POLAR_LOCAL_PRODUCT_IDS=${POLAR_LOCAL_PRODUCT_IDS}"
            'POLAR_BILLING_ADMISSION=off'
            'POLAR_LOCAL_BILLING_ADMISSION=off'
            'RAZORPAY_KEY_ID=secretref:razorpay-key-id'
            'RAZORPAY_KEY_SECRET=secretref:razorpay-key-secret'
            'RAZORPAY_WEBHOOK_SECRET=secretref:razorpay-webhook'
            "RAZORPAY_PLAN_IDS=${RAZORPAY_PLAN_IDS}"
            'RAZORPAY_BILLING_ADMISSION=off'
            'RAZORPAY_LOCAL_BILLING_ADMISSION=off'
            'BILLING_CANARY_WORKSPACE_IDS='
            "BILLING_USD_INR_RATE=${BILLING_USD_INR_RATE}"
            "LYRASHIELD_KEY_VAULT_NAME=${KEY_VAULT_NAME}"
            "AZURE_CLIENT_ID=${APP_IDENTITY_CLIENT_ID}"
            "LICENSE_SIGNING_KEY_ID=${LICENSE_SIGNING_KEY_ID}"
            'LICENSE_SIGNING_PRIVATE_KEY_SECRET_NAME=license-signing-private-key'
            'LICENSE_SIGNING_PUBLIC_KEY_SECRET_NAME=license-signing-public-key'
            'LICENSE_PUBLISHED_BUILD=0.1.0'
          )

          if [ -n "${RAZORPAY_WEBHOOK_PREVIOUS_SECRET:-}" ]; then
            secrets+=("razorpay-webhook-previous=${RAZORPAY_WEBHOOK_PREVIOUS_SECRET}")
            env_vars+=('RAZORPAY_WEBHOOK_PREVIOUS_SECRET=secretref:razorpay-webhook-previous')
          fi

          if az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            retry_containerapp_write "billing staging identity assignment" \
              az containerapp identity assign \
              --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
              --user-assigned "$PULL_IDENTITY_ID" "$APP_IDENTITY_ID" --output none
            retry_containerapp_write "billing staging registry configuration" \
              az containerapp registry set \
              --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
              --server "$REGISTRY" --identity "$PULL_IDENTITY_ID" --output none
            retry_containerapp_write "billing staging secret configuration" \
              az containerapp secret set \
              --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
              --secrets "${secrets[@]}" --output none
            retry_containerapp_write "billing staging revision update" \
              az containerapp update \
              --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
              --image "$web_image" --min-replicas 1 --max-replicas 1 \
              --set-env-vars "${env_vars[@]}" \
              --tags environment=billing-staging "source-sha=${IMAGE_SHA}" \
              --output none
          else
            az containerapp create \
              --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_ENVIRONMENT" \
              --image "$web_image" \
              --registry-server "$REGISTRY" --registry-identity "$PULL_IDENTITY_ID" \
              --user-assigned "$PULL_IDENTITY_ID" "$APP_IDENTITY_ID" \
              --ingress external --target-port 3000 --transport auto \
              --min-replicas 1 --max-replicas 1 \
              --secrets "${secrets[@]}" \
              --env-vars "${env_vars[@]}" \
              --tags environment=billing-staging "source-sha=${IMAGE_SHA}" \
              --output none
          fi

          restrictions=$(az containerapp ingress access-restriction list \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query 'length(@)' --output tsv)
          [ "$restrictions" = "0" ] || {
            echo "::error::Provider webhook ingress requires the application-level staging gate."
            exit 1
          }

          fqdn=$(az containerapp show \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          deployed_image=$(az containerapp show \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' --output tsv)
          target_revision=$(az containerapp show \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.latestRevisionName --output tsv)
          [ "https://${fqdn}" = "$APP_URL" ]
          [ "$deployed_image" = "$web_image" ]
          [ -n "$target_revision" ]
          echo "STAGING_REVISION=${target_revision}" >> "$GITHUB_ENV"

          for _ in {1..30}; do
            revision_state=$(az containerapp revision show \
              --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
              --revision "$target_revision" \
              --query "join('|', [properties.provisioningState, properties.healthState, to_string(properties.trafficWeight), properties.template.containers[0].image])" \
              --output tsv 2>/dev/null || true)
            if [ "$revision_state" = "Provisioned|Healthy|100|${web_image}" ]; then
              break
            fi
            sleep 10
          done
          [ "$revision_state" = "Provisioned|Healthy|100|${web_image}" ] || {
            echo "::error::Billing staging revision ${target_revision} did not become healthy at 100% traffic."
            exit 1
          }
          curl --fail --silent --show-error --max-time 10 "${APP_URL}/api/ready" >/dev/null
          access_headers=$(mktemp)
          trap 'rm -f "$access_headers"' EXIT
          access_status=$(curl --silent --show-error --output /dev/null --dump-header "$access_headers" \
            --write-out '%{http_code}' --max-time 10 --request POST \
            --header "Origin: ${APP_URL}" \
            --data-urlencode "token=${STAGING_ACCESS_TOKEN}" \
            "${APP_URL}/api/staging/access")
          [ "$access_status" = "303" ] || {
            echo "::error::Restricted staging access handshake failed with HTTP ${access_status}."
            exit 1
          }
          grep -Fqi "location: ${APP_URL}/sign-up" "$access_headers"
          grep -Fqi 'set-cookie: __Host-lyrashield-billing-staging=' "$access_headers"
          grep -Fqi 'httponly' "$access_headers"
          grep -Fqi 'secure' "$access_headers"
          [ "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "${APP_URL}/sign-up")" = "404" ]
          [ "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "${APP_URL}/staging/access")" = "200" ]
          [ "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 --request POST "${APP_URL}/billing/webhook")" = "400" ]

          {
            echo "### Billing staging deployed"
            echo "- Source SHA: \`${IMAGE_SHA}\`"
            echo "- Web digest: \`${WEB_DIGEST}\`"
            echo "- Migration digest: \`${MIGRATION_DIGEST}\`"
            echo "- External ingress is application-gated; only access bootstrap, signed webhook, and health/readiness paths are public."
            echo "- Production admission modes remain \`off\`; sandbox/test checkout requires the HttpOnly restricted staging session."
            echo "- Web system DB client: non-superuser, NOREPLICATION, NOBYPASSRLS \`app_system_staging\`, limited to license tables."
            echo "- Teardown after evidence capture: \`az group delete --name ${RESOURCE_GROUP}\` (founder approval required)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run proof with disposable E2E evidence role
        if: inputs.verify_provider_receipt || inputs.prepare_razorpay_checkout || inputs.prepare_polar_checkout
        shell: bash
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          STAGING_ACCESS_TOKEN: ${{ secrets.STAGING_BILLING_ACCESS_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.LYRASHIELD_INTERNAL_API_KEY }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          migration_image="${REGISTRY}/lyrashield-migrate@${MIGRATION_DIGEST}"
          e2e_image="${REGISTRY}/lyrashield-billing-e2e@${E2E_DIGEST}"
          job_suffix=${GITHUB_RUN_ID: -10}
          role_job="lyra-e2e-role-${job_suffix}"
          proof_job="lyra-bill-proof-${job_suffix}"
          recovery_job="lyra-e2e-pre-${job_suffix}"
          warm_job="lyra-e2e-warm-${job_suffix}"
          LAST_JOB_EXECUTION=""

          wait_for_job() {
            local job=$1 execution status container_name provisioning_state
            local configured_secrets template_secret_refs expected_setting expected_secret expected_name expected_value actual_value template_ready
            shift
            template_ready=false
            for _ in {1..60}; do
              provisioning_state=$(az containerapp job show \
                --name "$job" --resource-group "$RESOURCE_GROUP" \
                --query properties.provisioningState --output tsv)
              case "$provisioning_state" in
                Succeeded)
                  configured_secrets=" $(az containerapp job secret list \
                    --name "$job" --resource-group "$RESOURCE_GROUP" \
                    --query '[].name' --output tsv 2>/dev/null | tr '\t\r\n' '   ' || true) "
                  template_secret_refs=" $(az containerapp job show \
                    --name "$job" --resource-group "$RESOURCE_GROUP" \
                    --query 'properties.template.containers[].env[].secretRef' \
                    --output tsv 2>/dev/null | tr '\t\r\n' '   ' || true) "
                  template_ready=true
                  for expected_setting in "$@"; do
                    if [[ "$expected_setting" == *=* ]]; then
                      expected_name=${expected_setting%%=*}
                      expected_value=${expected_setting#*=}
                      actual_value=$(az containerapp job show \
                        --name "$job" --resource-group "$RESOURCE_GROUP" \
                        --query "properties.template.containers[0].env[?name=='${expected_name}'].value | [0]" \
                        --output tsv 2>/dev/null || true)
                      [ "$actual_value" = "$expected_value" ] && continue
                    else
                      printf -v expected_secret '%s-%s' "$expected_setting" "$job"
                      if [[ "$configured_secrets" == *" ${expected_secret} "* && \
                        "$template_secret_refs" == *" ${expected_secret} "* ]]; then
                        continue
                      fi
                    fi
                    template_ready=false
                    break
                  done
                  $template_ready && break
                  ;;
                Failed)
                  echo "::error::${job} failed to provision."
                  return 1
                  ;;
              esac
              sleep 5
            done
            if [ "$provisioning_state" != "Succeeded" ] || ! $template_ready; then
              echo "::error::Timed out applying the secret-bearing template for ${job}."
              return 1
            fi
            execution=$(.github/scripts/start-billing-staging-job.sh "$job" "$RESOURCE_GROUP")
            for _ in {1..180}; do
              if ! status=$(az containerapp job execution show \
                --name "$job" --resource-group "$RESOURCE_GROUP" \
                --job-execution-name "$execution" \
                --query properties.status --output tsv 2>/dev/null); then
                # Azure can accept a job start before its execution is queryable.
                sleep 10
                continue
              fi
              case "$status" in
                Succeeded)
                  LAST_JOB_EXECUTION="$execution"
                  return 0
                  ;;
                Failed|Stopped)
                  echo "::error::${job} ended with ${status}."
                  container_name=$(az containerapp job show \
                    --name "$job" \
                    --resource-group "$RESOURCE_GROUP" \
                    --query 'properties.template.containers[0].name' \
                    --output tsv)
                  az containerapp job execution show \
                    --name "$job" \
                    --resource-group "$RESOURCE_GROUP" \
                    --job-execution-name "$execution" \
                    --query '{name:name,status:properties.status,startTime:properties.startTime,endTime:properties.endTime}' \
                    --output jsonc || true
                  az containerapp job replica list \
                    --name "$job" \
                    --resource-group "$RESOURCE_GROUP" \
                    --execution "$execution" \
                    --output jsonc || true
                  az containerapp job logs show \
                    --name "$job" \
                    --resource-group "$RESOURCE_GROUP" \
                    --execution "$execution" \
                    --container "$container_name" \
                    --tail 300 \
                    --format text || true
                  return 1
                  ;;
              esac
              sleep 10
            done
            echo "::error::Timed out waiting for ${job}."
            return 1
          }

          stop_job_executions() {
            local job=$1 active
            active=$(az containerapp job execution list \
              --name "$job" --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.status!='Succeeded' && properties.status!='Failed' && properties.status!='Stopped'].name" \
              --output tsv)
            if [ -n "$active" ]; then
              az containerapp job stop \
                --name "$job" --resource-group "$RESOURCE_GROUP" --output none
            fi
            for _ in {1..60}; do
              active=$(az containerapp job execution list \
                --name "$job" --resource-group "$RESOURCE_GROUP" \
                --query "[?properties.status!='Succeeded' && properties.status!='Failed' && properties.status!='Stopped'].name" \
                --output tsv)
              [ -z "$active" ] && return 0
              sleep 5
            done
            echo "::error::Timed out stopping active executions for ${job}."
            return 1
          }

          cleanup() {
            local outcome=$?
            set +e
            if az containerapp job show --name "$proof_job" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
              if stop_job_executions "$proof_job"; then
                az containerapp job delete --name "$proof_job" --resource-group "$RESOURCE_GROUP" --yes --output none
              else
                outcome=1
              fi
            fi
            if az containerapp job show --name "$warm_job" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
              if stop_job_executions "$warm_job"; then
                az containerapp job delete --name "$warm_job" --resource-group "$RESOURCE_GROUP" --yes --output none
              else
                outcome=1
              fi
            fi
            if az containerapp job show --name "$role_job" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
              if ! stop_job_executions "$role_job"; then
                outcome=1
              else
                az containerapp job update \
                  --name "$role_job" --resource-group "$RESOURCE_GROUP" \
                  --set-env-vars 'E2E_ROLE_ACTION=drop' --output none
                if ! wait_for_job "$role_job" database-admin-url e2e-password E2E_ROLE_ACTION=drop; then
                  outcome=1
                elif stop_job_executions "$role_job"; then
                  az containerapp job delete --name "$role_job" --resource-group "$RESOURCE_GROUP" --yes --output none
                else
                  outcome=1
                fi
              fi
            fi
            return "$outcome"
          }
          trap cleanup EXIT

          for stale_job in \
            "$proof_job" "$role_job" "$recovery_job" "$warm_job" \
            lyrashield-stage-billing-proof lyrashield-stage-e2e-role lyrashield-stage-e2e-cleanup; do
            if az containerapp job show --name "$stale_job" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
              stop_job_executions "$stale_job"
              az containerapp job delete \
                --name "$stale_job" --resource-group "$RESOURCE_GROUP" --yes --output none
            fi
          done

          # A previous runner may have disappeared after creating the database
          # role. Drop that stale role before minting a new credential.
          JOB_SECRET_SPECS='database-admin-url=DATABASE_ADMIN_URL' \
            JOB_ENV_SPECS=$(printf '%s\n' \
              'DATABASE_ADMIN_URL=secretref:database-admin-url' \
              'E2E_ROLE_ACTION=drop') \
            .github/scripts/create-billing-staging-job.sh \
            "$recovery_job" "$migration_image" \
            /app/packages/db/scripts/manage-billing-staging-e2e-role.mjs 1200
          wait_for_job "$recovery_job" database-admin-url E2E_ROLE_ACTION=drop
          stop_job_executions "$recovery_job"
          az containerapp job delete \
            --name "$recovery_job" --resource-group "$RESOURCE_GROUP" --yes --output none

          # A credential-free image start can absorb a transient Azure
          # placement failure. The provider-capable proof remains single-attempt.
          JOB_REPLICA_RETRY_LIMIT=1 \
            .github/scripts/create-billing-staging-job.sh \
            "$warm_job" "$e2e_image" /bin/true 300
          wait_for_job "$warm_job"
          stop_job_executions "$warm_job"
          az containerapp job delete \
            --name "$warm_job" --resource-group "$RESOURCE_GROUP" --yes --output none

          e2e_password=$(openssl rand -hex 32)
          e2e_database_url=$(E2E_PASSWORD="$e2e_password" node -e '
            const url = new URL(process.env.DATABASE_ADMIN_URL);
            url.username = "billing_e2e_staging";
            url.password = process.env.E2E_PASSWORD;
            url.searchParams.set("sslmode", "verify-full");
            process.stdout.write(url.toString());
          ')
          echo "::add-mask::${e2e_password}"
          echo "::add-mask::${e2e_database_url}"

          E2E_JOB_PASSWORD="$e2e_password" \
            JOB_SECRET_SPECS=$(printf '%s\n' \
              'database-admin-url=DATABASE_ADMIN_URL' \
              'e2e-password=E2E_JOB_PASSWORD') \
            JOB_ENV_SPECS=$(printf '%s\n' \
              'DATABASE_ADMIN_URL=secretref:database-admin-url' \
              'E2E_PASSWORD=secretref:e2e-password' \
              'E2E_ROLE_ACTION=provision') \
            .github/scripts/create-billing-staging-job.sh \
            "$role_job" "$migration_image" \
            /app/packages/db/scripts/manage-billing-staging-e2e-role.mjs 1200
          wait_for_job "$role_job" database-admin-url e2e-password E2E_ROLE_ACTION=provision

          expected_base_host=${APP_URL#https://}
          proof_secret_specs=$(printf '%s\n' \
            'e2e-database-url=E2E_JOB_DATABASE_URL' \
            'staging-access=STAGING_ACCESS_TOKEN' \
            'better-auth-secret=BETTER_AUTH_SECRET' \
            'internal-api-key=INTERNAL_API_KEY' \
            'polar-access-token=POLAR_ACCESS_TOKEN' \
            'polar-webhook=POLAR_WEBHOOK_SECRET' \
            'razorpay-key-id=RAZORPAY_KEY_ID' \
            'razorpay-key-secret=RAZORPAY_KEY_SECRET' \
            'razorpay-webhook=RAZORPAY_WEBHOOK_SECRET')
          proof_env=(
            'NODE_ENV=production'
            'CI=1'
            'DATABASE_URL=secretref:e2e-database-url'
            'DATABASE_SYSTEM_URL=secretref:e2e-database-url'
            'BILLING_E2E_DATABASE_URL=secretref:e2e-database-url'
            'BETTER_AUTH_SECRET=secretref:better-auth-secret'
            'LYRASHIELD_INTERNAL_API_KEY=secretref:internal-api-key'
            'BILLING_E2E_STAGING_ACCESS_TOKEN=secretref:staging-access'
            'BILLING_STAGING_ACCESS_TOKEN=secretref:staging-access'
            'POLAR_ACCESS_TOKEN=secretref:polar-access-token'
            'POLAR_WEBHOOK_SECRET=secretref:polar-webhook'
            'RAZORPAY_KEY_ID=secretref:razorpay-key-id'
            'RAZORPAY_KEY_SECRET=secretref:razorpay-key-secret'
            'RAZORPAY_WEBHOOK_SECRET=secretref:razorpay-webhook'
            "LYRASHIELD_E2E_BASE_URL=${APP_URL}"
            'BILLING_E2E_ALLOW_REMOTE=1'
            "BILLING_E2E_EXPECTED_BASE_HOST=${expected_base_host}"
            'BILLING_E2E_DISPOSABLE_CONFIRM=DELETE DISPOSABLE BILLING DATA'
            "BILLING_E2E_EXPECTED_DATABASE_HOST=${DATABASE_HOST}"
            "BILLING_E2E_EXPECTED_DATABASE=${DATABASE_NAME}"
            "BETTER_AUTH_URL=${APP_URL}"
            "NEXT_PUBLIC_APP_URL=${APP_URL}"
            'NEXT_PUBLIC_MARKETING_URL=https://lyrashieldai.com'
            'TRUSTED_PROXY_IP_HEADER=x-forwarded-for'
            'LYRASHIELD_REQUIRE_EMAIL_VERIFICATION=0'
            "PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS}"
            'LYRASHIELD_DEPLOYMENT_ENVIRONMENT=billing-staging'
            'BILLING_STAGING_ADMISSION=restricted'
            "BILLING_STAGING_REGION=${BILLING_STAGING_REGION}"
            "PREPARE_RAZORPAY_CHECKOUT=${{ inputs.prepare_razorpay_checkout }}"
            "PREPARE_POLAR_CHECKOUT=${{ inputs.prepare_polar_checkout }}"
            "BILLING_RECEIPT_PROVIDER=${{ inputs.receipt_provider }}"
            "BILLING_RECEIPT_EVENT_ID=${{ inputs.receipt_event_id }}"
            "BILLING_RECEIPT_RESOLVE_RAZORPAY_SUBSCRIPTION_CHARGE=${{ inputs.receipt_resolve_razorpay_subscription_charge }}"
            "BILLING_RECEIPT_RESOLVE_RAZORPAY_SUBSCRIPTION_CANCELLATION=${{ inputs.receipt_resolve_razorpay_subscription_cancellation }}"
            "BILLING_RECEIPT_RESOLVE_POLAR_SUBSCRIPTION_PURCHASE=${{ inputs.receipt_resolve_polar_subscription_purchase }}"
            "BILLING_RECEIPT_RESOLVE_POLAR_SUBSCRIPTION_CANCELLATION=${{ inputs.receipt_resolve_polar_subscription_cancellation }}"
            "BILLING_RECEIPT_WORKSPACE_ID=${{ inputs.receipt_workspace_id }}"
            "BILLING_RECEIPT_KIND=${{ inputs.receipt_kind }}"
            "BILLING_RECEIPT_PHASE=${{ inputs.receipt_phase || 'purchase' }}"
            "BILLING_RECEIPT_OBJECT_ID=${{ inputs.receipt_object_id }}"
            "BILLING_RECEIPT_PLAN=${{ inputs.receipt_plan }}"
            "BILLING_RECEIPT_INTERVAL=${{ inputs.receipt_interval }}"
            "BILLING_RECEIPT_STATUS=${{ inputs.receipt_status }}"
            "BILLING_RECEIPT_MINUTES=${{ inputs.receipt_minutes }}"
            "BILLING_RECEIPT_REMAINING_MINUTES=${{ inputs.receipt_remaining_minutes }}"
            "BILLING_RECEIPT_COMMISSION_COUNT=${{ inputs.receipt_commission_count }}"
            "BILLING_RECEIPT_COMMISSION_STATUS=${{ inputs.receipt_commission_status }}"
            "BILLING_RECEIPT_AUDIT_ACTION=${{ inputs.receipt_audit_action }}"
            "BILLING_RECEIPT_AUDIT_RESOURCE_ID=${{ inputs.receipt_audit_resource_id }}"
            "BILLING_RECEIPT_AUDIT_COUNT=${{ inputs.receipt_audit_count }}"
            "BILLING_RECEIPT_SOURCE_SHA=${IMAGE_SHA}"
            "BILLING_RECEIPT_WEB_DIGEST=${WEB_DIGEST}"
            "BILLING_RECEIPT_MIGRATION_DIGEST=${MIGRATION_DIGEST}"
            "BILLING_RECEIPT_E2E_DIGEST=${E2E_DIGEST}"
            "BILLING_RECEIPT_REVISION=${STAGING_REVISION}"
            'POLAR_BILLING_ADMISSION=off'
            'POLAR_LOCAL_BILLING_ADMISSION=off'
            'RAZORPAY_BILLING_ADMISSION=off'
            'RAZORPAY_LOCAL_BILLING_ADMISSION=off'
            "POLAR_ENVIRONMENT=${POLAR_ENVIRONMENT}"
            "POLAR_ORG_ID=${POLAR_ORG_ID}"
            "POLAR_PRODUCT_IDS=${POLAR_PRODUCT_IDS}"
            "POLAR_LOCAL_PRODUCT_IDS=${POLAR_LOCAL_PRODUCT_IDS}"
            "RAZORPAY_PLAN_IDS=${RAZORPAY_PLAN_IDS}"
            "BILLING_USD_INR_RATE=${BILLING_USD_INR_RATE}"
          )
          proof_command=/app/e2e/billing/run-staging-proof.sh
          if [ "${{ inputs.prepare_razorpay_checkout }}" = "true" ]; then
            [ "$BILLING_STAGING_REGION" = "inr" ] || {
              echo "::error::Razorpay Test checkout preparation requires INR staging."
              exit 1
            }
            proof_command=/app/e2e/billing/prepare-razorpay-checkout.sh
          elif [ "${{ inputs.prepare_polar_checkout }}" = "true" ]; then
            [ "$BILLING_STAGING_REGION" = "usd" ] || {
              echo "::error::Polar Sandbox checkout preparation requires USD staging."
              exit 1
            }
            proof_command=/app/e2e/billing/prepare-polar-checkout.sh
          fi

          E2E_JOB_DATABASE_URL="$e2e_database_url" \
            JOB_SECRET_SPECS="$proof_secret_specs" \
            JOB_ENV_SPECS=$(printf '%s\n' "${proof_env[@]}") \
            .github/scripts/create-billing-staging-job.sh \
            "$proof_job" "$e2e_image" "$proof_command" 1800
          wait_for_job "$proof_job" \
            e2e-database-url staging-access better-auth-secret internal-api-key \
            polar-access-token polar-webhook razorpay-key-id razorpay-key-secret razorpay-webhook \
            "BILLING_STAGING_REGION=${BILLING_STAGING_REGION}" "POLAR_ENVIRONMENT=${POLAR_ENVIRONMENT}"

          proof_container=$(az containerapp job show \
            --name "$proof_job" --resource-group "$RESOURCE_GROUP" \
            --query 'properties.template.containers[0].name' --output tsv)
          proof_log=$(mktemp)
          az containerapp job logs show \
            --name "$proof_job" --resource-group "$RESOURCE_GROUP" \
            --execution "$LAST_JOB_EXECUTION" --container "$proof_container" \
            --tail 300 --format text | tee "$proof_log"
          if [ "${{ inputs.prepare_razorpay_checkout }}" = "true" ]; then
            checkout_marker=$(grep -F 'Razorpay-checkout-v1 ' "$proof_log" | tail -1 || true)
            [ -n "$checkout_marker" ] || {
              echo "::error::Razorpay Test checkout preparation produced no checkout marker."
              exit 1
            }
            echo "Razorpay Test checkout prepared for controlled browser payment." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.prepare_polar_checkout }}" = "true" ]; then
            checkout_marker=$(grep -F 'Polar-checkout-v1 ' "$proof_log" | tail -1 || true)
            [ -n "$checkout_marker" ] || {
              echo "::error::Polar Sandbox checkout preparation produced no checkout marker."
              exit 1
            }
            echo "Polar Sandbox checkout prepared for controlled browser payment." >> "$GITHUB_STEP_SUMMARY"
          else
            receipt_marker=$(grep -F 'Provider-delivered ' "$proof_log" | tail -1 || true)
            artifact_marker=$(grep -F 'Provider-receipt-artifact-v1 ' "$proof_log" | tail -1 || true)
            artifact_path="${RUNNER_TEMP}/billing-provider-receipt.json"
            printf '%s' "${artifact_marker#*Provider-receipt-artifact-v1 }" | base64 --decode > "$artifact_path"
            jq -e '.schemaVersion == 1 and .workflowCleanupResult == "pending" and (.artifactChecksum | test("^[0-9a-f]{64}$"))' "$artifact_path" >/dev/null
            node -e '
            const fs = require("node:fs");
            const { createHash } = require("node:crypto");
            const path = process.argv[1];
            const receipt = JSON.parse(fs.readFileSync(path, "utf8"));
            const expected = receipt.artifactChecksum;
            delete receipt.artifactChecksum;
            const actual = createHash("sha256").update(JSON.stringify(receipt)).digest("hex");
            if (actual !== expected) throw new Error("Provider receipt artifact checksum mismatch");
            ' "$artifact_path"
            echo "RECEIPT_ARTIFACT_PATH=${artifact_path}" >> "$GITHUB_ENV"
            [ -n "$receipt_marker" ] && [ -n "$artifact_marker" ] || {
              echo "::error::Successful billing proof logs did not contain a provider-delivered receipt marker."
              exit 1
            }
          fi
          rm -f "$proof_log"
          if [ "${{ inputs.prepare_razorpay_checkout }}" = "true" ]; then
            provider_mode="Razorpay Test Mode checkout prepared"
          elif [ "${{ inputs.prepare_polar_checkout }}" = "true" ]; then
            provider_mode="Polar Sandbox checkout prepared"
          elif [ "$BILLING_STAGING_REGION" = "usd" ]; then
            provider_mode="Polar Sandbox"
          else
            provider_mode="Razorpay Test Mode"
          fi
          {
            echo "### Billing staging proof passed"
            echo "- Source SHA: \`${IMAGE_SHA}\`"
            echo "- E2E digest: \`${E2E_DIGEST}\`"
            echo "- Region/provider: \`${BILLING_STAGING_REGION}\` / ${provider_mode}"
            if [ "${{ inputs.prepare_razorpay_checkout }}" = "true" ] || [ "${{ inputs.prepare_polar_checkout }}" = "true" ]; then
              echo "- Checkout preparation: no provider-delivered receipt verified yet."
            else
              echo "- Receipt verifier: provider-delivered webhook and app effect confirmed"
            fi
            echo "- Production admission modes remained \`off\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recover and remove disposable E2E database access
        id: cleanup-e2e
        if: ${{ always() && steps.azure-login.outcome == 'success' }}
        shell: bash
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          set -euo pipefail
          [ -n "${MIGRATION_DIGEST:-}" ] || exit 0
          migration_image="${REGISTRY}/lyrashield-migrate@${MIGRATION_DIGEST}"
          job_suffix=${GITHUB_RUN_ID: -10}
          role_job="lyra-e2e-role-${job_suffix}"
          proof_job="lyra-bill-proof-${job_suffix}"
          preflight_job="lyra-e2e-pre-${job_suffix}"
          recovery_job="lyra-e2e-post-${job_suffix}"
          warm_job="lyra-e2e-warm-${job_suffix}"

          stop_job_executions() {
            local job=$1 active
            active=$(az containerapp job execution list \
              --name "$job" --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.status!='Succeeded' && properties.status!='Failed' && properties.status!='Stopped'].name" \
              --output tsv)
            if [ -n "$active" ]; then
              az containerapp job stop \
                --name "$job" --resource-group "$RESOURCE_GROUP" --output none
            fi
            for _ in {1..60}; do
              active=$(az containerapp job execution list \
                --name "$job" --resource-group "$RESOURCE_GROUP" \
                --query "[?properties.status!='Succeeded' && properties.status!='Failed' && properties.status!='Stopped'].name" \
                --output tsv)
              [ -z "$active" ] && return 0
              sleep 5
            done
            echo "::error::Timed out stopping active executions for ${job}."
            return 1
          }

          purge_job() {
            local job=$1
            if az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
              stop_job_executions "$job" || return 1
              az containerapp job delete \
                --name "$job" --resource-group "$RESOURCE_GROUP" --yes --output none
            fi
          }

          purge_all_jobs() {
            local outcome=0
            purge_job "$proof_job" \
              e2e-database-url staging-access better-auth-secret internal-api-key \
              polar-access-token polar-webhook razorpay-key-id razorpay-key-secret razorpay-webhook || outcome=1
            purge_job "$role_job" database-admin-url e2e-password || outcome=1
            purge_job "$preflight_job" database-admin-url || outcome=1
            purge_job "$recovery_job" database-admin-url || outcome=1
            purge_job "$warm_job" || outcome=1
            purge_job lyrashield-stage-billing-proof \
              e2e-database-url staging-access better-auth-secret internal-api-key \
              polar-access-token polar-webhook razorpay-key-id razorpay-key-secret razorpay-webhook || outcome=1
            purge_job lyrashield-stage-e2e-role database-admin-url e2e-password || outcome=1
            purge_job lyrashield-stage-e2e-cleanup database-admin-url || outcome=1
            return "$outcome"
          }

          cleanup_on_exit() {
            local outcome=$?
            set +e
            purge_all_jobs || outcome=1
            trap - EXIT
            exit "$outcome"
          }
          trap cleanup_on_exit EXIT
          purge_all_jobs

          wait_for_job() {
            local job=$1 execution status container_name provisioning_state
            local configured_secrets template_secret_refs expected_setting expected_secret expected_name expected_value actual_value template_ready
            shift
            template_ready=false
            for _ in {1..60}; do
              provisioning_state=$(az containerapp job show \
                --name "$job" --resource-group "$RESOURCE_GROUP" \
                --query properties.provisioningState --output tsv)
              case "$provisioning_state" in
                Succeeded)
                  configured_secrets=" $(az containerapp job secret list \
                    --name "$job" --resource-group "$RESOURCE_GROUP" \
                    --query '[].name' --output tsv 2>/dev/null | tr '\t\r\n' '   ' || true) "
                  template_secret_refs=" $(az containerapp job show \
                    --name "$job" --resource-group "$RESOURCE_GROUP" \
                    --query 'properties.template.containers[].env[].secretRef' \
                    --output tsv 2>/dev/null | tr '\t\r\n' '   ' || true) "
                  template_ready=true
                  for expected_setting in "$@"; do
                    if [[ "$expected_setting" == *=* ]]; then
                      expected_name=${expected_setting%%=*}
                      expected_value=${expected_setting#*=}
                      actual_value=$(az containerapp job show \
                        --name "$job" --resource-group "$RESOURCE_GROUP" \
                        --query "properties.template.containers[0].env[?name=='${expected_name}'].value | [0]" \
                        --output tsv 2>/dev/null || true)
                      [ "$actual_value" = "$expected_value" ] && continue
                    else
                      printf -v expected_secret '%s-%s' "$expected_setting" "$job"
                      if [[ "$configured_secrets" == *" ${expected_secret} "* && \
                        "$template_secret_refs" == *" ${expected_secret} "* ]]; then
                        continue
                      fi
                    fi
                    template_ready=false
                    break
                  done
                  $template_ready && break
                  ;;
                Failed)
                  echo "::error::${job} failed to provision."
                  return 1
                  ;;
              esac
              sleep 5
            done
            if [ "$provisioning_state" != "Succeeded" ] || ! $template_ready; then
              echo "::error::Timed out applying the secret-bearing template for ${job}."
              return 1
            fi
            execution=$(.github/scripts/start-billing-staging-job.sh "$job" "$RESOURCE_GROUP")
            for _ in {1..150}; do
              if ! status=$(az containerapp job execution show \
                --name "$job" --resource-group "$RESOURCE_GROUP" \
                --job-execution-name "$execution" \
                --query properties.status --output tsv 2>/dev/null); then
                # Azure can accept a job start before its execution is queryable.
                sleep 10
                continue
              fi
              case "$status" in
                Succeeded) return 0 ;;
                Failed|Stopped)
                  echo "::error::${job} ended with ${status}."
                  container_name=$(az containerapp job show \
                    --name "$job" \
                    --resource-group "$RESOURCE_GROUP" \
                    --query 'properties.template.containers[0].name' \
                    --output tsv)
                  az containerapp job execution show \
                    --name "$job" \
                    --resource-group "$RESOURCE_GROUP" \
                    --job-execution-name "$execution" \
                    --query '{name:name,status:properties.status,startTime:properties.startTime,endTime:properties.endTime}' \
                    --output jsonc || true
                  az containerapp job replica list \
                    --name "$job" \
                    --resource-group "$RESOURCE_GROUP" \
                    --execution "$execution" \
                    --output jsonc || true
                  az containerapp job logs show \
                    --name "$job" \
                    --resource-group "$RESOURCE_GROUP" \
                    --execution "$execution" \
                    --container "$container_name" \
                    --tail 300 \
                    --format text || true
                  return 1
                  ;;
              esac
              sleep 10
            done
            echo "::error::Timed out waiting for ${job}."
            return 1
          }

          # This fresh admin-only job is independent of the proof job and can
          # recover after cancellation. The next run repeats it before provision.
          JOB_SECRET_SPECS='database-admin-url=DATABASE_ADMIN_URL' \
            JOB_ENV_SPECS=$(printf '%s\n' \
              'DATABASE_ADMIN_URL=secretref:database-admin-url' \
              'E2E_ROLE_ACTION=drop') \
            .github/scripts/create-billing-staging-job.sh \
            "$recovery_job" "$migration_image" \
            /app/packages/db/scripts/manage-billing-staging-e2e-role.mjs 1200
          wait_for_job "$recovery_job" database-admin-url E2E_ROLE_ACTION=drop
          purge_job "$recovery_job" database-admin-url

      - name: Finalize redacted provider receipt
        if: inputs.verify_provider_receipt
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const { createHash } = require("node:crypto");
            const path = process.argv[1];
            const receipt = JSON.parse(fs.readFileSync(path, "utf8"));
            receipt.workflowCleanupResult = "passed";
            delete receipt.artifactChecksum;
            receipt.artifactChecksum = createHash("sha256")
              .update(JSON.stringify(receipt))
              .digest("hex");
            fs.writeFileSync(path, JSON.stringify(receipt) + "\n", { mode: 0o600 });
          ' "$RECEIPT_ARTIFACT_PATH"

      - name: Upload redacted provider receipt
        if: inputs.verify_provider_receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: billing-provider-receipt-${{ github.run_id }}
          path: ${{ env.RECEIPT_ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 90
