# DEV ONLY — do NOT use in production. Bind ports to localhost, no TLS,
# predictable credentials. Use managed Postgres/Redis in production.
services:
  marketing:
    profiles: ["marketing"]
    build:
      # Keep generated marketing output outside the web/worker build context.
      context: apps/marketing
      dockerfile: Dockerfile.preview
    container_name: lyrashield-marketing
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8787/"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: lyrashield-postgres
    restart: unless-stopped
    # DEV ONLY: predictable local credentials. Never reuse in production.
    environment:
      POSTGRES_USER: lyrashield
      POSTGRES_PASSWORD: lyrashield
      POSTGRES_DB: lyrashield
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyrashield"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: lyrashield-redis
    restart: unless-stopped
    # DEV ONLY: weak default password. Rotate before any shared environment.
    command: redis-server --requirepass "${REDIS_PASSWORD:-lyrashield-dev-redis}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lyrashield-dev-redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: workspace-builder
      additional_contexts:
        engine: "${LYRASHIELD_ENGINE_SOURCE:-../lyrashield-engine}"
    container_name: lyrashield-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DEV ONLY: plaintext local database credentials. Production uses a managed secret store.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-lyrashield}:${POSTGRES_PASSWORD:-lyrashield}@postgres:5432/${POSTGRES_DB:-lyrashield}?schema=public"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required — set it in .env or your environment}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
    working_dir: /app
    command: ["pnpm", "--filter", "@lyrashield/db", "migrate:deploy"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        BUILD_APP_URL: "http://localhost:3000"
        BUILD_PUBLIC_APP_URL: "http://localhost:3000"
        BUILD_PUBLIC_MARKETING_URL: "http://localhost:8787"
      additional_contexts:
        engine: "${LYRASHIELD_ENGINE_SOURCE:-../lyrashield-engine}"
    container_name: lyrashield-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # DEV ONLY: plaintext local database credentials. Production uses a managed secret store.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-lyrashield}:${POSTGRES_PASSWORD:-lyrashield}@postgres:5432/${POSTGRES_DB:-lyrashield}?schema=public"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required — set it in .env or your environment}"
      # Docker Compose exposes the web app on host port 3000; keep these
      # values aligned with the container port mapping below.
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_MARKETING_URL: "http://localhost:8787"
      PORT: "3000"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-lyrashield-dev-redis}@redis:6379"
      NODE_ENV: "production"
      # DEV ONLY: local Compose has no transactional mail provider. Do not inherit
      # a production verification setting and make every local request fail closed.
      LYRASHIELD_REQUIRE_EMAIL_VERIFICATION: "0"
      # This file is local-development only and binds the app to localhost.
      # Production must explicitly set this to the header its ingress strips and rewrites.
      TRUSTED_PROXY_IP_HEADER: "${TRUSTED_PROXY_IP_HEADER:-x-forwarded-for}"
      # Next standalone otherwise inherits Docker's container-ID hostname and
      # attempts to resolve it before binding the HTTP server.
      HOSTNAME: "0.0.0.0"
      # OAuth providers (all optional — empty = disabled)
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      AZURE_AD_CLIENT_ID: "${AZURE_AD_CLIENT_ID:-}"
      AZURE_AD_CLIENT_SECRET: "${AZURE_AD_CLIENT_SECRET:-}"
      AZURE_AD_TENANT_ID: "${AZURE_AD_TENANT_ID:-}"
      # GitHub App (optional)
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      # Needed to ownership-verify a first-time install; without them the
      # install callback fails closed.
      GITHUB_APP_CLIENT_ID: "${GITHUB_APP_CLIENT_ID:-}"
      GITHUB_APP_CLIENT_SECRET: "${GITHUB_APP_CLIENT_SECRET:-}"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${WEB_CPU_LIMIT:-1.0}
          memory: ${WEB_MEMORY_LIMIT:-512M}

  worker:
    image: lyrashield-worker:local
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      additional_contexts:
        engine: "${LYRASHIELD_ENGINE_SOURCE:-../lyrashield-engine}"
    container_name: lyrashield-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # DEV ONLY: plaintext local database credentials. Production uses a managed secret store.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-lyrashield}:${POSTGRES_PASSWORD:-lyrashield}@postgres:5432/${POSTGRES_DB:-lyrashield}?schema=public"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-lyrashield-dev-redis}@redis:6379"
      NODE_ENV: "development"
      # The engine asks the host Docker daemon to mount its cloned checkout.
      # Keep this path identical on the host and in the worker container.
      TMPDIR: "${LYRASHIELD_WORKER_TEMP_ROOT:-${PWD}/.lyrashield-worker-tmp}"
      # This file is local-development only and binds the app to localhost.
      # Production must explicitly set this to the header its ingress strips and rewrites.
      TRUSTED_PROXY_IP_HEADER: "${TRUSTED_PROXY_IP_HEADER:-x-forwarded-for}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      # Needed to ownership-verify a first-time install; without them the
      # install callback fails closed.
      GITHUB_APP_CLIENT_ID: "${GITHUB_APP_CLIENT_ID:-}"
      GITHUB_APP_CLIENT_SECRET: "${GITHUB_APP_CLIENT_SECRET:-}"
      # Scan engine
      LYRASHIELD_LLM: "${LYRASHIELD_LLM:-}"
      # Local defaults preserve the documented low-cost routing contract:
      # Quick/Safe/Standard use Luna; Deep uses Terra with Luna delegates.
      # Production must still set explicit deployment names through its secret
      # and configuration management boundary.
      LYRASHIELD_LUNA_LLM: "${LYRASHIELD_LUNA_LLM:-azure_ai/gpt-5.6-luna}"
      LYRASHIELD_TERRA_LLM: "${LYRASHIELD_TERRA_LLM:-azure_ai/gpt-5.6-terra}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_API_BASE: "${LLM_API_BASE:-}"
      LLM_API_VERSION: "${LLM_API_VERSION:-}"
      # DEV ONLY: local image name. Production rejects this tag and requires
      # the immutable digest emitted by the engine's publish-sandbox workflow.
      LYRASHIELD_IMAGE: "${LYRASHIELD_IMAGE:-lyrashieldai-sandbox:local}"
      LYRASHIELD_TELEMETRY: "${LYRASHIELD_TELEMETRY:-0}"
      # GPT-5.6 explicit prompt cache reads/writes; unsupported models ignore the breakpoint fields.
      LYRASHIELD_PROMPT_CACHE_EXPLICIT: "${LYRASHIELD_PROMPT_CACHE_EXPLICIT:-1}"
      LYRASHIELD_PROMPT_CACHE: "${LYRASHIELD_PROMPT_CACHE:-1}"
      LYRASHIELD_ENGINE_PATH: "${LYRASHIELD_ENGINE_PATH:-lyrashield}"
      LYRASHIELD_ENGINE_SANDBOX_NETWORK: "${LYRASHIELD_ENGINE_SANDBOX_NETWORK:-lyrashield-sandbox}"
      PLATFORM_MAX_SCAN_BUDGET_USD: "${PLATFORM_MAX_SCAN_BUDGET_USD:-50}"
      # Web Search (Parallel Search) — disabled unless an API key is configured.
      LYRASHIELD_WEB_SEARCH_ENABLED: "${LYRASHIELD_WEB_SEARCH_ENABLED:-0}"
      LYRASHIELD_WEB_SEARCH_API_KEY: "${LYRASHIELD_WEB_SEARCH_API_KEY:-}"
      LYRASHIELD_WEB_SEARCH_PROVIDER: "${LYRASHIELD_WEB_SEARCH_PROVIDER:-parallel}"
      LYRASHIELD_WEB_SEARCH_MODE: "${LYRASHIELD_WEB_SEARCH_MODE:-turbo}"
      LYRASHIELD_WEB_SEARCH_MAX_RESULTS: "${LYRASHIELD_WEB_SEARCH_MAX_RESULTS:-5}"
      LYRASHIELD_WEB_SEARCH_MAX_CHARS_TOTAL: "${LYRASHIELD_WEB_SEARCH_MAX_CHARS_TOTAL:-4000}"
      LYRASHIELD_WEB_SEARCH_MAX_CALLS_PER_SCAN: "${LYRASHIELD_WEB_SEARCH_MAX_CALLS_PER_SCAN:-50}"
      LYRASHIELD_WEB_SEARCH_BUDGET_USD: "${LYRASHIELD_WEB_SEARCH_BUDGET_USD:-1.0}"
      # Local-only encrypted evidence store; production must use S3-compatible storage.
      LYRASHIELD_LOCAL_EVIDENCE_STORAGE: "1"
      LYRASHIELD_LOCAL_EVIDENCE_DIR: "/app/.lyrashield/evidence"
      # Azure OpenAI (optional)
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"
      AZURE_OPENAI_API_BASE: "${AZURE_OPENAI_API_BASE:-}"
      # Azure AI project / serverless (optional)
      AZURE_AI_API_KEY: "${AZURE_AI_API_KEY:-}"
      AZURE_AI_API_BASE: "${AZURE_AI_API_BASE:-}"
      AZURE_API_VERSION: "${AZURE_API_VERSION:-}"
      AZURE_OPENAI_API_VERSION: "${AZURE_OPENAI_API_VERSION:-}"
    # DEV ONLY: the Docker socket is owned by root:root; add root group
    # so the non-root lyrashield user can access it for sandbox creation.
    group_add:
      - "0"
    volumes:
      # DEV ONLY: the engine launches its isolated sandbox through Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: "${LYRASHIELD_WORKER_TEMP_ROOT:-${PWD}/.lyrashield-worker-tmp}"
        target: "${LYRASHIELD_WORKER_TEMP_ROOT:-${PWD}/.lyrashield-worker-tmp}"
      - worker_runs:/app/lyrashield_runs
      - worker_evidence:/app/.lyrashield/evidence
    networks:
      - default
      - scan_sandbox
    pids_limit: ${WORKER_PIDS_LIMIT:-512}
    deploy:
      resources:
        limits:
          cpus: ${WORKER_CPU_LIMIT:-2.0}
          memory: ${WORKER_MEMORY_LIMIT:-4G}
          pids: ${WORKER_PIDS_LIMIT:-512}
    working_dir: /app
    command: ["./apps/worker/node_modules/.bin/tsx", "apps/worker/src/index.ts"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('fs').stat('/tmp/lyrashield-worker-ready',(e,s)=>process.exit(e||Date.now()-s.mtimeMs>120000?1:0))",
        ]
      interval: 15s
      timeout: 5s
      retries: 4

volumes:
  postgres_data:
  redis_data:
  worker_runs:
  worker_evidence:

networks:
  scan_sandbox:
    name: "${LYRASHIELD_ENGINE_SANDBOX_NETWORK:-lyrashield-sandbox}"
    # DEV ONLY: allow sandbox egress so repository scans can clone public repos.
    # Production must run on an egress-restricted network with an approved proxy.
    internal: false
