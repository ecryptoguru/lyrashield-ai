id: lyrashield
name: LyraShield AI
description: Evidence-backed release assurance for AI-built software. Run security scans, review findings, and drive the fix -> verify loop from your agent.
author: LyraShield AI
url: https://github.com/ecryptoguru/lyrashield-marketplace
category: security
tags:
  - security
  - appsec
  - release-assurance
  - mcp
prerequisites:
  - Node.js (for NPX option)
content:
  - name: NPX
    prerequisites:
      - Node.js
    content: |
      {
        "type": "local",
        "command": ["npx", "-y", "@lyrashield/mcp@0.2.2"],
        "environment": {
          "LYRASHIELD_API_KEY": "{env:LYRASHIELD_API_KEY}"
        }
      }
  - name: Streamable HTTP
    content: |
      {
        "type": "remote",
        "url": "https://app.lyrashieldai.com/api/mcp",
        "headers": {
          "Authorization": "Bearer {env:LYRASHIELD_API_KEY}"
        }
      }
parameters:
  - name: LyraShield API Key
    key: LYRASHIELD_API_KEY
    placeholder: Set LYRASHIELD_API_KEY in your environment
