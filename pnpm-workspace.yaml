packages:
  - "apps/*"
  - "apps/desktop/frontend"
  - "packages/*"

overrides:
  nanoid: ">=3.3.17"
  "@hono/node-server": ">=2.0.5"
  "@better-auth/core": "1.7.0-beta.10"
  esbuild: ">=0.28.1"
  fast-uri: ">=4.1.2"
  hono: ">=4.12.34"
  kysely: "0.28.17"
  brace-expansion: ">=5.0.9"
  minimatch: ">=10.0.1"
  # GHSA-ggr8-5vv4-36mx: deepmerge-ts <8.0.0 has a stack-exhaustion vuln.
  # Transitive via c12; force the fixed line.
  deepmerge-ts: ">=8.0.0"
  next: ">=16.2.11"
  postcss: ">=8.5.18"
  sharp: ">=0.35.3"
  undici: ">=7.29.0"
  dompurify: ">=3.4.13"
  valibot: ">=1.4.2"
  find-my-way: ">=9.6.1"
  "js-yaml@<4.3.1": "^4.3.1"

peerDependencyRules:
  allowedVersions:
    "@cloudflare/workers-types": ">=5.20260724.1"
    tailwindcss: ">=4.0.0"

onlyBuiltDependencies:
  - "@prisma/engines"
  - "esbuild"
  - "msgpackr-extract"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": false
  core-js: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAge: 7
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.3"
  - "@turbo/darwin-arm64@2.10.3"
  - "@turbo/linux-64@2.10.3"
  - "@turbo/linux-arm64@2.10.3"
  - "@turbo/windows-64@2.10.3"
  - "@turbo/windows-arm64@2.10.3"
  - turbo@2.10.3
