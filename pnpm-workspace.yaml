packages:
  - "apps/*"
  - "apps/desktop/frontend"
  - "packages/*"

overrides:
  nanoid: ">=3.3.17"
  "@hono/node-server": ">=2.0.5"
  "@better-auth/core": "1.7.1"
  esbuild: ">=0.28.1"
  fast-uri: ">=4.1.3"
  hono: ">=4.12.34"
  kysely: "0.28.17"
  brace-expansion: ">=5.0.9"
  minimatch: ">=10.0.1"
  # GHSA-ggr8-5vv4-36mx: deepmerge-ts <8.0.0 has a stack-exhaustion vuln.
  # Transitive via c12; force the fixed line.
  deepmerge-ts: ">=8.0.0"
  next: ">=16.2.11"
  postcss: ">=8.5.18"
  sharp: ">=0.35.3"
  undici: ">=8.10.0"
  dompurify: ">=3.4.13"
  valibot: ">=1.4.2"
  find-my-way: ">=9.6.1"
  "js-yaml@<4.3.1": "^4.3.1"
  # GHSA-w5hq-g745-h8pq: uuid <11.1.1 has a missing buffer bounds check.
  # Transitive via @sentry/nextjs > @sentry/webpack-plugin.
  uuid: ">=11.1.1"
  # GHSA-3f6p-5ww8-9rcr: mysql2 <3.22.0 can downgrade auth to plaintext.
  # Optional through Prisma and Better Auth; force the compatible fixed release.
  mysql2: "3.22.0"

peerDependencyRules:
  allowedVersions:
    "@cloudflare/workers-types": ">=5.20260724.1"
    tailwindcss: ">=4.0.0"

onlyBuiltDependencies:
  - "@prisma/engines"
  - "esbuild"
  - "msgpackr-extract"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": false
  core-js: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true
# pnpm 12: keep the CI toolchain literal. globalShims (default on in pnpm 12)
# would make a globally installed node follow the version pinned by whatever
# project the working directory is in — unwelcome on CI agents that run one
# fixed Node toolchain provisioned by pnpm/setup + actions/setup-node.
globalShims: false

# pnpm 12 records the packageManager pin in pnpm-lock.yaml
# (packageManagerDependencies env document) on every command and enforces it
# on frozen installs. Version enforcement for CI is already handled by the
# pnpm/setup action, which installs exactly the packageManager pin — so the
# in-lockfile recording is redundant here. It dirties the tree on any
# pnpm invocation (breaking the engine-worker contract job's cleanliness
# check) and fails frozen installs until the lockfile is regenerated. Turn
# the in-pnpm enforcement off; the packageManager field still pins the
# version for every tool that reads it (pnpm/setup, corepack, dev machines).
pmOnFail: ignore

minimumReleaseAge: 7
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.3"
  - "@turbo/darwin-arm64@2.10.3"
  - "@turbo/linux-64@2.10.3"
  - "@turbo/linux-arm64@2.10.3"
  - "@turbo/windows-64@2.10.3"
  - "@turbo/windows-arm64@2.10.3"
  - turbo@2.10.3
