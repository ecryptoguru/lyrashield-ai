packages:
  - "apps/*"
  - "packages/*"

overrides:
  "@hono/node-server": ">=2.0.5"
  esbuild: ">=0.28.1"
  fast-uri: ">=3.1.4"
  minimatch: ">=10.0.1"
  next: ">=16.2.11"
  postcss: ">=8.5.18"
  sharp: ">=0.35.3"
  valibot: ">=1.2.0"
  find-my-way: ">=9.6.1"

onlyBuiltDependencies:
  - "@prisma/engines"
  - "esbuild"
  - "msgpackr-extract"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
allowBuilds:
  "@prisma/engines": true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAge: 7
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.3"
  - "@turbo/darwin-arm64@2.10.3"
  - "@turbo/linux-64@2.10.3"
  - "@turbo/linux-arm64@2.10.3"
  - "@turbo/windows-64@2.10.3"
  - "@turbo/windows-arm64@2.10.3"
  - turbo@2.10.3
