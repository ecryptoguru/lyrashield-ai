packages:
  - "apps/*"
  - "apps/desktop/frontend"
  - "packages/*"

catalog:
  typescript: ^6.0.3
  "@types/node": ^24.0.0
  zod: 4.6.6
  vitest: ^4.1.12
  "@vitest/coverage-v8": ^4.1.12
  tsup: ^8.5.1
  tsx: ^4.23.12
  react: ^19.2.8
  "react-dom": ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  eslint: ^9.39.5
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  vite: ^8.2.4
  yaml: ^2.9.0

overrides:
  # GHSA-rj75-hqrm-r3gf: typography uses the retained selector AST APIs.
  "@tailwindcss/typography@0.5.20>postcss-selector-parser": "7.1.6"
  # GHSA-238p-pmpm-9mq7: the math extension uses the retained public renderer.
  "micromark-extension-math@3.1.0>katex": "0.18.2"
  # Astro 7.3 requires the adapter's new prerender API; keep its supported plugin
  # at the minimum compatible release for the existing Wrangler 4.125 toolchain.
  "@astrojs/cloudflare@14.3.0>@cloudflare/vite-plugin": "1.53.0"
  # GHSA-mrhx-c7xc-m3w5: reject oversized constrained collections before element parsing.
  "zod@>=4 <4.6.6": 4.6.6
  # GHSA-27r3-jxmh-p828: handle decoder errors after compressed request bodies.
  "body-parser@>=2 <2.4.0": "2.4.0"
  # GHSA-xcx6-jx8p-x3h5: fixed authorization-code endpoint validation.
  # v6/v7 breaks only interactive browser-loopback options; our managed identity path is covered.
  "@azure/msal-node@>=5 <7.1.0": "7.1.0"
  # IPv6 classification, cross-family subnet and bounded-parser fixes, including GHSA-rxp7-6hxx-x8q5.
  "ip-address@<10.7.4": "10.7.4"
  # GHSA-2v37-7h3g-55p8: keep postcss on the patched nanoid 3.x line.
  "nanoid@<3.3.18": "^3.3.19"
  # GHSA-9mqv-5hh9-4cgg and GHSA-frvp-7c67-39w9: patch node-server 2.x.
  "@hono/node-server@<2.0.10": "^2.0.10"
  # GHSA-cg2g-xh64-v4q7 and GHSA-mrv2-3pqr-j5jr: patch DOMPurify 3.x.
  "dompurify@>=3 <3.4.17": "3.4.17"
  # Keep the auth package family aligned for GHSA-965c-763c-88jm and GHSA-r4xp-prcw-77qf.
  "@better-auth/core": "1.7.7"
  # GHSA-gv7w-rqvm-qjhr and GHSA-g7r4-m6w7-qqqr: keep affected esbuild below 0.28.1 out.
  "esbuild@<0.28.1": "^0.28.1"
  # fast-uri 3.x fixes: GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7,
  # GHSA-fph4-wmhf-6fwf, GHSA-f65p-4m7j-42xc, GHSA-5jgf-p345-68v8,
  # GHSA-jqff-g426-hqxp, GHSA-58mr-gqgx-xq4g, GHSA-qw65-cvwx-89v3,
  # GHSA-hrr3-gc8f-f4qj, GHSA-w74x-v6f9-j3xg, GHSA-xhq7-xmqj-769h,
  # GHSA-wjr9-j795-jxcr and GHSA-333x-w4r6-6crp.
  "fast-uri@>=3 <3.1.9": "3.1.9"
  # GHSA-g6gw-c38x-mqfc and GHSA-5r4p-p66f-jhc7: bound Hono to the patched 4.x line.
  "hono@<4.13.11": "4.13.11"
  # Kept pending auth-owner confirmation; 0.28.17 is the known fixed line.
  kysely: "0.28.17"
  # GHSA-rgw5-rvv9-x895, GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p:
  # patch brace-expansion 1.x and 5.x without changing majors.
  "brace-expansion@<1.1.18": "^1.1.21"
  "brace-expansion@>=5 <5.0.12": "^5.0.12"
  # GHSA-542g-h47m-68v8: Razorpay's transitive Axios must include the HTTP/2 fix.
  "axios@<1.20.0": "1.20.0"
  # GHSA-7r86-cg39-jmmj and GHSA-23c5-xmqv-rm74: keep affected minimatch lines patched.
  "minimatch@<3.1.4": "^3.1.5"
  "minimatch@>=10 <10.2.3": "^10.2.3"
  # GHSA-ggr8-5vv4-36mx: @prisma/config pins an affected pre-8 release.
  "deepmerge-ts@<8.0.0": "^8.0.0"
  # GHSA-2464-fhr4-w9xw, GHSA-p3m5-59mp-jv5r, and GHSA-673q-mjm6-r5xr.
  "next@>=16 <16.4.1": "16.4.1"
  # GHSA-587h-7wmj-h5pm: patch the affected Vite 8.2.x editor handling.
  "vite@>=8.2.0 <8.2.4": "8.2.4"
  # GHSA-q3jh-wrc6-jgq8, GHSA-8r9p-f939-6h3c and GHSA-mrwp-f3q8-3g9p:
  # preserve redirect header isolation, including cross-realm header lists.
  "follow-redirects@>=1.16.0 <1.16.2": "1.16.2"
  # GHSA-r7fv-28h4-cvq7 and GHSA-gfr2-rv44-r23c: bound Markdown parser work.
  "markdown-it@>=14 <14.3.3": "14.3.3"
  # GHSA-fxqj-rqcc-2cmp: patched PostCSS starts at 8.5.23.
  "postcss@<8.5.23": "^8.5.26"
  # GHSA-rgj7-g3m4-5g8c and GHSA-wq5f-xc86-pv6w: keep Sharp on its patched 0.35.x line.
  "sharp@<0.35.5": "^0.35.5"
  # GHSA-xjj6-f33q-929c additionally fixes orphaned content-decoding errors on both lines.
  # GHSA-4cwx-7wf7-3272, GHSA-jr45-8vmc-qm54, and GHSA-pmjh-fq2x-6v4x: patch undici 7.x.
  "undici@>=7 <7.30.1": "7.30.1"
  # GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3, GHSA-vp8m-p9jh-q5pm.
  "undici@>=8 <8.12.2": "8.12.2"
  # GHSA-2883-xcg3-v3hh: Astro and @eslint/eslintrc still admit vulnerable js-yaml.
  "js-yaml@<4.3.2": "^4.3.2"
  # GHSA-r3ph-w7gj-g6xm: bound merge-source CPU work on the separate 5.x line.
  "js-yaml@>=5 <5.4.1": "5.4.1"
  # GHSA-w27v-7q3p-w38r: Astro still admits vulnerable svgo.
  "svgo@<4.1.0": "^4.1.0"
  # GHSA-4mjr-xmp4-gh2g: Express admits vulnerable qs.
  "qs@<6.16.0": "^6.16.0"
  # GHSA-jqcg-44mw-7w3h: patch Express's proxy trust-subnet handling.
  "proxy-addr@<2.0.8": "^2.0.8"
  # GHSA-68fv-2mgg-jv7q: patch indexed source-map section offset handling.
  "source-map-js@<1.2.2": "^1.2.2"
  # GHSA-3f6p-5ww8-9rcr and GHSA-rgwj-5xj2-c3m3: keep Prisma/Better Auth on fixed mysql2.
  mysql2: "3.23.1"
  # GHSA-7w5x-hrqm-74c2 and GHSA-r4xh-jqrq-34v2: TOML parser DoS.
  # Astro and markdownlint must both resolve the linear-time parser.
  smol-toml: "1.9.0"

allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": false
  core-js: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true
# pnpm 12: keep the CI toolchain literal. globalShims (default on in pnpm 12)
# would make a globally installed node follow the version pinned by whatever
# project the working directory is in — unwelcome on CI agents that run one
# fixed Node toolchain provisioned by pnpm/setup + actions/setup-node.
globalShims: false

# pnpm 12 records the packageManager pin in pnpm-lock.yaml
# (packageManagerDependencies env document) on every command and enforces it
# on frozen installs. Version enforcement for CI is already handled by the
# pnpm/setup action, which installs exactly the packageManager pin — so the
# in-lockfile recording is redundant here. It dirties the tree on any
# pnpm invocation (breaking the engine-worker contract job's cleanliness
# check) and fails frozen installs until the lockfile is regenerated. Turn
# the in-pnpm enforcement off; the packageManager field still pins the
# version for every tool that reads it (pnpm/setup, corepack, dev machines).
pmOnFail: ignore

# pnpm interprets this as MINUTES — "7" was a 7-minute delay, no cooldown
# at all. 10080 = 7 days (VULN-H-003).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # We are the publisher of @lyrashield/* — an age gate on our own releases
  # would deadlock the publish pipeline and buys nothing (we control the
  # artifact end-to-end). Exempt the whole scope permanently.
  - "@lyrashield/*"
  # GHSA-68fv-2mgg-jv7q: allow only the published fix through the age gate.
  - "source-map-js@1.2.2"
  # GHSA-27r3-jxmh-p828: exact security fix published 2026-10-22.
  - "body-parser@2.4.0"
  # Four URI security fixes; official v3.1.9 tag/registry gitHead 0def703 verified.
  # https://github.com/fastify/fast-uri/releases/tag/v3.1.9
  - "fast-uri@3.1.9"
  # GHSA-mrwp-f3q8-3g9p: allow only the patched redirect release.
  - "follow-redirects@1.16.2"
# GHSA-ch52-4w7c-c8xp has no patched npm version as of 2026-10-03. Astro's
# remote asset helper creates a fresh Request(src) and only asks its cache
# policy for storable/timeToLive; it does not invoke the vulnerable
# evaluateRequest(max-stale) path. The characterization test must be updated
# before changing Astro usage. Remove this exception after the upstream fix:
# https://github.com/kornelski/http-cache-semantics/pull/58
auditConfig:
  ignoreGhsas:
    - GHSA-ch52-4w7c-c8xp
