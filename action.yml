name: "LyraShield Security Scan"
description: "One-step diff-aware security gate for AI-built apps: secret detection and risky-pattern checks with SARIF output."
author: "LyraShield AI"
branding:
  icon: "shield"
  color: "blue"

inputs:
  scan_mode:
    description: "Scan mode: SAFE (default) or AGGRESSIVE (also scans config/doc file types). DEEP requires the hosted LyraShield scan and is rejected by this local gate."
    required: false
    default: "SAFE"
  fail_on_severity:
    description: "Fail the check when a finding at or above this severity is present: CRITICAL, HIGH, MEDIUM, LOW, INFO."
    required: false
    default: "HIGH"
  target_ref:
    description: "Git ref/SHA to scan as HEAD. Defaults to the PR head, then the checked-out HEAD."
    required: false
    default: ""
  fetch_depth:
    description: "Checkout depth. 0 (full history) is required for accurate diff derivation."
    required: false
    default: "0"
  recorded_scan:
    description: "When 'true', submit a recorded Review Changes scan to the LyraShield API (POST /api/v1/scans) for the resolved base/head — the hosted, evidence-producing run. Requires api_key, workspace_id, and target_id. The local gate above stays advisory regardless."
    required: false
    default: "false"
  api_key:
    description: "Workspace write-scoped LyraShield API key (lsk_...). Required only when recorded_scan is 'true'."
    required: false
    default: ""
  api_url:
    description: "LyraShield API base URL for the recorded scan submission."
    required: false
    default: "https://app.lyrashieldai.com"
  workspace_id:
    description: "LyraShield workspace ID. Required only when recorded_scan is 'true'."
    required: false
    default: ""
  target_id:
    description: "LyraShield REPO target ID connected to this repository. Required only when recorded_scan is 'true'."
    required: false
    default: ""
  recorded_scan_depth:
    description: "Depth for the recorded Review Changes scan: quick, standard, or deep. Depth is always explicit — never inferred from the target."
    required: false
    default: "quick"
  base_ref:
    description: "Review Changes comparison base (branch or commit SHA) for the recorded scan. Defaults to the resolved diff base SHA."
    required: false
    default: ""
  head_ref:
    description: "Review Changes comparison head (branch or commit SHA) for the recorded scan. Defaults to the resolved diff head SHA."
    required: false
    default: ""

outputs:
  recorded_scan_id:
    description: "ID of the recorded Review Changes scan when recorded_scan is enabled; empty otherwise."
    value: ${{ steps.recorded.outputs.scan_id }}

# This is a lightweight, diff-scoped CI gate that runs entirely in the
# customer's runner with the customer's GITHUB_TOKEN — it does not call the
# hosted LyraShield engine unless recorded_scan is explicitly enabled, in
# which case it submits a recorded Review Changes scan (immutable diff-scope
# execution plan) and reports the scan id; the hosted run executes
# asynchronously on LyraShield. It uses gitleaks for secret detection plus a
# set of high-signal risky-pattern checks, and emits SARIF. The SARIF upload
# is a findings upload only — never a verification claim. For the full
# agentic scan, connect the target in the LyraShield app
# (or use the MCP server / REST API). All third-party actions are SHA-pinned
# and the action requests no elevated permissions of its own; the calling job
# controls the token scope (security-events: write is needed only to publish
# SARIF to Code Scanning, which is optional — the gate is authoritative
# regardless).
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch_depth }}

    - name: Resolve diff range and inputs
      id: diff
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TARGET_REF_INPUT: ${{ inputs.target_ref }}
        SCAN_MODE_INPUT: ${{ inputs.scan_mode }}
        FAIL_ON_SEVERITY_INPUT: ${{ inputs.fail_on_severity }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "pull_request" ]; then
          BASE_CANDIDATE="$PR_BASE_SHA"
        else
          BASE_CANDIDATE="HEAD~1"
        fi
        if [ -n "$TARGET_REF_INPUT" ]; then
          HEAD_CANDIDATE="$TARGET_REF_INPUT"
        elif [ -n "$PR_HEAD_SHA" ]; then
          HEAD_CANDIDATE="$PR_HEAD_SHA"
        else
          HEAD_CANDIDATE="HEAD"
        fi
        if ! BASE="$(git rev-parse --verify --end-of-options "$BASE_CANDIDATE^{commit}")"; then
          echo "::error::Invalid or unavailable base ref"; exit 1
        fi
        if ! HEAD="$(git rev-parse --verify --end-of-options "$HEAD_CANDIDATE^{commit}")"; then
          echo "::error::Invalid or unavailable target_ref"; exit 1
        fi
        SCAN_MODE="${SCAN_MODE_INPUT:-SAFE}"
        case "$SCAN_MODE" in
          SAFE|AGGRESSIVE) ;;
          DEEP) echo "::error::scan_mode DEEP requires the hosted LyraShield app, MCP server, or REST API; this local Action supports SAFE and AGGRESSIVE only"; exit 1 ;;
          *) echo "::error::Invalid scan mode"; exit 1 ;;
        esac
        SEVERITY="${FAIL_ON_SEVERITY_INPUT:-HIGH}"
        case "$SEVERITY" in
          CRITICAL|HIGH|MEDIUM|LOW|INFO) ;;
          *) echo "::error::Invalid fail_on_severity"; exit 1 ;;
        esac
        echo "::notice::LyraShield scan mode: $SCAN_MODE (fail on: $SEVERITY)"
        echo "scan_mode=$SCAN_MODE" >> "$GITHUB_OUTPUT"
        echo "fail_on_severity=$SEVERITY" >> "$GITHUB_OUTPUT"
        echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"
        echo "head_sha=$HEAD" >> "$GITHUB_OUTPUT"
        git diff --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changed_files.txt"

    - name: Secret scan (gitleaks)
      id: secrets
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        GITLEAKS_ENABLE_SUMMARY: "true"
        GITLEAKS_LOG_OPTS: ${{ steps.diff.outputs.base_sha }}..${{ steps.diff.outputs.head_sha }}
      continue-on-error: true

    - name: Build SARIF and evaluate gate
      id: gate
      shell: bash
      env:
        SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
        BASE_SHA: ${{ steps.diff.outputs.base_sha }}
        HEAD_SHA: ${{ steps.diff.outputs.head_sha }}
        SEVERITY: ${{ steps.diff.outputs.fail_on_severity }}
      run: |
        set -euo pipefail
        RESULTS_FILE="$(mktemp)"
        echo "[]" > "$RESULTS_FILE"

        # Aggregate findings are repository-scoped; GitHub requires a location.
        add_result() {
          local rule_id="$1" level="$2" message="$3" file="${4:-.}" entry
          entry="$(jq -n --arg ruleId "$rule_id" --arg level "$level" --arg text "$message" --arg file "$file" \
            '{ruleId:$ruleId,level:$level,message:{text:$text},locations:[{physicalLocation:{artifactLocation:{uri:$file}}}]}')"
          jq --argjson e "$entry" '. + [$e]' "$RESULTS_FILE" > "${RESULTS_FILE}.tmp"
          mv "${RESULTS_FILE}.tmp" "$RESULTS_FILE"
        }

        # Return the higher-ranked of two severity strings so the gate reflects the
        # worst finding across the whole diff, not just the last one checked.
        bump_severity() {
          local a="$1" b="$2"
          case "$a" in
            CRITICAL) echo "$a"; return ;;
            HIGH) if [ "$b" = "CRITICAL" ]; then echo "$b"; else echo "$a"; fi; return ;;
            MEDIUM) if [ "$b" = "CRITICAL" ] || [ "$b" = "HIGH" ]; then echo "$b"; else echo "$a"; fi; return ;;
            LOW) if [ "$b" = "CRITICAL" ] || [ "$b" = "HIGH" ] || [ "$b" = "MEDIUM" ]; then echo "$b"; else echo "$a"; fi; return ;;
            INFO) if [ "$b" = "NONE" ]; then echo "$a"; else echo "$b"; fi; return ;;
            *) echo "$b"; return ;;
          esac
        }

        SECRETS=0
        if [ "$SECRETS_OUTCOME" = "failure" ]; then
          SECRETS=1
          add_result "secret-exposure" "error" "gitleaks detected potential secret(s) in the diff — see the gitleaks step log for file/line detail" ""
        fi

        # High-signal risky-pattern checks on added lines of changed files.
        # SOURCE OF TRUTH: packages/cli/src/diff-core.ts (RISKY_PATTERNS).
        # These grep -E patterns are the bash mirror of that TypeScript table
        # so the action stays self-contained on runners without a Node
        # runtime. They MUST stay aligned — rule IDs, regexes, severities,
        # levels, and messages are guarded by
        # packages/cli/src/__tests__/action-patterns.drift.test.ts, which
        # fails CI when either copy drifts. Change both together.
        ISSUES=0
        ISSUES_SEVERITY="NONE"
        # Track the most severe issue found across all changed files.
        while IFS= read -r -d '' file; do
          [ -f "$file" ] || continue
          ADDED="$(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- "$file" | grep -v '^+++' | sed -n 's/^+//p' || true)"
          if grep -qiE '(password|secret|api_key|apikey|token)[[:space:]]*[=:][[:space:]]*["'"'"'][^"'"'"']{8,}["'"'"']' <<< "$ADDED"; then
            add_result "hardcoded-secret" "warning" "Potential hardcoded secret in $file" "$file"; ISSUES=1; ISSUES_SEVERITY=$(bump_severity "$ISSUES_SEVERITY" "MEDIUM")
          fi
          if grep -qiE '(SELECT|INSERT|UPDATE|DELETE).*\+.*\$\{' <<< "$ADDED"; then
            add_result "sql-injection" "warning" "Potential SQL injection in $file" "$file"; ISSUES=1; ISSUES_SEVERITY=$(bump_severity "$ISSUES_SEVERITY" "MEDIUM")
          fi
          if grep -qiE '(csrf|cors|xss|helmet|secure)[[:space:]]*[:=][[:space:]]*(false|disabled|off|none)' <<< "$ADDED"; then
            add_result "disabled-security-control" "warning" "Security control may be disabled in $file" "$file"; ISSUES=1; ISSUES_SEVERITY=$(bump_severity "$ISSUES_SEVERITY" "MEDIUM")
          fi
          if grep -qiE '(^|[^.[:alnum:]_])(eval|exec)[[:space:]]*\(' <<< "$ADDED"; then
            add_result "eval-exec" "error" "Use of eval/exec in $file" "$file"; ISSUES=1; ISSUES_SEVERITY=$(bump_severity "$ISSUES_SEVERITY" "HIGH")
          fi

          # The self-contained Action cannot safely derive WebMCP control flow.
          # Read the final file so edits limited to an existing handler still
          # receive a fail-closed result. Arbitrary confirmation text is not
          # evidence of a visible confirmation boundary; use the CLI's full
          # structural analyzer for complete WebMCP coverage.
          FINAL_CONTENT="$(git show "$HEAD_SHA:$file" 2>/dev/null || true)"
          if grep -qiE 'document[[:space:]]*\.[[:space:]]*modelContext[[:space:]]*\.[[:space:]]*registerTool[[:space:]]*\(|<form[^>]*(toolname|tool-name)[[:space:]]*=' <<< "$FINAL_CONTENT" &&
            grep -qiE "(method[[:space:]]*:[[:space:]]*[\"'](POST|PUT|PATCH|DELETE)[\"']|\.(post|put|patch|delete)[[:space:]]*\(|<form[^>]*method[[:space:]]*=[[:space:]]*[\"'](post|put|patch|delete)[\"'])" <<< "$ADDED"; then
            add_result "WEBMCP-COVERAGE-INCOMPLETE" "error" "Changed WebMCP mutation behavior in $file cannot be structurally assessed by this self-contained Action; run lyrashield check-diff for full analyzer coverage" "$file"; ISSUES=1; ISSUES_SEVERITY=$(bump_severity "$ISSUES_SEVERITY" "HIGH")
          fi

          # WebMCP high-confidence local checks. Source of truth for rule IDs
          # and severities is @lyrashield/security/webmcp (controls.ts); the
          # Bash mirror here is guarded by
          # packages/cli/src/__tests__/action-patterns.drift.test.ts.
          # These patterns intentionally inspect only added lines and are tuned
          # for low false-positive rate on common tool-definition shapes.
          if grep -qiE 'modelContext[.]registerTool|<form[^>]+toolname[[:space:]]*=' <<< "$ADDED"; then
          if grep -qiE 'name[[:space:]]*:[[:space:]]*["'"'"'][^"'"'"']+["'"'"']' <<< "$ADDED" && grep -qiE 'description[[:space:]]*:[[:space:]]*["'"'"']{2}|description[[:space:]]*:[[:space:]]*null' <<< "$ADDED"; then
            add_result "WEBMCP-10" "warning" "WebMCP tool may have an empty or missing description in $file" "$file"; ISSUES=1; ISSUES_SEVERITY=$(bump_severity "$ISSUES_SEVERITY" "MEDIUM")
          fi
          if grep -qiE 'readOnlyHint[[:space:]]*:[[:space:]]*true' <<< "$ADDED" && grep -qiE '(write|delete|update|create|save|remove|modify|persist)' <<< "$ADDED"; then
            add_result "WEBMCP-01" "error" "WebMCP tool annotation/behavior mismatch in $file" "$file"; ISSUES=1; ISSUES_SEVERITY=$(bump_severity "$ISSUES_SEVERITY" "HIGH")
          fi
          if grep -qiE 'exposedTo[[:space:]]*:[[:space:]]*["'"'"']?\*["'"'"']?' <<< "$ADDED" || grep -qiE 'target[[:space:]]*=[[:space:]]*["'"'"']?\*["'"'"']?' <<< "$ADDED"; then
            add_result "WEBMCP-03" "error" "WebMCP tool may expose surface to a wildcard or dynamic origin in $file" "$file"; ISSUES=1; ISSUES_SEVERITY=$(bump_severity "$ISSUES_SEVERITY" "HIGH")
          fi
          if { grep -qiE 'method[[:space:]]*:[[:space:]]*["'"'"']?(POST|PUT|PATCH|DELETE)' <<< "$ADDED" || grep -qiE 'behavior[[:space:]]*:[[:space:]]*["'"'"']?mutation' <<< "$ADDED" || { grep -qiE '<form[^>]+toolname[[:space:]]*=' <<< "$ADDED" && grep -qiE 'method[[:space:]]*=[[:space:]]*["'"'"']?(POST|PUT|PATCH|DELETE)' <<< "$ADDED" && grep -qiE 'toolautosubmit([[:space:]]|=|>)' <<< "$ADDED"; }; } && ! grep -qiE 'confirm|dialog|prompt' <<< "$ADDED"; then
            add_result "WEBMCP-05" "error" "WebMCP durable mutation may lack a confirmation boundary in $file" "$file"; ISSUES=1; ISSUES_SEVERITY=$(bump_severity "$ISSUES_SEVERITY" "CRITICAL")
          fi
          fi
        done < "$RUNNER_TEMP/changed_files.txt"

        SARIF_FILE="$RUNNER_TEMP/lyrashield-results.sarif"
        jq -n --slurpfile results "$RESULTS_FILE" '{
          "version":"2.1.0",
          "$schema":"https://json.schemastore.org/sarif-2.1.0.json",
          "runs":[{"tool":{"driver":{"name":"LyraShield GitHub Action","version":"2.0.0","informationUri":"https://github.com/ecryptoguru/lyrashield-ai"}},"results":$results[0]}]
        }' > "$SARIF_FILE"
        echo "SARIF results count: $(jq '.runs[0].results | length' "$SARIF_FILE")"
        echo "sarif_file=$SARIF_FILE" >> "$GITHUB_OUTPUT"

        rank() {
          case "$(echo "$1" | tr '[:upper:]' '[:lower:]')" in
            critical) echo 5;; high) echo 4;; medium) echo 3;; low) echo 2;; info) echo 1;; *) echo 0;;
          esac
        }
        THRESHOLD_RANK="$(rank "$SEVERITY")"
        TOTAL=0
        # Secrets are always CRITICAL.
        if [ "$SECRETS" = "1" ] && [ "$(rank CRITICAL)" -ge "$THRESHOLD_RANK" ]; then TOTAL=$((TOTAL+1)); fi
        if [ "$ISSUES" = "1" ] && [ "$(rank "$ISSUES_SEVERITY")" -ge "$THRESHOLD_RANK" ]; then TOTAL=$((TOTAL+1)); fi
        if [ "$TOTAL" -gt 0 ]; then
          echo "::error::LyraShield gate failed — $TOTAL issue category(ies) at $SEVERITY severity or above"
          echo "failed=1" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::LyraShield gate passed — no issues at $SEVERITY severity or above"
          echo "failed=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Archive SARIF
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lyrashield-results
        path: ${{ steps.gate.outputs.sarif_file }}
        if-no-files-found: warn

    - name: Publish SARIF to GitHub Code Scanning
      if: always()
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        sarif_file: ${{ steps.gate.outputs.sarif_file }}
        category: lyrashield-diff-scan

    - name: Submit recorded Review Changes scan
      id: recorded
      if: inputs.recorded_scan == 'true'
      shell: bash
      env:
        API_KEY: ${{ inputs.api_key }}
        API_URL: ${{ inputs.api_url }}
        WORKSPACE_ID: ${{ inputs.workspace_id }}
        TARGET_ID: ${{ inputs.target_id }}
        DEPTH_INPUT: ${{ inputs.recorded_scan_depth }}
        BASE_REF_INPUT: ${{ inputs.base_ref }}
        HEAD_REF_INPUT: ${{ inputs.head_ref }}
        BASE_SHA: ${{ steps.diff.outputs.base_sha }}
        HEAD_SHA: ${{ steps.diff.outputs.head_sha }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        # Recorded scans are the evidence-producing path: the API resolves the
        # refs to immutable git object IDs and the server-owned execution plan
        # binds them. The advisory gate above is unchanged either way.
        if [ -z "$API_KEY" ] || [ -z "$WORKSPACE_ID" ] || [ -z "$TARGET_ID" ]; then
          echo "::error::recorded_scan requires api_key, workspace_id, and target_id"
          exit 1
        fi
        case "$(echo "$DEPTH_INPUT" | tr '[:upper:]' '[:lower:]')" in
          quick) MODE="QUICK" ;;
          standard) MODE="STANDARD" ;;
          deep) MODE="DEEP" ;;
          *) echo "::error::Invalid recorded_scan_depth (quick|standard|deep)"; exit 1 ;;
        esac
        BASE="${BASE_REF_INPUT:-$BASE_SHA}"
        HEAD="${HEAD_REF_INPUT:-$HEAD_SHA}"
        if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
          echo "::error::recorded_scan requires a resolvable base/head for the Review Changes comparison"
          exit 1
        fi
        echo "::add-mask::$API_KEY"
        # Stable retry identity: rerunning the job for the same comparison
        # returns the existing scan instead of billing a duplicate. git
        # hash-object is portable across every hosted runner image.
        IDEMPOTENCY_KEY="gha:$(printf '%s' "${REPOSITORY}:${BASE}:${HEAD}" | git hash-object --stdin)"
        RESPONSE="$(mktemp)"
        HTTP_CODE="$(curl -sS -o "$RESPONSE" -w '%{http_code}' \
          -X POST "${API_URL%/}/api/v1/scans" \
          -H "Authorization: Bearer $API_KEY" \
          -H "Content-Type: application/json" \
          -H "Idempotency-Key: $IDEMPOTENCY_KEY" \
          -d "$(jq -n \
            --arg workspaceId "$WORKSPACE_ID" \
            --arg targetId "$TARGET_ID" \
            --arg mode "$MODE" \
            --arg baseRef "$BASE" \
            --arg headRef "$HEAD" \
            '{workspaceId:$workspaceId,targetId:$targetId,goal:"CHECK_PR",mode:$mode,workflow:"REVIEW_CHANGES",baseRef:$baseRef,headRef:$headRef}')")"
        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          SCAN_ID="$(jq -r '.data.id // empty' "$RESPONSE")"
          if [ -z "$SCAN_ID" ]; then
            echo "::error::recorded scan accepted but no scan id was returned"
            exit 1
          fi
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"
          echo "::notice::Recorded Review Changes scan $SCAN_ID submitted (${API_URL%/}/dashboard — immutable diff $BASE...$HEAD, depth $MODE)"
        else
          CODE="$(jq -r '.error.code // empty' "$RESPONSE" 2>/dev/null || true)"
          MSG="$(jq -r '.error.message // empty' "$RESPONSE" 2>/dev/null || true)"
          echo "::error::Recorded scan submission failed ($HTTP_CODE): ${CODE:-unknown}${MSG:+ — $MSG}"
          exit 1
        fi

    - name: Enforce gate
      if: steps.gate.outputs.failed == '1'
      shell: bash
      run: |
        echo "::error::LyraShield security gate failed. See findings above and the SARIF artifact."
        exit 1
